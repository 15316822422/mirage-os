function showDialog(options) {
  const layer = $('#modal-layer');
  const modal = $('#modal');
  const onEsc = (event) => {
    if (event.key === 'Escape') {
      event.stopPropagation();
      cancel();
    }
  };
  let finished = false;
  const close = () => {
    if (finished) return;
    finished = true;
    layer.classList.remove('open');
    layer.setAttribute('aria-hidden', 'true');
    modal.innerHTML = '';
    document.removeEventListener('keydown', onEsc, true);
  };
  const cancel = () => {
    if (finished) return;
    close();
    if (typeof options.onCancel === 'function') options.onCancel();
  };

  modal.innerHTML = '';
  const dialog = document.createElement('div');
  dialog.className = 'dialog';
  dialog.setAttribute('role', 'dialog');
  dialog.setAttribute('aria-modal', 'true');
  const heading = document.createElement('h3');
  heading.textContent = options.title || '提示';
  dialog.appendChild(heading);
  if (options.message) {
    const p = document.createElement('p');
    p.textContent = options.message;
    dialog.appendChild(p);
  }
  let input = null;
  if (options.input) {
    input = document.createElement('input');
    input.type = 'text';
    input.value = options.value || '';
    input.placeholder = options.placeholder || '';
    input.spellcheck = false;
    input.autocomplete = 'off';
    dialog.appendChild(input);
  }
  const actions = document.createElement('div');
  actions.className = 'dialog-actions';
  if (options.cancelText !== null) {
    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn ghost';
    cancelBtn.textContent = options.cancelText || '取消';
    cancelBtn.addEventListener('click', cancel);
    actions.appendChild(cancelBtn);
  }
  const confirmBtn = document.createElement('button');
  confirmBtn.className = 'btn ' + (options.danger ? 'danger' : 'primary');
  confirmBtn.textContent = options.confirmText || '确定';
  actions.appendChild(confirmBtn);
  dialog.appendChild(actions);
  modal.appendChild(dialog);

  const submit = () => {
    const value = input ? input.value : undefined;
    if (input && options.required && !input.value.trim()) {
      input.focus();
      return;
    }
    const result = typeof options.onConfirm === 'function' ? options.onConfirm(value) : undefined;
    if (result === false) return;
    close();
  };
  confirmBtn.addEventListener('click', submit);
  if (input) {
    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        submit();
      }
    });
  }
  layer.setAttribute('aria-hidden', 'false');
  layer.classList.add('open');
  document.addEventListener('keydown', onEsc, true);
  layer.onclick = (event) => {
    if (event.target === layer) cancel();
  };
  setTimeout(() => {
    if (input) {
      input.focus();
      input.select();
      dialog.animate([
        { transform: 'translateY(10px) scale(.98)' },
        { transform: 'translateY(-2px) scale(1.002)' },
        { transform: 'none' }
      ], { duration: 260, easing: 'cubic-bezier(.16,1,.3,1)' });
    } else {
      confirmBtn.focus();
    }
  }, 40);
  return close;
}

function askConfirm(opts) {
  return new Promise((resolve) => {
    showDialog({
      title: opts.title,
      message: opts.message,
      confirmText: opts.confirmText || '确定',
      cancelText: opts.cancelText || '取消',
      danger: opts.danger,
      onConfirm: () => resolve(true),
      onCancel: () => resolve(false)
    });
  });
}

function askText(opts) {
  return new Promise((resolve) => {
    showDialog({
      title: opts.title,
      message: opts.message,
      input: true,
      required: true,
      value: opts.value || '',
      placeholder: opts.placeholder || '',
      confirmText: opts.confirmText || '确定',
      onConfirm: (value) => resolve(String(value || '').trim()),
      onCancel: () => resolve(null)
    });
  });
}

function toast(message, type = 'info', opts = {}) {
  const container = $('#toasts');
  if (!container) return;
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const ic = document.createElement('span');
  ic.className = 't-ic';
  ic.innerHTML = icon(type === 'success' ? 'check' : type === 'error' || type === 'warn' ? 'alert' : 'info', 15);
  const msg = document.createElement('span');
  msg.className = 't-msg';
  msg.textContent = String(message);
  el.append(ic, msg);
  if (opts.action && typeof opts.onAction === 'function') {
    const action = document.createElement('button');
    action.className = 't-act';
    action.textContent = opts.action;
    action.addEventListener('click', () => {
      opts.onAction();
      remove();
    });
    el.appendChild(action);
  }
  container.appendChild(el);
  while (container.children.length > 4) container.firstElementChild.remove();
  let removed = false;
  const remove = () => {
    if (removed) return;
    removed = true;
    el.classList.add('out');
    setTimeout(() => el.remove(), 250);
  };
  const timer = setTimeout(remove, opts.duration || 4200);
  el.addEventListener('click', (event) => {
    if (event.target.closest('.t-act')) return;
    clearTimeout(timer);
    remove();
  });
}

function startClock() {
  const timeEl = $('#clock-time');
  const dateEl = $('#clock-date');
  if (!timeEl || !dateEl) return;
  const update = () => {
    const now = new Date();
    timeEl.textContent = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false });
    try {
      dateEl.textContent = new Intl.DateTimeFormat('zh-CN', { month: 'numeric', day: 'numeric', weekday: 'short' }).format(now);
    } catch (err) {
      dateEl.textContent = now.toLocaleDateString();
    }
  };
  update();
  clearTimeout(clockTimer);
  const loop = () => {
    update();
    clockTimer = setTimeout(loop, 1000 - (Date.now() % 1000) + 25);
  };
  clockTimer = setTimeout(loop, 1000 - (Date.now() % 1000) + 25);
}

function showDesktop() {
  const open = [...state.windows.values()].filter((win) => !win.minimized);
  if (open.length) {
    open.forEach((win) => minimizeWindow(win));
  } else {
    [...state.windows.values()].forEach((win) => restoreWindow(win));
  }
}

function cycleWindows() {
  const wins = [...state.windows.values()].sort((a, b) => Number(a.el.style.zIndex || 0) - Number(b.el.style.zIndex || 0));
  if (!wins.length) return;
  const visible = wins.filter((win) => !win.minimized);
  const pool = visible.length ? visible : wins;
  const current = pool.findIndex((win) => win.key === state.activeKey);
  const next = pool[(current + 1 + pool.length) % pool.length];
  if (next.minimized) restoreWindow(next);
  else focusWindow(next);
}

  });

    }

  $('#tb-showdesk').addEventListener('click', () => {

    showDesktop();
  });

    const files = Array.from(event.target.files || []);
    event.target.value = '';
    if (files.length) importFiles(files);
  });
  $('#wallpaper-input').addEventListener('change', (event) => {
    const file = event.target.files && event.target.files[0];
    event.target.value = '';
    if (file) setCustomWallpaper(file);
  });

  $('#desktop').addEventListener('pointerdown', (event) => {
    if (event.target.closest('.d-icon')) return;
    clearIconSelection();
  });
  $('#desktop').addEventListener('contextmenu', (event) => {
    if (event.target.closest('.d-icon')) return;
    event.preventDefault();
    closeStart();
    clearIconSelection();
    showDesktopMenu(event.clientX, event.clientY);
  });
  $('#desktop').addEventListener('dblclick', (event) => {
    if (event.target.closest('.d-icon')) return;
    closeStart();
    closeMenu();
  });

  document.addEventListener('pointerdown', (event) => {
    if (event.target.closest('#start') || event.target.closest('#taskbar')) return;
    closeStart();
    if (!event.target.closest('#ctx')) closeMenu();
  });

  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
      closeMenu();
      closeStart();
    }
    if ((event.ctrlKey || event.metaKey) && (event.key === 'k' || event.key === 'K')) {
      event.preventDefault();
      openStart(true);
    }
    if ((event.ctrlKey || event.metaKey) && (event.key === 'o' || event.key === 'O') && !event.shiftKey) {
      event.preventDefault();
      pickFiles();
    }
    if ((event.ctrlKey || event.metaKey) && event.shiftKey && (event.key === 'e' || event.key === 'E')) {
      event.preventDefault();
      exportSystem();
    }
    if (event.altKey && event.key === 'Tab') {
      event.preventDefault();
      cycleWindows();
    }
  });

  window.addEventListener('dragenter', (event) => {
    if (!event.dataTransfer || !Array.from(event.dataTransfer.types || []).includes('Files')) return;
    event.preventDefault();
    dragDepth += 1;
    $('#dropzone').classList.add('show');
  });
  window.addEventListener('dragover', (event) => {
    if (!event.dataTransfer || !Array.from(event.dataTransfer.types || []).includes('Files')) return;
    event.preventDefault();
    event.dataTransfer.dropEffect = 'copy';
  });
  window.addEventListener('dragleave', () => {
    dragDepth = Math.max(0, dragDepth - 1);
    if (!dragDepth) $('#dropzone').classList.remove('show');
  });
  window.addEventListener('drop', (event) => {
    event.preventDefault();
    dragDepth = 0;
    $('#dropzone').classList.remove('show');
    if (event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files.length) {
      importFiles(Array.from(event.dataTransfer.files));
    }
  });

  document.addEventListener('contextmenu', (event) => {
    if (event.target.closest('input,textarea,[contenteditable="true"]')) return;
    if (event.target.closest('#desktop') || event.target.closest('#start') || event.target.closest('#taskbar') || event.target.closest('#ctx') || event.target.closest('#modal-layer')) return;
    event.preventDefault();
  });

  bus.addEventListener('apps-changed', () => {
    renderDesktopIcons();
    syncTaskbar();
    syncStartResults();
    syncWindowTitles();
  });

  window.matchMedia('(pointer: coarse)').addEventListener('change', () => {});
}

function renderFilesApp(root) {
  root.innerHTML =
    '<div class="files">' +
      '<div class="files-head">' +
        '<div><h2>应用库</h2><p class="sub"></p></div>' +
        '<div class="files-tools">' +
          '<label class="files-search">' + icon('search', 15) + '<input type="text" placeholder="搜索应用" autocomplete="off" spellcheck="false"></label>' +
          '<button class="btn primary" data-act="import">' + icon('import', 15) + '导入应用</button>' +
        '</div>' +
      '</div>' +
      '<div class="files-list"></div>' +
    '</div>';

  const list = $('.files-list', root);
  const query = $('.files-search input', root);
  const sub = $('.files-head .sub', root);

  const paint = () => {
    const apps = [...state.apps.values()].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    const totalSize = apps.reduce((sum, app) => sum + (Number(app.size) || 0), 0);
    sub.textContent = apps.length ? apps.length + ' 个应用 · 占用 ' + fmtBytes(totalSize) : '还没有导入任何应用';
    const q = query.value.trim().toLowerCase();
    const filtered = q
      ? apps.filter((app) => (app.name + ' ' + (app.filename || '')).toLowerCase().includes(q))
      : apps;
    list.innerHTML = '';

    if (!apps.length) {
      const empty = document.createElement('div');
      empty.className = 'files-empty';
      empty.innerHTML =
        '<span class="art">' + icon('import', 26) + '</span>' +
        '<b>应用库是空的</b>' +
        '<p>导入任意单文件 HTML，引擎会自动读取标题、图标与主题色，并把它变成桌面应用。</p>' +
        '<button class="btn primary" data-act="import">' + icon('import', 15) + '导入第一个应用</button>';
      list.appendChild(empty);
      return;
    }

    if (!filtered.length) {
      const empty = document.createElement('div');
      empty.className = 'files-empty';
      empty.innerHTML = '<b>没有匹配的应用</b><p>换一个关键词试试。</p>';
      list.appendChild(empty);
      return;
    }

    for (const app of filtered) {
      const row = document.createElement('div');
      row.className = 'file-row';
      row.dataset.id = app.id;
      row.appendChild(makeArt({ key: app.id, name: app.name, icon: app.icon, size: 40 }));
      const meta = document.createElement('div');
      meta.className = 'meta';
      const name = document.createElement('div');
      name.className = 'nm';
      name.textContent = app.name;
      const detail = document.createElement('div');
      detail.className = 'sub';
      const fname = document.createElement('span');
      fname.textContent = app.filename || '网页应用';
      const dot1 = document.createElement('i');
      dot1.textContent = '·';
      const size = document.createElement('span');
      size.textContent = fmtBytes(app.size);
      const dot2 = document.createElement('i');
      dot2.textContent = '·';
      const date = document.createElement('span');
      date.textContent = fmtDate(app.createdAt) + ' 导入';
      detail.append(fname, dot1, size, dot2, date);
      meta.append(name, detail);
      row.appendChild(meta);

      const actions = document.createElement('div');
      actions.className = 'row-actions';
      const mkBtn = (act, iconName, title, danger) => {
        const btn = document.createElement('button');
        btn.className = 'icon-btn' + (danger ? ' danger' : '');
        btn.dataset.act = act;
        btn.dataset.id = app.id;
        btn.title = title;
        btn.setAttribute('aria-label', title);
        btn.innerHTML = icon(iconName, 15);
        return btn;
      };
      actions.append(
        mkBtn('export', 'export', '导出原始 HTML'),
        mkBtn('rename', 'edit', '重命名'),
        mkBtn('delete', 'trash', '移除应用', true)
      );
      row.appendChild(actions);
      list.appendChild(row);
    }
  };

  list.addEventListener('click', (event) => {
    const actionBtn = event.target.closest('[data-act]');
    if (actionBtn) {
      event.stopPropagation();
      const id = actionBtn.dataset.id;
      if (actionBtn.dataset.act === 'import') pickFiles();
      else if (actionBtn.dataset.act === 'export') exportSingleApp(id);
      else if (actionBtn.dataset.act === 'rename') renameApp(id);
      else if (actionBtn.dataset.act === 'delete') removeApp(id);
      return;
    }
    const row = event.target.closest('.file-row');
    if (row) openApp('app.' + row.dataset.id);
  });

  $('[data-act="import"]', root).addEventListener('click', pickFiles);
  query.addEventListener('input', paint);
  const onChange = () => paint();
  bus.addEventListener('apps-changed', onChange);
  paint();
  return () => bus.removeEventListener('apps-changed', onChange);
}

    '</div>';
  const titleInput = $('.note-title', root);
  const bodyInput = $('.note-body', root);
  const saveState = $('.save-state', root);
  const countEl = $('.count', root);
  let note = { title: '', body: '', updatedAt: 0 };
  try {
    const raw = localStorage.getItem(LS.note);
    if (raw) note = { ...note, ...JSON.parse(raw) };
  } catch (err) {}
  titleInput.value = note.title || '';
  bodyInput.value = note.body || '';

  let timer = 0;
  const updateCount = () => {
    const length = bodyInput.value.length;
    countEl.textContent = length + ' 字符';
  };
  const flush = () => {
    clearTimeout(timer);
    timer = 0;
    note.title = titleInput.value;
    note.body = bodyInput.value;
    note.updatedAt = Date.now();
    try {
      localStorage.setItem(LS.note, JSON.stringify(note));
      const time = new Date(note.updatedAt).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false });
      saveState.textContent = '已保存 · ' + time;
    } catch (err) {
      saveState.textContent = '无法保存';
    }
  };
  const schedule = () => {
    saveState.textContent = '正在保存…';
    updateCount();
    clearTimeout(timer);
    timer = setTimeout(flush, 450);
  };
  titleInput.addEventListener('input', schedule);
  bodyInput.addEventListener('input', schedule);
  $('[data-act="clear"]', root).addEventListener('click', async () => {
    if (!titleInput.value && !bodyInput.value) return;
    const ok = await askConfirm({ title: '清空备忘录', message: '当前笔记内容将被清空，此操作不可撤销。', danger: true, confirmText: '清空' });
    if (!ok) return;
    titleInput.value = '';
    bodyInput.value = '';
    flush();
    bodyInput.focus();
  });
  updateCount();
  if (note.updatedAt) {
    const time = new Date(note.updatedAt).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false });
    saveState.textContent = '已保存 · ' + time;
  }
  setTimeout(() => bodyInput.focus(), 200);
  return () => {
    if (timer) flush();
  };
}

function currentGroup() {
  return state.embedded ? state.exportId : 'local';
}

function decodeHtmlBuffer(buffer) {
  const bytes = new Uint8Array(buffer);
  const headBytes = bytes.slice(0, Math.min(bytes.length, 8192));
  let head = '';
  for (let i = 0; i < headBytes.length; i++) head += String.fromCharCode(headBytes[i]);
  let label = 'utf-8';
  const match = head.match(/<meta[^>]+charset\s*=\s*["']?\s*([a-zA-Z0-9_-]+)/i) || head.match(/charset\s*=\s*["']?\s*([a-zA-Z0-9_-]+)/i);
  if (match) label = match[1].toLowerCase();
  try {
    return new TextDecoder(label, { fatal: false }).decode(bytes);
  } catch (err) {
    try {
      return new TextDecoder('utf-8', { fatal: false }).decode(bytes);
    } catch (err2) {
      return '';
    }
  }
}

function analyzeHtml(html, filename, size) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const og = doc.querySelector('meta[property="og:title"]') || doc.querySelector('meta[name="og:title"]');
  const ogTitle = og ? (og.getAttribute('content') || '') : '';
  const title = (ogTitle || doc.title || '').trim().replace(/\s+/g, ' ');
  let name = title || String(filename || '').replace(/\.[^.]+$/, '');
  name = Array.from(name.trim()).slice(0, 80).join('') || '未命名应用';
  const link = doc.querySelector('link[rel~="icon"]') || doc.querySelector('link[rel="shortcut icon"]') || doc.querySelector('link[rel="apple-touch-icon"]');
  const href = link ? (link.getAttribute('href') || '').trim() : '';
  let iconValue = '';
  if (/^data:image\//i.test(href)) iconValue = href;
  else if (/^https?:\/\//i.test(href)) iconValue = href;
  let accent = '';
  const themeMeta = doc.querySelector('meta[name="theme-color"]');
  if (themeMeta) {
    const value = (themeMeta.getAttribute('content') || '').trim();
    if (/^#[0-9a-f]{6}$/i.test(value)) accent = value;
  }
  let bytes = Number(size) || 0;
  if (!bytes) {
    try { bytes = new TextEncoder().encode(html).length; } catch (err) { bytes = html.length; }
  }
  return { name, icon: iconValue, accent, html, filename, size: bytes };
}

async function buildAppFromFile(file) {
  const buffer = await file.arrayBuffer();
  const html = decodeHtmlBuffer(buffer);
  if (!html.trim()) throw new Error('文件内容为空');
  const meta = analyzeHtml(html, file.name, file.size);
  return {
    ...meta,
    id: uid('app'),
    createdAt: Date.now(),
    updatedAt: Date.now(),
    group: currentGroup()
  };
}

function isHtmlFile(file) {
  return /\.(html?|xhtml)$/i.test(file.name || '') || file.type === 'text/html';
}

async function storeImported(app) {
  const existing = [...state.apps.values()].find((item) => item.filename === app.filename && item.group === app.group);
  if (existing) {
    app.id = existing.id;
    app.createdAt = existing.createdAt;
  }
  const persisted = await persistApp(app);
  state.apps.set(app.id, app);
  const win = state.windows.get('app.' + app.id);
  if (win) {
    win.app = app;
    win.titleEl.textContent = app.name;
    win.el.setAttribute('aria-label', app.name);
    if (win.iframe) {
      win.iframe.setAttribute('title', app.name);
      win.iframe.srcdoc = app.html;
    }
    const art = win.el.querySelector('.win-title .t-art');
    if (art) art.replaceWith(makeArt({ key: app.id, name: app.name, icon: app.icon, size: 18, className: 't-art' }));
  }
  return { app, updated: Boolean(existing), persisted };
}

async function importFiles(files) {
  const htmlFiles = files.filter(isHtmlFile);
  if (!htmlFiles.length) {
    toast('请选择 HTML 文件（.html / .htm / .xhtml）', 'warn');
    return;
  }
  const results = [];
  for (const file of htmlFiles) {
    if (file.size > 15 * 1024 * 1024) {
      const ok = await askConfirm({
        title: '文件较大',
        message: '「' + file.name + '」大小为 ' + fmtBytes(file.size) + '，导入后可能影响运行流畅度。仍要继续吗？',
        confirmText: '继续导入'
      });
      if (!ok) continue;
    }
    try {
      const app = await buildAppFromFile(file);
      results.push(await storeImported(app));
    } catch (err) {
      console.error(err);
      toast('「' + file.name + '」导入失败', 'error');
    }
  }
  if (!results.length) return;
  emit('apps-changed');
  const last = results[results.length - 1];
  renderDesktopIcons('app.' + last.app.id);
  if (results.length === 1) {
    toast((last.updated ? '已更新' : '已导入') + '「' + last.app.name + '」', last.persisted ? 'success' : 'warn', {
      action: '打开',
      onAction: () => openApp('app.' + last.app.id)
    });
  } else {
    toast('已导入 ' + results.length + ' 个应用', 'success', {
      action: '查看',
      onAction: () => openApp('files')
    });
  }
  if (results.some((item) => !item.persisted)) {
    toast('部分应用无法写入本地存储，本次会话内仍可使用', 'warn');
  }
}

function safeFileName(name) {
  const base = String(name || 'app').replace(/[\\/:*?"<>|]+/g, '-').replace(/\s+/g, ' ').trim().slice(0, 60) || 'app';
  return /\.html?$/i.test(base) ? base : base + '.html';
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const anchor = document.createElement('a');
  anchor.href = url;
  anchor.download = filename;
  anchor.style.display = 'none';
  document.body.appendChild(anchor);
  anchor.click();
  anchor.remove();
  setTimeout(() => URL.revokeObjectURL(url), 8000);
}

function downloadText(text, filename) {
  downloadBlob(new Blob([text], { type: 'text/html;charset=utf-8' }), filename);
}

function exportSingleApp(id) {
  const app = state.apps.get(id);
  if (!app) return;
  const filename = safeFileName(app.filename || app.name);
  downloadText(app.html, filename);
  toast('已导出「' + filename + '」', 'success');
}

function todayStamp() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
}

function buildExportHtml() {
  const clone = document.documentElement.cloneNode(true);
  clone.removeAttribute('style');
  clone.classList.remove('booting');
  const body = clone.querySelector('body');
  if (body) body.classList.remove('ready', 'is-dragging', 'is-resizing', 'dragging-shield');

  for (const selector of ['#desktop-icons', '#windows', '#tb-tasks', '#start-apps', '#toasts', '#modal', '#ctx']) {
    const node = clone.querySelector(selector);
    if (node) node.innerHTML = '';
  }

  const start = clone.querySelector('#start');
  if (start) {
    start.classList.remove('open');
    start.setAttribute('aria-hidden', 'true');
  }
  const ctx = clone.querySelector('#ctx');
  if (ctx) {
    ctx.classList.remove('open');
    ctx.setAttribute('aria-hidden', 'true');
  }
  const startBtn = clone.querySelector('#start-btn');
  if (startBtn) {
    startBtn.classList.remove('active');
    startBtn.setAttribute('aria-expanded', 'false');
  }
  const layer = clone.querySelector('#modal-layer');
  if (layer) {
    layer.classList.remove('open');
    layer.setAttribute('aria-hidden', 'true');
  }
  const dropzone = clone.querySelector('#dropzone');
  if (dropzone) dropzone.classList.remove('show');
  const shield = clone.querySelector('#drag-shield');
  if (shield) shield.classList.remove('on');
  const snap = clone.querySelector('#snap-preview');
  if (snap) {
    snap.classList.remove('show');
    snap.removeAttribute('style');
  }
  const boot = clone.querySelector('#boot');
  if (boot) {
    boot.classList.remove('done');
    boot.removeAttribute('style');
  }
  const bootFill = clone.querySelector('#boot-fill');
  if (bootFill) bootFill.removeAttribute('style');
  const bootTip = clone.querySelector('#boot-tip');
  if (bootTip) bootTip.textContent = '正在初始化桌面环境…';
  const clockTime = clone.querySelector('#clock-time');
  if (clockTime) clockTime.textContent = '--:--';
  const clockDate = clone.querySelector('#clock-date');
  if (clockDate) clockDate.textContent = '';
  const wpImage = clone.querySelector('#wp-image');
  if (wpImage) wpImage.removeAttribute('src');
  const wp = clone.querySelector('#wallpaper');
  if (wp) wp.removeAttribute('style');
  const search = clone.querySelector('#start-search');
  if (search) search.removeAttribute('value');

  const oldData = clone.querySelector('#embedded-data');
  if (oldData) oldData.remove();

  const apps = [...state.apps.values()].map((app) => ({
    id: app.id,
    name: app.name,
    filename: app.filename,
    html: app.html,
    icon: app.icon || '',
    accent: app.accent || '',
    size: Number(app.size) || 0,
    createdAt: app.createdAt || Date.now(),
    updatedAt: app.updatedAt || app.createdAt || Date.now()
  }));

  const payload = {
    app: 'mirage-os',
    version: VERSION,
    exportId: uid('exp'),
    exportedAt: Date.now(),
    settings: { ...settings },
    apps
  };

  const script = document.createElement('script');
  script.type = 'application/json';
  script.id = 'embedded-data';
  script.textContent = JSON.stringify(payload)
    .replace(/</g, '\\u003c')
    .replace(/\u2028/g, '\\u2028')
    .replace(/\u2029/g, '\\u2029');
  if (body) body.appendChild(script);

  const titleNode = clone.querySelector('title');
  if (titleNode) titleNode.textContent = apps.length ? '幻境 OS · 我的系统' : '幻境 OS';

  return {
    html: '<!DOCTYPE html>\n' + clone.outerHTML,
    count: apps.length
  };
}

let exporting = false;

function exportSystem() {
  if (exporting) return;
  exporting = true;
  try {
    const result = buildExportHtml();
    const blob = new Blob([result.html], { type: 'text/html;charset=utf-8' });
    const filename = 'MirageOS-' + todayStamp() + '.html';
    downloadBlob(blob, filename);
    toast('系统已导出 · ' + result.count + ' 个应用 · ' + fmtBytes(blob.size), 'success', { duration: 5600 });
    if (blob.size > 60 * 1024 * 1024) toast('导出文件较大，打开时可能需要更多内存', 'warn');
  } catch (err) {
    console.error(err);
    toast('导出失败：' + (err && err.message ? err.message : String(err)), 'error');
  } finally {
    exporting = false;
  }
}

async function resetSystem() {
  const ok = await askConfirm({
    title: '清空本机数据',
    message: '将删除全部导入记录与外观设置，并重新启动系统。导出文件内嵌的应用会随文件保留。此操作不可撤销。',
    confirmText: '清空并重启',
    danger: true
  });
  if (!ok) return;
  try {
    if (dbReady && db) {
      await new Promise((resolve) => {
        const tx = db.transaction(DB_STORE, 'readwrite');
        tx.objectStore(DB_STORE).clear();
        tx.oncomplete = resolve;
        tx.onerror = resolve;
      });
    }
  } catch (err) {}
  try {
    localStorage.removeItem(LS.localApps);
    localStorage.removeItem(LS.settings);
    localStorage.removeItem(LS.note);
    localStorage.removeItem(LS.seen);
  } catch (err) {}
  location.reload();
}

function compressImage(file, maxWidth, quality) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        const scale = Math.min(1, maxWidth / Math.max(1, img.naturalWidth || img.width));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round((img.naturalWidth || img.width) * scale));
        canvas.height = Math.max(1, Math.round((img.naturalHeight || img.height) * scale));
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#0b1020';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        resolve(canvas.toDataURL('image/jpeg', quality));
      } catch (err) {
        URL.revokeObjectURL(url);
        reject(err);
      }
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error('无法读取图片'));
    };
    img.src = url;
  });
}

async function setCustomWallpaper(file) {
  if (!file || !/^image\//.test(file.type)) {
    toast('请选择图片文件', 'warn');
    return;
  }
  try {
    const data = await compressImage(file, 1920, 0.82);
    setSettings({ wallpaper: 'custom', wallpaperImage: data });
    if (!saveSettings()) toast('壁纸已应用，但图片过大无法持久保存', 'warn');
    emit('settings-changed', settings);
    toast('壁纸已更新', 'success');
  } catch (err) {
    console.error(err);
    toast('壁纸处理失败', 'error');
  }
}

function setBootProgress(percent, tip) {
  const fill = $('#boot-fill');
  if (fill) fill.style.width = clamp(percent, 0, 100) + '%';
  if (tip) {
    const node = $('#boot-tip');
    if (node) node.textContent = tip;
  }
}

async function boot() {
  const started = performance.now();
  try {
    settings = loadSettings();
    applySettings();
    bindGlobal();
    setBootProgress(10, '正在读取本机数据…');

    const embedded = await readEmbedded();
    if (embedded && embedded.settings) {
      settings = { ...DEFAULT_SETTINGS, ...embedded.settings };
      if (!WALLPAPERS.some((wp) => wp.id === settings.wallpaper)) settings.wallpaper = DEFAULT_SETTINGS.wallpaper;
      applySettings();
    }
    setBootProgress(32, embedded ? '正在载入内嵌应用…' : '正在初始化桌面环境…');

    await hydrateApps(embedded);
    setBootProgress(64, '正在绘制窗口与图标…');

    renderDesktopIcons();
    syncTaskbar();
    renderStartApps('');
    startClock();
    setBootProgress(88, embedded ? '已载入 ' + state.apps.size + ' 个应用' : state.apps.size ? '已恢复 ' + state.apps.size + ' 个应用' : '系统就绪');

    await sleep(Math.max(0, 1150 - (performance.now() - started)));
    setBootProgress(100);
    await sleep(330);
    $('#boot').classList.add('done');
    document.body.classList.add('ready');
    state.booted = true;

    let seen = false;
    try { seen = Boolean(localStorage.getItem(LS.seen)); } catch (err) {}
    if (!state.apps.size && !embedded && !seen) {
      setTimeout(() => {
        openApp('welcome');
        try { localStorage.setItem(LS.seen, '1'); } catch (err) {}
      }, 380);
    }
  } catch (err) {
    console.error(err);
    setBootProgress(100, '初始化遇到问题');
    setTimeout(() => {
      $('#boot').classList.add('done');
      document.body.classList.add('ready');
    }, 600);
    toast('初始化失败：' + (err && err.message ? err.message : String(err)), 'error', { duration: 8000 });
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot, { once: true });
} else {
  setTimeout(boot, 60);
}
})();
