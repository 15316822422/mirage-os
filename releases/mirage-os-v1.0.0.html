<html lang="zh-CN" data-theme="dark" data-wallpaper="aurora" data-motion="on">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<title>幻境 OS · Mirage OS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%237d9bff'/%3E%3Cstop offset='1' stop-color='%23b06cff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='6' fill='url(%23g)'/%3E%3Cpath d='M12 4.5 19 8.8 12 19.5 5 8.8Z' fill='none' stroke='white' stroke-width='1.2' stroke-linejoin='round'/%3E%3Cpath d='M5 8.8h14M12 4.5v15M8 8.8 12 19.5l4-10.7' fill='none' stroke='white' stroke-opacity='.7' stroke-width='.9'/%3E%3C/svg%3E">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{color-scheme:dark}
[data-theme="light"]{color-scheme:light}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;background:#05070d;color:var(--text);overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit;user-select:text}
img{display:block;max-width:100%}
h1,h2,h3,h4,p{margin:0}
a{color:var(--accent);text-decoration:none}
svg{display:block}
[hidden]{display:none!important}
:focus{outline:none}
:focus-visible{outline:2px solid rgba(var(--accent-rgb),.75);outline-offset:2px}
::selection{background:rgba(var(--accent-rgb),.35)}
*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
[data-theme="light"] *{scrollbar-color:rgba(12,22,40,.22) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:99px;border:3px solid transparent;background-clip:content-box}
[data-theme="light"] ::-webkit-scrollbar-thumb{background:rgba(12,22,40,.2);border:3px solid transparent;background-clip:content-box}

:root{
  --accent:#6c8cff;
  --accent-rgb:108,140,255;
  --text:#eef2fb;
  --muted:#98a4bb;
  --muted-2:#6f7c94;
  --glass:rgba(16,21,32,.62);
  --glass-2:rgba(21,26,39,.9);
  --glass-3:rgba(30,37,53,.94);
  --stroke:rgba(255,255,255,.1);
  --stroke-2:rgba(255,255,255,.06);
  --hover:rgba(255,255,255,.07);
  --active:rgba(255,255,255,.12);
  --bg-elev:rgba(255,255,255,.05);
  --panel-1:#161c2b;
  --panel-2:#10141f;
  --window-bg:#0f1420;
  --taskbar-h:58px;
  --radius:14px;
  --shadow-win:0 34px 90px rgba(0,0,0,.55),0 10px 26px rgba(0,0,0,.36);
  --ease:cubic-bezier(.22,.9,.24,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --danger:#f2555a;
  --ok:#3dd68c;
  --warn:#f5b84b;
}
[data-theme="light"]{
  --text:#0e1626;
  --muted:#5b6679;
  --muted-2:#7b8598;
  --glass:rgba(250,252,255,.68);
  --glass-2:rgba(255,255,255,.93);
  --glass-3:rgba(255,255,255,.97);
  --stroke:rgba(12,22,40,.11);
  --stroke-2:rgba(12,22,40,.07);
  --hover:rgba(12,22,40,.06);
  --active:rgba(12,22,40,.1);
  --bg-elev:rgba(12,22,40,.045);
  --panel-1:#fbfcff;
  --panel-2:#f3f6fc;
  --window-bg:#f7f9fd;
  --shadow-win:0 34px 80px rgba(23,34,66,.2),0 8px 22px rgba(23,34,66,.12);
}

#boot{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:radial-gradient(80% 80% at 50% 28%,#111a33 0%,#05070e 68%);transition:opacity .7s ease,visibility .7s ease}
#boot.done{opacity:0;visibility:hidden;pointer-events:none}
.boot-inner{display:flex;flex-direction:column;align-items:center;gap:20px;transform:translateY(-3vh)}
.boot-logo{width:92px;height:92px;border-radius:27px;display:grid;place-items:center;background:linear-gradient(140deg,#7d9bff,#6c5ce7 55%,#c86dd7);box-shadow:0 26px 70px rgba(96,112,255,.45),inset 0 1px 0 rgba(255,255,255,.45);animation:logoIn .9s var(--ease-out) both,breathe 4.5s 1.2s ease-in-out infinite}
.boot-name{font-size:25px;letter-spacing:.3em;text-indent:.3em;font-weight:600;color:#fff}
.boot-sub{font-size:10px;color:#8b97b3;letter-spacing:.34em;text-indent:.34em;margin-top:-12px}
.boot-track{width:210px;height:3px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:10px}
.boot-fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#6c8cff,#b06cff);box-shadow:0 0 18px rgba(128,136,255,.85);transition:width .55s var(--ease)}
.boot-tip{font-size:11px;color:#5f6b85;letter-spacing:.04em}
@keyframes logoIn{from{opacity:0;transform:scale(.82) translateY(10px)}to{opacity:1;transform:none}}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

#wallpaper{position:fixed;inset:0;z-index:0;overflow:hidden;background:#05070e}
#wallpaper .w-blob{position:absolute;border-radius:50%;filter:blur(72px);opacity:.5;will-change:transform;transform:translateZ(0);pointer-events:none}
#wp-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;display:none}
[data-wallpaper="custom"] #wp-image{display:block}
[data-wallpaper="custom"] .w-blob{display:none}
.w-grid{position:absolute;inset:0;opacity:0;background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);background-size:46px 46px;mask-image:radial-gradient(120% 120% at 50% 40%,#000 30%,transparent 78%);-webkit-mask-image:radial-gradient(120% 120% at 50% 40%,#000 30%,transparent 78%)}
.w-stars{position:absolute;inset:0;opacity:0;background-image:radial-gradient(1px 1px at 18% 24%,rgba(255,255,255,.9) 50%,transparent 51%),radial-gradient(1px 1px at 62% 12%,rgba(255,255,255,.75) 50%,transparent 51%),radial-gradient(1.4px 1.4px at 84% 38%,rgba(255,255,255,.95) 50%,transparent 51%),radial-gradient(1px 1px at 34% 62%,rgba(255,255,255,.6) 50%,transparent 51%),radial-gradient(1.2px 1.2px at 74% 72%,rgba(255,255,255,.8) 50%,transparent 51%),radial-gradient(1px 1px at 12% 82%,rgba(255,255,255,.55) 50%,transparent 51%),radial-gradient(1px 1px at 48% 40%,rgba(255,255,255,.45) 50%,transparent 51%),radial-gradient(1px 1px at 92% 84%,rgba(255,255,255,.6) 50%,transparent 51%);background-size:520px 520px,640px 640px,720px 720px,460px 460px,580px 580px,620px 620px,540px 540px,760px 760px}
.w-vignette{position:absolute;inset:0;z-index:2;background:radial-gradient(130% 120% at 50% 18%,transparent 42%,rgba(0,0,0,.42) 100%);pointer-events:none}
[data-theme="light"] .w-vignette{background:radial-gradient(130% 120% at 50% 18%,transparent 50%,rgba(10,16,30,.22) 100%)}

[data-wallpaper="aurora"] #wallpaper{background:radial-gradient(110% 110% at 18% 0%,#0d1b3e 0%,#070b16 56%,#04060c 100%)}
[data-wallpaper="aurora"] .b1{width:56vmax;height:56vmax;left:-15vmax;top:-20vmax;background:radial-gradient(circle,#2f6bff,transparent 62%);opacity:.5;animation:drift1 26s ease-in-out infinite alternate}
[data-wallpaper="aurora"] .b2{width:44vmax;height:44vmax;right:-10vmax;top:6vmax;background:radial-gradient(circle,#00d4c8,transparent 62%);opacity:.32;animation:drift2 31s ease-in-out infinite alternate}
[data-wallpaper="aurora"] .b3{width:52vmax;height:52vmax;left:18vmax;bottom:-26vmax;background:radial-gradient(circle,#8b5cf6,transparent 64%);opacity:.42;animation:drift3 36s ease-in-out infinite alternate}

[data-wallpaper="dusk"] #wallpaper{background:linear-gradient(158deg,#1a0b2e 0%,#3b0d3a 46%,#0a0714 100%)}
[data-wallpaper="dusk"] .b1{width:52vmax;height:52vmax;left:-10vmax;top:-16vmax;background:radial-gradient(circle,#ff7a45,transparent 60%);opacity:.42;animation:drift2 29s ease-in-out infinite alternate}
[data-wallpaper="dusk"] .b2{width:44vmax;height:44vmax;right:-8vmax;top:18vmax;background:radial-gradient(circle,#ff3d7f,transparent 62%);opacity:.38;animation:drift1 34s ease-in-out infinite alternate}
[data-wallpaper="dusk"] .b3{width:48vmax;height:48vmax;left:24vmax;bottom:-22vmax;background:radial-gradient(circle,#7b5cff,transparent 64%);opacity:.4;animation:drift3 40s ease-in-out infinite alternate}

[data-wallpaper="ocean"] #wallpaper{background:linear-gradient(180deg,#03121f 0%,#062b33 58%,#04121a 100%)}
[data-wallpaper="ocean"] .b1{width:54vmax;height:54vmax;left:-12vmax;top:-18vmax;background:radial-gradient(circle,#00b8d4,transparent 62%);opacity:.34;animation:drift3 32s ease-in-out infinite alternate}
[data-wallpaper="ocean"] .b2{width:46vmax;height:46vmax;right:-10vmax;bottom:-12vmax;background:radial-gradient(circle,#14e0a0,transparent 62%);opacity:.28;animation:drift1 27s ease-in-out infinite alternate}
[data-wallpaper="ocean"] .b3{width:40vmax;height:40vmax;left:30vmax;top:20vmax;background:radial-gradient(circle,#2f6bff,transparent 64%);opacity:.24;animation:drift2 38s ease-in-out infinite alternate}

[data-wallpaper="nebula"] #wallpaper{background:radial-gradient(120% 120% at 70% 0%,#170b2e 0%,#070614 55%,#030308 100%)}
[data-wallpaper="nebula"] .b1{width:54vmax;height:54vmax;left:-10vmax;top:-14vmax;background:radial-gradient(circle,#5b21b6,transparent 62%);opacity:.4;animation:drift1 30s ease-in-out infinite alternate}
[data-wallpaper="nebula"] .b2{width:44vmax;height:44vmax;right:-12vmax;bottom:-14vmax;background:radial-gradient(circle,#1d4ed8,transparent 64%);opacity:.32;animation:drift2 35s ease-in-out infinite alternate}
[data-wallpaper="nebula"] .w-stars{opacity:.9}

[data-wallpaper="mono"] #wallpaper{background:#0a0c11}
[data-wallpaper="mono"] .b1{width:60vmax;height:60vmax;left:50%;top:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,#2a3242,transparent 65%);opacity:.55;animation:none}
[data-wallpaper="mono"] .w-grid{opacity:.5}
[data-wallpaper="mono"] .w-blob.b2,[data-wallpaper="mono"] .w-blob.b3{display:none}

@keyframes drift1{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(6vmax,4vmax,0) scale(1.08)}}
@keyframes drift2{from{transform:translate3d(0,0,0) scale(1.04)}to{transform:translate3d(-5vmax,5vmax,0) scale(.96)}}
@keyframes drift3{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(4vmax,-6vmax,0) scale(1.1)}}
[data-motion="off"] .w-blob{animation:none!important}

#desktop{position:fixed;inset:0 0 var(--taskbar-h) 0;z-index:1}
#desktop-icons{display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;height:100%;padding:16px 14px;gap:4px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
#desktop-icons::-webkit-scrollbar{display:none}
.d-icon{width:92px;height:98px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:7px;padding:8px 4px 6px;transition:background .15s,box-shadow .15s;color:#fff;position:relative}
.d-icon:hover{background:rgba(255,255,255,.09)}
.d-icon.sel{background:rgba(var(--accent-rgb),.3);box-shadow:inset 0 0 0 1px rgba(var(--accent-rgb),.52)}
.d-icon-art{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(140deg,var(--g1,#5b7cfa),var(--g2,#8b5cf6));box-shadow:0 7px 18px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.38);overflow:hidden;position:relative;flex-shrink:0}
.d-icon-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.d-icon-art svg{width:23px;height:23px}
.d-icon-art .letter{font-size:19px;font-weight:600;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.28);line-height:1}
.d-icon-label{font-size:12px;line-height:1.3;text-align:center;text-shadow:0 1px 4px rgba(0,0,0,.7);max-width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.icons-live .d-icon{animation:iconIn .42s var(--ease-out) both;animation-delay:calc(var(--i,0)*24ms)}
@keyframes iconIn{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}

#windows{position:fixed;inset:0;z-index:20;pointer-events:none}
.win{position:fixed;pointer-events:auto;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--panel-1),var(--panel-2));border:1px solid var(--stroke);border-radius:var(--radius);box-shadow:var(--shadow-win);overflow:hidden;transform-origin:50% 50%}
.win.active{box-shadow:var(--shadow-win),0 0 0 1px rgba(var(--accent-rgb),.26),0 0 70px -24px rgba(var(--accent-rgb),.55)}
.win.opening{animation:winIn .28s var(--ease-out)}
.win.closing{animation:winOut .16s ease-out forwards}
.win.anim{transition:left .32s var(--ease-out),top .32s var(--ease-out),width .32s var(--ease-out),height .32s var(--ease-out)}
.win.max{border-radius:12px}
.win-titlebar{height:44px;display:flex;align-items:center;padding:0 8px 0 12px;gap:10px;flex-shrink:0;background:linear-gradient(180deg,rgba(255,255,255,.045),transparent);border-bottom:1px solid var(--stroke-2);cursor:grab;touch-action:none}
.win.dragging .win-titlebar{cursor:grabbing}
.win-title{display:flex;align-items:center;gap:8px;min-width:0;flex:1;font-size:12.5px;font-weight:500;color:var(--text)}
.win-title .t-art{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;overflow:hidden;flex-shrink:0;background:linear-gradient(140deg,var(--g1,#5b7cfa),var(--g2,#8b5cf6));position:relative}
.win-title .t-art svg{width:11px;height:11px}
.win-title .t-art .letter{font-size:9px;font-weight:600;color:#fff;line-height:1}
.win-title .t-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.win-title .t-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win-controls{display:flex;gap:2px;align-items:center;flex-shrink:0}
.win-btn{width:36px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--muted);transition:background .12s,color .12s}
.win-btn:hover{background:var(--hover);color:var(--text)}
.win-btn.close:hover{background:#e5484d;color:#fff}
.win-body{position:relative;flex:1;min-height:0;background:var(--window-bg);display:flex;flex-direction:column}
.win-body>.app{flex:1;min-height:0}
.win-body iframe{width:100%;height:100%;border:0;display:block;background:#fff;flex:1}
.win-loader{position:absolute;inset:0;display:grid;place-items:center;background:var(--window-bg);z-index:3;transition:opacity .25s;pointer-events:none}
.win-loader.hide{opacity:0}
.spinner{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.15);border-top-color:var(--accent);border-right-color:var(--accent);animation:spin .75s linear infinite}
[data-theme="light"] .spinner{border-color:rgba(12,22,40,.12);border-top-color:var(--accent);border-right-color:var(--accent)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes winIn{from{opacity:0;transform:scale(.965) translateY(10px)}to{opacity:1;transform:none}}
@keyframes winOut{to{opacity:0;transform:scale(.965) translateY(6px)}}
.rz{position:absolute;z-index:6;touch-action:none}
.rz[data-dir="n"]{top:0;left:12px;right:12px;height:6px;cursor:ns-resize}
.rz[data-dir="s"]{bottom:0;left:12px;right:12px;height:6px;cursor:ns-resize}
.rz[data-dir="e"]{right:0;top:12px;bottom:12px;width:6px;cursor:ew-resize}
.rz[data-dir="w"]{left:0;top:12px;bottom:12px;width:6px;cursor:ew-resize}
.rz[data-dir="ne"]{top:0;right:0;width:14px;height:14px;cursor:nesw-resize}
.rz[data-dir="nw"]{top:0;left:0;width:14px;height:14px;cursor:nwse-resize}
.rz[data-dir="se"]{bottom:0;right:0;width:14px;height:14px;cursor:nwse-resize}
.rz[data-dir="sw"]{bottom:0;left:0;width:14px;height:14px;cursor:nesw-resize}

#drag-shield{position:fixed;inset:0;z-index:55;display:none;cursor:grabbing}
#drag-shield.on{display:block}
#snap-preview{position:fixed;z-index:40;border-radius:12px;border:1.5px solid rgba(var(--accent-rgb),.72);background:rgba(var(--accent-rgb),.13);box-shadow:inset 0 0 70px rgba(var(--accent-rgb),.1);opacity:0;pointer-events:none;transition:opacity .14s,left .16s var(--ease-out),top .16s var(--ease-out),width .16s var(--ease-out),height .16s var(--ease-out)}
#snap-preview.show{opacity:1}

#taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--taskbar-h);z-index:60;display:flex;align-items:center;padding:0 10px;background:var(--glass);border-top:1px solid var(--stroke);backdrop-filter:blur(30px) saturate(170%);-webkit-backdrop-filter:blur(30px) saturate(170%)}
#tb-center{position:absolute;left:50%;bottom:0;height:100%;transform:translateX(-50%);display:flex;align-items:center;gap:5px;max-width:calc(100vw - 280px)}
#tb-tasks{display:flex;align-items:center;gap:5px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;max-width:100%}
#tb-tasks::-webkit-scrollbar{display:none}
.tb-btn{position:relative;width:42px;height:42px;border-radius:10px;display:grid;place-items:center;transition:background .14s,transform .12s;flex-shrink:0}
.tb-btn:hover{background:var(--hover)}
.tb-btn:active{transform:scale(.9)}
.tb-btn .tb-glyph{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;overflow:hidden;background:linear-gradient(140deg,var(--g1,#5b7cfa),var(--g2,#8b5cf6));box-shadow:inset 0 1px 0 rgba(255,255,255,.3);position:relative;color:#fff}
.tb-btn .tb-glyph svg{width:15px;height:15px}
.tb-btn .tb-glyph .letter{font-size:13px;font-weight:600;line-height:1}
.tb-btn .tb-glyph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tb-btn.running::after{content:"";position:absolute;left:50%;bottom:2px;width:6px;height:2.5px;border-radius:2px;background:var(--muted-2);transform:translateX(-50%);transition:width .18s,background .18s}
.tb-btn.active::after{width:16px;background:var(--accent)}
.tb-btn.active{background:var(--active)}
#start-btn{width:44px;height:44px}
#start-btn .tb-glyph{width:30px;height:30px;border-radius:9px;background:linear-gradient(140deg,#7d9bff,#8b5cf6 58%,#d06bff);box-shadow:0 5px 16px rgba(108,120,255,.45),inset 0 1px 0 rgba(255,255,255,.35)}
#start-btn:hover .tb-glyph{filter:brightness(1.1)}
#start-btn.active{background:var(--hover)}
#tb-tray{position:absolute;right:6px;bottom:0;height:100%;display:flex;align-items:center;gap:2px}
.tb-status{display:flex;align-items:center;gap:1px;color:var(--muted);padding-right:2px}
.tb-tray-btn{width:30px;height:34px;border-radius:8px;display:grid;place-items:center;transition:background .12s,color .12s}
.tb-tray-btn:hover{background:var(--hover);color:var(--text)}
#tb-clock{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;line-height:1.15;height:38px;padding:0 9px;border-radius:8px;color:var(--text);font-variant-numeric:tabular-nums;transition:background .12s}
#tb-clock:hover{background:var(--hover)}
#tb-clock .t{font-size:12.5px;font-weight:500}
#tb-clock .d{font-size:10.5px;color:var(--muted);margin-top:1px}
#tb-showdesk{width:6px;height:100%;border-left:1px solid var(--stroke-2);margin-left:4px;transition:background .12s}
#tb-showdesk:hover{background:var(--hover)}

#start{position:fixed;z-index:70;left:50%;bottom:calc(var(--taskbar-h) + 10px);width:min(680px,calc(100vw - 20px));max-height:min(660px,calc(100vh - var(--taskbar-h) - 30px));display:flex;flex-direction:column;background:var(--glass-2);border:1px solid var(--stroke);border-radius:16px;box-shadow:0 34px 90px rgba(0,0,0,.5);backdrop-filter:blur(42px) saturate(165%);-webkit-backdrop-filter:blur(42px) saturate(165%);transform:translate(-50%,14px) scale(.985);opacity:0;pointer-events:none;transition:opacity .17s,transform .22s var(--ease-out);overflow:hidden}
#start.open{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
.start-head{padding:18px 20px 8px;display:flex;flex-direction:column;gap:10px}
.start-search{display:flex;align-items:center;gap:9px;height:41px;border-radius:10px;border:1px solid var(--stroke);background:var(--bg-elev);padding:0 7px 0 12px;transition:border-color .15s,box-shadow .15s}
.start-search:focus-within{border-color:rgba(var(--accent-rgb),.62);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.16)}
.start-search svg{color:var(--muted);flex-shrink:0}
.start-search input{flex:1;border:0;background:none;outline:none;font-size:13.5px;color:var(--text);min-width:0}
.start-search input::placeholder{color:var(--muted-2)}
.start-search .icon-btn{width:30px;height:28px}
.start-body{overflow:auto;padding:2px 14px 14px;flex:1;min-height:0}
.start-label{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--muted);letter-spacing:.04em;padding:8px 8px 6px}
.start-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:3px}
.start-app{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;text-align:left;position:relative;transition:background .13s;min-width:0}
.start-app:hover{background:var(--hover)}
.start-app:active{transform:scale(.985)}
.start-app .art{width:36px;height:36px;border-radius:10px;flex-shrink:0;display:grid;place-items:center;overflow:hidden;background:linear-gradient(140deg,var(--g1,#5b7cfa),var(--g2,#8b5cf6));box-shadow:inset 0 1px 0 rgba(255,255,255,.32);position:relative}
.start-app .art svg{width:18px;height:18px}
.start-app .art .letter{font-size:15px;font-weight:600;color:#fff;line-height:1}
.start-app .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.start-app .txt{min-width:0;display:block}
.start-app .nm{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.start-app .sb{display:block;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.start-empty{padding:34px 12px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.7}
.start-empty b{color:var(--text);display:block;margin-bottom:4px;font-size:13px}
.start-foot{display:flex;align-items:center;gap:6px;padding:10px 14px;border-top:1px solid var(--stroke-2);background:rgba(0,0,0,.09)}
[data-theme="light"] .start-foot{background:rgba(15,23,42,.035)}
.start-user{display:flex;align-items:center;gap:9px;margin-right:auto;padding:4px 6px;border-radius:8px}
.start-user .av{width:29px;height:29px;border-radius:50%;background:linear-gradient(140deg,#7d9bff,#b06cff);display:grid;place-items:center;font-size:12px;font-weight:600;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.start-user .nm{font-size:12px;line-height:1.2}
.start-user .st{font-size:10px;color:var(--muted);margin-top:1px}
.fbtn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted);transition:background .12s,color .12s}
.fbtn:hover{background:var(--hover);color:var(--text)}

#ctx{position:fixed;z-index:90;min-width:206px;padding:5px;border-radius:12px;background:var(--glass-3);border:1px solid var(--stroke);box-shadow:0 22px 60px rgba(0,0,0,.45);backdrop-filter:blur(26px) saturate(160%);-webkit-backdrop-filter:blur(26px) saturate(160%);opacity:0;pointer-events:none;transform:scale(.96);transform-origin:top left;transition:opacity .12s,transform .12s var(--ease-out)}
#ctx.open{opacity:1;pointer-events:auto;transform:none}
.ctx-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;font-size:12.5px;color:var(--text);text-align:left;transition:background .1s}
.ctx-item:hover{background:var(--hover)}
.ctx-item .ci{color:var(--muted);flex-shrink:0;display:grid;place-items:center;width:16px}
.ctx-item.danger{color:#ff8a8e}
.ctx-item.danger .ci{color:#ff8a8e}
.ctx-item.danger:hover{background:rgba(242,85,90,.14)}
.ctx-sep{height:1px;background:var(--stroke-2);margin:5px 8px}

#modal-layer{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:rgba(4,7,14,.48);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity .18s;padding:16px}
#modal-layer.open{opacity:1;pointer-events:auto}
.dialog{width:min(440px,94vw);background:var(--glass-3);border:1px solid var(--stroke);border-radius:16px;padding:20px;box-shadow:0 34px 80px rgba(0,0,0,.5);transform:translateY(10px) scale(.98);transition:transform .2s var(--ease-out)}
#modal-layer.open .dialog{transform:none}
.dialog h3{font-size:15px;font-weight:600;margin-bottom:7px}
.dialog p{font-size:12.5px;line-height:1.65;color:var(--muted);white-space:pre-wrap;word-break:break-word;margin-bottom:16px}
.dialog input{width:100%;height:38px;border-radius:9px;border:1px solid var(--stroke);background:var(--bg-elev);padding:0 11px;outline:none;font-size:13px;margin-bottom:16px;transition:border-color .15s,box-shadow .15s}
.dialog input:focus{border-color:rgba(var(--accent-rgb),.62);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.15)}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 13px;border-radius:9px;font-size:12.5px;font-weight:500;border:1px solid var(--stroke);background:var(--bg-elev);color:var(--text);transition:background .14s,border-color .14s,filter .14s,transform .1s;white-space:nowrap}
.btn:hover{background:var(--hover);border-color:var(--stroke)}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(140deg,#6c8cff,#8b5cf6);border-color:transparent;color:#fff;box-shadow:0 7px 18px -7px rgba(108,140,255,.75)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:#ff8a8e;border-color:rgba(242,85,90,.35);background:rgba(242,85,90,.1)}
.btn.danger:hover{background:rgba(242,85,90,.17)}
.btn.sm{height:28px;padding:0 9px;font-size:11.5px;border-radius:7px}
.btn[disabled]{opacity:.5;pointer-events:none}

.icon-btn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);transition:background .12s,color .12s;flex-shrink:0}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.icon-btn.danger:hover{background:rgba(242,85,90,.16);color:#ff8a8e}

#toasts{position:fixed;right:16px;bottom:calc(var(--taskbar-h) + 14px);z-index:110;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;min-width:250px;max-width:min(390px,92vw);padding:11px 12px;border-radius:11px;background:var(--glass-3);border:1px solid var(--stroke);box-shadow:0 16px 40px rgba(0,0,0,.38);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);font-size:12px;pointer-events:auto;animation:toastIn .28s var(--ease-out)}
.toast .t-ic{width:27px;height:27px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;background:rgba(var(--accent-rgb),.15);color:var(--accent)}
.toast.success .t-ic{background:rgba(61,214,140,.14);color:var(--ok)}
.toast.error .t-ic{background:rgba(242,85,90,.14);color:#ff8a8e}
.toast.warn .t-ic{background:rgba(245,184,75,.14);color:var(--warn)}
.toast .t-msg{flex:1;line-height:1.45;word-break:break-word}
.toast .t-act{font-size:11.5px;font-weight:600;color:var(--accent);padding:4px 7px;border-radius:6px;white-space:nowrap}
.toast .t-act:hover{background:var(--hover)}
.toast.out{animation:toastOut .24s forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(16px) scale(.97)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateX(12px) scale(.97)}}

#dropzone{position:fixed;inset:10px;z-index:95;border-radius:18px;border:1.5px dashed rgba(var(--accent-rgb),.68);background:rgba(6,10,20,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .18s;color:#fff}
#dropzone.show{opacity:1}
.drop-inner{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;padding:20px}
.drop-inner .dic{width:60px;height:60px;border-radius:17px;display:grid;place-items:center;background:rgba(var(--accent-rgb),.2);border:1px solid rgba(var(--accent-rgb),.42);margin-bottom:7px;box-shadow:0 14px 30px rgba(0,0,0,.3)}
.drop-inner b{font-size:15px}
.drop-inner span{font-size:12px;color:rgba(255,255,255,.68)}

.app{height:100%;overflow:auto;font-size:13px;color:var(--text)}
.files{height:100%;display:flex;flex-direction:column}
.files-head{padding:22px 24px 14px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;flex-shrink:0}
.files-head h2{font-size:19px;font-weight:600;letter-spacing:-.01em}
.files-head .sub{font-size:11.5px;color:var(--muted);margin-top:4px}
.files-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.files-search{display:flex;align-items:center;gap:7px;height:34px;padding:0 10px;border:1px solid var(--stroke);border-radius:9px;background:var(--bg-elev);min-width:180px;transition:border-color .15s,box-shadow .15s}
.files-search:focus-within{border-color:rgba(var(--accent-rgb),.55);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.13)}
.files-search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:12.5px;color:var(--text)}
.files-search svg{color:var(--muted)}
.files-list{flex:1;overflow:auto;padding:4px 14px 18px;min-height:0}
.file-row{display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px;border:1px solid transparent;transition:background .12s,border-color .12s;cursor:default}
.file-row:hover{background:var(--hover);border-color:var(--stroke-2)}
.file-row .art{width:40px;height:40px;border-radius:11px;flex-shrink:0;display:grid;place-items:center;overflow:hidden;background:linear-gradient(140deg,var(--g1,#5b7cfa),var(--g2,#8b5cf6));box-shadow:inset 0 1px 0 rgba(255,255,255,.3);position:relative}
.file-row .art svg{width:19px;height:19px}
.file-row .art .letter{font-size:16px;font-weight:600;color:#fff;line-height:1}
.file-row .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.file-row .meta{flex:1;min-width:0}
.file-row .nm{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-row .sub{font-size:11px;color:var(--muted);margin-top:3px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.file-row .sub i{font-style:normal;opacity:.45}
.file-row .row-actions{display:flex;gap:2px;opacity:.5;transition:opacity .14s;flex-shrink:0}
.file-row:hover .row-actions{opacity:1}
.files-empty{padding:46px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted);text-align:center}
.files-empty .art{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;background:var(--bg-elev);border:1px solid var(--stroke);margin-bottom:4px}
.files-empty b{color:var(--text);font-size:14px}
.files-empty p{font-size:12px;line-height:1.7;max-width:360px}
.files-empty .btn{margin-top:8px}

.settings{height:100%;overflow:auto;padding:24px 26px 40px;display:flex;flex-direction:column;gap:24px;max-width:860px;margin:0 auto;width:100%}
.set-sec{display:flex;flex-direction:column;gap:10px}
.set-title{font-size:13px;font-weight:600;letter-spacing:.01em}
.set-desc{font-size:11.5px;color:var(--muted);margin-top:-6px;line-height:1.6}
.set-card{background:var(--bg-elev);border:1px solid var(--stroke-2);border-radius:12px;padding:14px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--stroke-2)}
.set-row:first-child{padding-top:0}
.set-row:last-child{border-bottom:0;padding-bottom:0}
.set-row .lab{font-size:12.5px;line-height:1.4}
.set-row .hint{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.5}
.seg{display:flex;background:var(--bg-elev);border:1px solid var(--stroke);border-radius:9px;padding:2px;gap:2px;flex-shrink:0}
.seg button{height:28px;padding:0 11px;border-radius:7px;font-size:11.5px;color:var(--muted);transition:background .12s,color .12s}
.seg button.on{background:var(--active);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.16)}
.wp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.wp-opt{position:relative;height:66px;border-radius:10px;border:2px solid transparent;overflow:hidden;transition:border-color .15s,box-shadow .15s;background:#0b1020;cursor:pointer}
.wp-opt .wp-name{position:absolute;left:6px;bottom:5px;font-size:10px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);background:rgba(0,0,0,.38);padding:1px 6px;border-radius:4px;backdrop-filter:blur(4px)}
.wp-opt.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.2)}
.wp-opt.aurora{background:radial-gradient(circle at 30% 26%,#2d6bff,transparent 58%),radial-gradient(circle at 76% 70%,#00d4c8,transparent 55%),radial-gradient(circle at 60% 20%,#8b5cf6,transparent 50%),#070b16}
.wp-opt.dusk{background:radial-gradient(circle at 24% 24%,#ff7a45,transparent 58%),radial-gradient(circle at 76% 66%,#ff3d7f,transparent 55%),linear-gradient(150deg,#1a0b2e,#3b0d3a 60%,#0a0714)}
.wp-opt.ocean{background:radial-gradient(circle at 28% 24%,#00b8d4,transparent 58%),radial-gradient(circle at 78% 76%,#14e0a0,transparent 55%),linear-gradient(160deg,#03121f,#062b33)}
.wp-opt.nebula{background:radial-gradient(circle at 32% 30%,#5b21b6,transparent 60%),radial-gradient(circle at 72% 70%,#1d4ed8,transparent 58%),#05040d}
.wp-opt.mono{background:linear-gradient(150deg,#161b24,#0a0c11);background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:12px 12px}
.wp-opt.custom{background:linear-gradient(140deg,#334155,#0f172a)}
.dots{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dot{width:24px;height:24px;border-radius:50%;border:2px solid transparent;transition:transform .12s,box-shadow .12s;position:relative}
.dot:hover{transform:scale(1.1)}
.dot.on{border-color:rgba(255,255,255,.9);box-shadow:0 0 0 2px rgba(var(--accent-rgb),.5)}
.toggle{width:40px;height:23px;border-radius:99px;background:rgba(255,255,255,.17);position:relative;transition:background .18s;flex-shrink:0;cursor:pointer}
[data-theme="light"] .toggle{background:rgba(12,22,40,.18)}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:transform .18s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.toggle.on{background:var(--accent)}
.toggle.on::after{transform:translateX(17px)}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg-elev);border:1px solid var(--stroke-2);border-radius:10px;padding:12px}
.stat b{display:block;font-size:18px;font-weight:600;line-height:1.2;word-break:break-all}
.stat span{font-size:10.5px;color:var(--muted);display:block;margin-top:3px}

.notes{height:100%;display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(var(--accent-rgb),.035),transparent 30%)}
.notes-top{display:flex;align-items:center;gap:10px;padding:14px 18px 4px;flex-shrink:0}
.note-title{flex:1;border:0;background:none;outline:none;font-size:16px;font-weight:600;color:var(--text);padding:6px 0}
.note-title::placeholder{color:var(--muted-2)}
.note-body{flex:1;resize:none;border:0;outline:none;background:none;padding:8px 20px 18px;font-size:13px;line-height:1.8;color:var(--text);min-height:0}
.note-body::placeholder{color:var(--muted-2)}
.note-foot{padding:8px 18px;border-top:1px solid var(--stroke-2);font-size:10.5px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-shrink:0}

.welcome{height:100%;overflow:auto;padding:34px 32px 30px;position:relative;background:radial-gradient(120% 100% at 0% 0%,rgba(var(--accent-rgb),.15),transparent 56%)}
.welcome .mark{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(140deg,#7d9bff,#8b5cf6 58%,#d06bff);box-shadow:0 18px 40px -12px rgba(108,120,255,.7),inset 0 1px 0 rgba(255,255,255,.35)}
.welcome h1{font-size:26px;margin:18px 0 9px;letter-spacing:-.02em;line-height:1.25}
.welcome .lead{font-size:13px;line-height:1.8;color:var(--muted);max-width:580px}
.welcome .lead b{color:var(--text);font-weight:600}
.welcome .cta{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 26px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:760px}
.step{background:var(--bg-elev);border:1px solid var(--stroke-2);border-radius:12px;padding:14px}
.step b{display:block;font-size:10.5px;color:var(--accent);letter-spacing:.12em;margin-bottom:6px}
.step h3{font-size:13px;margin-bottom:5px;font-weight:600}
.step p{font-size:11.5px;color:var(--muted);line-height:1.65}
.welcome .foot-note{margin-top:22px;font-size:11px;color:var(--muted-2);line-height:1.7;max-width:620px}
.about{height:100%;overflow:auto;padding:32px;display:flex;flex-direction:column;gap:20px;max-width:720px;margin:0 auto;width:100%}
.about .hero{display:flex;align-items:center;gap:16px}
.about .mark{width:58px;height:58px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(140deg,#7d9bff,#8b6cf6 55%,#d06bff);box-shadow:0 18px 40px -14px rgba(108,120,255,.75),inset 0 1px 0 rgba(255,255,255,.4);flex-shrink:0}
.about h1{font-size:20px;letter-spacing:-.01em}
.about .ver{font-size:11.5px;color:var(--muted);margin-top:4px}
.about p{font-size:12.5px;line-height:1.75;color:var(--muted)}
.about .kbd-list{display:flex;flex-direction:column;gap:1px;border:1px solid var(--stroke-2);border-radius:12px;overflow:hidden;background:var(--bg-elev)}
.kbd-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 13px;font-size:12px;border-bottom:1px solid var(--stroke-2)}
.kbd-row:last-child{border-bottom:0}
.kbd-row span:first-child{color:var(--muted)}
kbd{display:inline-block;padding:2px 6px;border-radius:5px;border:1px solid var(--stroke);background:var(--bg-elev);font-size:10.5px;font-family:inherit;color:var(--text);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.about .chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:10.5px;color:var(--muted);border:1px solid var(--stroke);border-radius:99px;padding:4px 9px;background:var(--bg-elev)}

@media (max-width:880px){
  .start-grid{grid-template-columns:repeat(auto-fill,minmax(124px,1fr))}
}
@media (max-width:720px){
  :root{--taskbar-h:60px}
  #tb-center{left:8px;transform:none;max-width:calc(100vw - 118px)}
  .tb-status{display:none}
  #tb-clock .d{display:none}
  #tb-clock{height:36px;padding:0 6px}
  #tb-clock .t{font-size:12px}
  #tb-showdesk{display:none}
  #desktop-icons{padding:10px 8px;gap:2px}
  .d-icon{width:80px;height:89px}
  .d-icon-art{width:42px;height:42px}
  .d-icon-label{font-size:11px}
  .win-titlebar{height:46px}
  .files-head{padding:16px 16px 10px;align-items:flex-start;flex-direction:column;gap:10px}
  .files-tools{width:100%}
  .files-search{flex:1;min-width:0}
  .files-list{padding:2px 8px 14px}
  .settings{padding:18px 16px 30px;gap:20px}
  .stat-grid{grid-template-columns:1fr 1fr}
  .welcome{padding:26px 22px}
  .welcome h1{font-size:22px}
  .steps{grid-template-columns:1fr}
  .about{padding:24px 20px}
  .start-grid{grid-template-columns:repeat(2,1fr);gap:2px}
  .start-app .sb{display:none}
  .file-row .row-actions{opacity:1}
  #toasts{right:8px;bottom:calc(var(--taskbar-h) + 8px)}
  .toast{min-width:0;max-width:calc(100vw - 16px)}
}
@media (max-width:520px){
  #start{width:calc(100vw - 12px);bottom:calc(var(--taskbar-h) + 6px);border-radius:14px}
  .start-head{padding:14px 14px 6px}
  .start-body{padding:2px 10px 10px}
  .start-foot{padding:8px 10px}
  .start-user .st{display:none}
  .welcome{padding:24px 18px}
  .welcome .cta .btn{flex:1;justify-content:center}
  .file-row{padding:8px 6px;gap:10px}
  .file-row .art{width:36px;height:36px}
  .file-row .sub i{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

(() => {
'use strict';

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const clamp = (n, min, max) => Math.min(max, Math.max(min, n));
const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
const uid = (prefix) => prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = (value) => String(value).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const fmtBytes = (bytes) => {
  const n = Number(bytes) || 0;
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(n < 10240 ? 1 : 0) + ' KB';
  return (n / 1024 / 1024).toFixed(n < 10 * 1024 * 1024 ? 1 : 0) + ' MB';
};
const fmtDate = (ts) => {
  try { return new Intl.DateTimeFormat('zh-CN', { month: 'numeric', day: 'numeric' }).format(new Date(ts)); }
  catch (err) { return ''; }
};
const initialOf = (name) => {
  const value = String(name || '').trim();
  if (!value) return '?';
  const first = Array.from(value)[0];
  return /[a-z]/i.test(first) ? first.toUpperCase() : first;
};
const hexToRgb = (hex) => {
  let h = String(hex || '').replace('#', '');
  if (h.length === 3) h = h.split('').map((c) => c + c).join('');
  const n = parseInt(h, 16);
  if (!Number.isFinite(n)) return [108, 140, 255];
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
};
const hashHue = (str) => {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (Math.imul(h, 31) + str.charCodeAt(i)) >>> 0;
  return h % 360;
};

const VERSION = '1.0.0';

const DB_STORE = 'apps';
const DEFAULT_SETTINGS = { theme: 'dark', wallpaper: 'aurora', accent: '#6c8cff', motion: true, wallpaperImage: '' };
const ACCENTS = ['#6c8cff', '#a78bfa', '#34d399', '#f5b84b', '#fb7185'];
const WALLPAPERS = [

  external: '<path d="M14 4h6v6"/><path d="M20 4 11.2 12.8"/><path d="M18 14.5v3A2.5 2.5 0 0 1 15.5 20h-9A2.5 2.5 0 0 1 4 17.5v-9A2.5 2.5 0 0 1 6.5 6h3"/>',
  keyboard: '<rect x="2.5" y="6" width="19" height="12" rx="2.2"/><path d="M6 10h.01M9.3 10h.01M12.6 10h.01M15.9 10h.01M19 10h.01M7.5 14h9"/>',
  spark: '<path d="M12 3.5 13.8 9l5.7 1.8-5.7 1.8L12 18.5l-1.8-5.9L4.5 10.8 10.2 9Z"/>',
  calendar: '<rect x="3.5" y="5.5" width="17" height="15" rx="2.2"/><path d="M3.5 10h17M8 3.5v4M16 3.5v4"/>'
};

function icon(name, size = 20) {
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[name] || ICONS.window) + '</svg>';
}

function logoMark(size = 28) {
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2.6 21 8.6 12 21.6 3 8.6Z" fill="rgba(255,255,255,.16)" stroke="rgba(255,255,255,.94)" stroke-width="1.15" stroke-linejoin="round"/><path d="M3 8.6h18M12 2.6v19M7.4 8.6 12 21.6l4.6-13" stroke="rgba(255,255,255,.7)" stroke-width=".85" stroke-linejoin="round"/></svg>';
}

const BUILTINS = {
  files: { id: 'files', name: '应用库', sub: '导入与管理应用', icon: 'folder', g1: '#5b8cff', g2: '#7c5cff', w: 920, h: 620, render: renderFilesApp },
  settings: { id: 'settings', name: '设置', sub: '外观与系统', icon: 'sliders', g1: '#64748b', g2: '#94a3b8', w: 880, h: 680, render: renderSettingsApp },
  notes: { id: 'notes', name: '备忘录', sub: '随手记录', icon: 'note', g1: '#f5b84b', g2: '#f97316', w: 760, h: 540, render: renderNotesApp },
  welcome: { id: 'welcome', name: '欢迎使用', sub: '快速上手', icon: 'spark', g1: '#7d9bff', g2: '#b06cff', w: 880, h: 640, render: renderWelcomeApp },
  about: { id: 'about', name: '关于幻境', sub: '版本信息', icon: 'info', g1: '#38bdf8', g2: '#6366f1', w: 680, h: 600, render: renderAboutApp }
};

const state = {
  apps: new Map(),
  windows: new Map(),
  zTop: 10,
  activeKey: null,
  selectedIcon: null,
  startOpen: false,
  embedded: null,
  exportId: 'local',
  booted: false
};

let settings = { ...DEFAULT_SETTINGS };
let db = null;
let dbReady = false;
let dragDepth = 0;
let clockTimer = 0;
const bus = new EventTarget();
const emit = (type, detail) => bus.dispatchEvent(new CustomEvent(type, { detail }));

function loadSettings() {
  const loaded = { ...DEFAULT_SETTINGS };
  try {
    const raw = localStorage.getItem(LS.settings);
    if (raw) Object.assign(loaded, JSON.parse(raw));
  } catch (err) {}
  if (!/^#[0-9a-f]{6}$/i.test(String(loaded.accent || ''))) loaded.accent = DEFAULT_SETTINGS.accent;
  if (!['dark', 'light'].includes(loaded.theme)) loaded.theme = DEFAULT_SETTINGS.theme;
  if (!WALLPAPERS.some((w) => w.id === loaded.wallpaper)) loaded.wallpaper = DEFAULT_SETTINGS.wallpaper;
  loaded.motion = loaded.motion !== false;
  return loaded;
}

function saveSettings() {
  try {
    localStorage.setItem(LS.settings, JSON.stringify(settings));
    return true;
  } catch (err) {
    return false;
  }
}

function applySettings() {
  const root = document.documentElement;
  root.dataset.theme = settings.theme === 'light' ? 'light' : 'dark';
  root.dataset.wallpaper = settings.wallpaper || 'aurora';
  root.dataset.motion = settings.motion === false ? 'off' : 'on';
  root.style.setProperty('--accent', settings.accent);
  root.style.setProperty('--accent-rgb', hexToRgb(settings.accent).join(','));
  const wp = $('#wp-image');
  if (wp) {
    if (settings.wallpaper === 'custom' && settings.wallpaperImage) {
      if (wp.getAttribute('src') !== settings.wallpaperImage) wp.setAttribute('src', settings.wallpaperImage);
    } else {
      wp.removeAttribute('src');
    }
  }
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', settings.theme === 'light' ? '#eef2f9' : '#05070d');
}

function setSettings(patch, opts = {}) {
  settings = { ...settings, ...patch };
  applySettings();
  saveSettings();
  if (opts.notify !== false) emit('settings-changed', settings);
}

function fallbackRead() {
  try {
    const raw = localStorage.getItem(LS.localApps);
    return raw ? JSON.parse(raw) : [];
  } catch (err) {
    return [];
  }
}

function fallbackWrite(apps) {
  try {
    localStorage.setItem(LS.localApps, JSON.stringify(apps));
    return true;
  } catch (err) {
    return false;
  }
}

function openDB() {
  return new Promise((resolve, reject) => {
    let req;
    try {
      if (!('indexedDB' in window)) throw new Error('IndexedDB unavailable');
      req = indexedDB.open(DB_NAME, 1);
    } catch (err) {
      reject(err);
      return;
    }
    req.onupgradeneeded = () => {
      const database = req.result;
      if (!database.objectStoreNames.contains(DB_STORE)) database.createObjectStore(DB_STORE, { keyPath: 'id' });
    };
    req.onsuccess = () => {
      db = req.result;
      dbReady = true;
      resolve(db);
    };
    req.onerror = () => reject(req.error || new Error('IndexedDB open failed'));
    req.onblocked = () => reject(new Error('IndexedDB blocked'));
  });
}

function dbAll() {
  return new Promise((resolve, reject) => {
    if (!dbReady || !db) return reject(new Error('no db'));
    const tx = db.transaction(DB_STORE, 'readonly');
    const req = tx.objectStore(DB_STORE).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

function dbPut(app) {
  return new Promise((resolve, reject) => {
    if (!dbReady || !db) return reject(new Error('no db'));
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).put(app);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error || new Error('aborted'));
  });
}

function dbDelete(id) {
  return new Promise((resolve, reject) => {
    if (!dbReady || !db) return reject(new Error('no db'));
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).delete(id);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}

async function persistApp(app) {
  const record = { ...app };
  if (dbReady) {
    try {
      await dbPut(record);
      return true;
    } catch (err) {}
  }
  const all = fallbackRead().filter((item) => item.id !== app.id);
  all.push(record);
  return fallbackWrite(all);
}

async function removePersisted(id) {
  if (dbReady) {
    try { await dbDelete(id); } catch (err) {}
  }
  fallbackWrite(fallbackRead().filter((item) => item.id !== id));
}

async function readEmbedded() {
  const node = document.getElementById('embedded-data');
  if (!node) return null;
  try {
    const data = JSON.parse(node.textContent || 'null');
    if (!data || !Array.isArray(data.apps)) return null;
    return data;
  } catch (err) {
    return null;
  }
}

async function hydrateApps(embedded) {
  try {
    await openDB();
  } catch (err) {
    dbReady = false;
  }

  if (embedded) {
    state.embedded = embedded;
    state.exportId = embedded.exportId || 'embedded';
    for (const raw of embedded.apps) {
      if (!raw || !raw.id || typeof raw.html !== 'string') continue;
      const app = { ...raw, group: state.exportId };
      state.apps.set(app.id, app);
    }
    if (dbReady) {
      try {
        const saved = await dbAll();
        for (const app of saved) {
          if (app.group === state.exportId && !state.apps.has(app.id)) state.apps.set(app.id, app);
        }
      } catch (err) {}
    } else {
      for (const app of fallbackRead()) {
        if (app.group === state.exportId && !state.apps.has(app.id)) state.apps.set(app.id, app);
      }
    }
    return;
  }

  let stored = [];
  if (dbReady) {
    try {
      stored = (await dbAll()).filter((app) => !app.group || app.group === 'local');
    } catch (err) {
      stored = fallbackRead();
    }
  } else {
    stored = fallbackRead();
  }
  for (const app of stored) {
    if (!app || !app.id || typeof app.html !== 'string') continue;
    state.apps.set(app.id, { ...app, group: app.group || 'local' });
  }
}

function taskbarHeight() {
  const raw = getComputedStyle(document.documentElement).getPropertyValue('--taskbar-h');
  return parseFloat(raw) || 58;
}

function workArea() {
  return { x: 0, y: 0, w: window.innerWidth, h: Math.max(240, window.innerHeight - taskbarHeight()) };
}

function snapGap() {
  return window.innerWidth < 560 ? 6 : 8;
}

function maxRect() {
  const wa = workArea();
  const g = snapGap();
  return { x: g, y: g, w: Math.max(240, wa.w - g * 2), h: Math.max(180, wa.h - g * 2) };
}

function makeArt(opts = {}) {
  const el = document.createElement('span');
  el.className = opts.className || 'art';
  const key = opts.key || '';
  const name = opts.name || '';
  const size = opts.size || 36;
  const hue = hashHue(key + name);
  el.style.setProperty('--g1', opts.g1 || 'hsl(' + hue + ' 72% 62%)');
  el.style.setProperty('--g2', opts.g2 || 'hsl(' + ((hue + 46) % 360) + ' 68% 46%)');
  if (opts.svg) {
    el.innerHTML = icon(opts.svg, Math.round(size * 0.48));
  } else {
    const letter = document.createElement('span');
    letter.className = 'letter';
    letter.style.fontSize = Math.round(size * 0.42) + 'px';
    letter.textContent = initialOf(name);
    el.appendChild(letter);
  }
  if (opts.icon) {
    const img = document.createElement('img');
    img.alt = '';
    img.decoding = 'async';
    img.onerror = () => img.remove();
    img.src = opts.icon;
    el.appendChild(img);
  }
  return el;
}

function resolveApp(key) {
  if (key.startsWith('app.')) {
    const app = state.apps.get(key.slice(4));
    if (!app) return null;
    return { key, type: 'imported', app };
  }
  const builtin = BUILTINS[key];
  if (!builtin) return null;
  return { key, type: 'builtin', app: builtin };
}

function windowTitleArt(def) {
  if (def.type === 'builtin') {
    const app = def.app;
    return makeArt({ key: app.id, name: app.name, svg: app.icon, g1: app.g1, g2: app.g2, size: 18, className: 't-art' });
  }
  return makeArt({ key: def.app.id, name: def.app.name, icon: def.app.icon, size: 18, className: 't-art' });
}

function updateMaxButton(win) {
  const btn = $('[data-role="max"]', win.el);
  if (!btn) return;
  const isMax = win.max;
  btn.innerHTML = icon(isMax ? 'restore' : 'maximize', 14);
  btn.title = isMax ? '还原' : '最大化';
}

function setBounds(win, rect, animate) {
  win.rect = { x: Math.round(rect.x), y: Math.round(rect.y), w: Math.round(rect.w), h: Math.round(rect.h) };
  if (animate) win.el.classList.add('anim');
  win.el.style.left = win.rect.x + 'px';
  win.el.style.top = win.rect.y + 'px';
  win.el.style.width = win.rect.w + 'px';
  win.el.style.height = win.rect.h + 'px';
  if (animate) setTimeout(() => win.el.classList.remove('anim'), 360);
}

function focusWindow(win) {
  if (!win || win.minimized) return;
  state.zTop += 1;
  win.el.style.zIndex = String(state.zTop);
  if (state.activeKey === win.key) return;
  for (const other of state.windows.values()) other.el.classList.toggle('active', other === win);
  state.activeKey = win.key;
  syncTaskbar();
}

function openApp(key) {
  const def = resolveApp(key);
  if (!def) {
    toast('应用不存在或已被移除', 'error');
    return;
  }
  const existing = state.windows.get(key);
  if (existing) {
    if (existing.minimized) restoreWindow(existing);
    else focusWindow(existing);
    return;
  }

  const wa = workArea();
  const base = def.type === 'builtin' ? def.app : { w: 940, h: 640 };
  let width = Math.min(base.w || 900, Math.max(320, wa.w - 24));
  let height = Math.min(base.h || 600, Math.max(220, wa.h - 24));
  const count = state.windows.size;
  let x = Math.round((wa.w - width) / 2) + (count % 5) * 26 - 52;
  let y = Math.round((wa.h - height) / 2) + (count % 5) * 20 - 40;
  if (window.innerWidth < 720) {
    x = 6;
    y = 6;
    width = Math.max(280, wa.w - 12);
    height = Math.max(200, wa.h - 12);
  }
  x = clamp(x, 8, Math.max(8, wa.w - width - 8));
  y = clamp(y, 8, Math.max(8, wa.h - height - 8));

  const title = def.app.name;
  const el = document.createElement('section');
  el.className = 'win opening';
  el.dataset.key = key;
  el.setAttribute('role', 'dialog');
  el.setAttribute('aria-label', title);

  const bar = document.createElement('header');
  bar.className = 'win-titlebar';
  const titleWrap = document.createElement('div');
  titleWrap.className = 'win-title';
  titleWrap.appendChild(windowTitleArt(def));
  const titleText = document.createElement('span');
  titleText.className = 't-name';
  titleText.textContent = title;
  titleWrap.appendChild(titleText);
  bar.appendChild(titleWrap);

  const controls = document.createElement('div');
  controls.className = 'win-controls';
  const minBtn = document.createElement('button');
  minBtn.className = 'win-btn';
  minBtn.dataset.role = 'min';
  minBtn.title = '最小化';
  minBtn.setAttribute('aria-label', '最小化');
  minBtn.innerHTML = icon('minimize', 14);
  const maxBtn = document.createElement('button');
  maxBtn.className = 'win-btn';
  maxBtn.dataset.role = 'max';
  maxBtn.title = '最大化';
  maxBtn.setAttribute('aria-label', '最大化');
  maxBtn.innerHTML = icon('maximize', 14);
  const closeBtn = document.createElement('button');
  closeBtn.className = 'win-btn close';
  closeBtn.dataset.role = 'close';
  closeBtn.title = '关闭';
  closeBtn.setAttribute('aria-label', '关闭');
  closeBtn.innerHTML = icon('close', 14);
  controls.append(minBtn, maxBtn, closeBtn);
  bar.appendChild(controls);
  el.appendChild(bar);

  const body = document.createElement('div');
  body.className = 'win-body';
  el.appendChild(body);

  for (const dir of ['n', 's', 'e', 'w', 'ne', 'nw', 'se', 'sw']) {
    const handle = document.createElement('div');
    handle.className = 'rz';
    handle.dataset.dir = dir;
    el.appendChild(handle);
  }

  const win = {
    key,
    type: def.type,
    def,
    app: def.app,
    el,
    titleEl: titleText,
    bodyEl: body,
    rect: { x, y, w: width, h: height },
    restoreRect: null,
    max: false,
    minimized: false,
    created: Date.now(),
    dispose: null,
    iframe: null,
    closing: false
  };

  setBounds(win, win.rect, false);
  $('#windows').appendChild(el);
  state.windows.set(key, win);
  focusWindow(win);

  if (def.type === 'builtin') {
    const root = document.createElement('div');
    root.className = 'app';
    root.dataset.app = key;
    body.appendChild(root);
    try {
      const result = def.app.render(root, win);
      if (typeof result === 'function') win.dispose = result;
    } catch (err) {
      console.error(err);
      root.innerHTML = '<div class="files-empty"><b>应用加载失败</b><p>' + esc(err && err.message ? err.message : String(err)) + '</p></div>';
    }
  } else {
    const loader = document.createElement('div');
    loader.className = 'win-loader';
    loader.innerHTML = '<div class="spinner"></div>';
    body.appendChild(loader);
    const frame = document.createElement('iframe');
    frame.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-downloads allow-pointer-lock allow-popups-to-escape-sandbox');
    frame.setAttribute('title', title);
    frame.srcdoc = def.app.html;
    win.iframe = frame;
    body.appendChild(frame);
    let hidden = false;
    const hideLoader = () => {
      if (hidden) return;
      hidden = true;
      loader.classList.add('hide');
      setTimeout(() => loader.remove(), 320);
    };
    frame.addEventListener('load', () => setTimeout(hideLoader, 80), { once: true });
    setTimeout(hideLoader, 5000);
  }

  el.addEventListener('pointerdown', () => focusWindow(win), true);
  bar.addEventListener('pointerdown', (event) => startDrag(win, event));
  bar.addEventListener('dblclick', (event) => {
    if (event.target.closest('button')) return;
    toggleMaximize(win);
  });
  minBtn.addEventListener('click', () => minimizeWindow(win));
  maxBtn.addEventListener('click', () => toggleMaximize(win));
  closeBtn.addEventListener('click', () => closeWindow(win));
  for (const handle of $$('.rz', el)) handle.addEventListener('pointerdown', (event) => startResize(win, event, handle.dataset.dir));

  setTimeout(() => {
    el.classList.remove('opening');
    if (win.rect.w > 340 && win.rect.h > 260 && !win.max) setBounds(win, win.rect, false);
  }, 320);

  syncTaskbar();
  syncStartResults();
  return win;
}

function closeWindow(win) {
  if (!win || win.closing) return;
  win.closing = true;
  if (typeof win.dispose === 'function') {
    try { win.dispose(); } catch (err) {}
  }
  if (win.iframe) {
    try { win.iframe.srcdoc = ''; } catch (err) {}
  }
  win.el.classList.add('closing');
  setTimeout(() => {
    win.el.remove();
    state.windows.delete(win.key);
    if (state.activeKey === win.key) {
      state.activeKey = null;
      let top = null;
      for (const other of state.windows.values()) {
        if (other.minimized) continue;
        if (!top || other.el.style.zIndex > top.el.style.zIndex) top = other;
      }
      if (top) focusWindow(top);
    }
    syncTaskbar();
    syncStartResults();
  }, 170);
}

function toggleMaximize(win) {
  if (!win || win.minimized) return;
  const wa = workArea();
  if (win.max) {
    win.max = false;
    win.el.classList.remove('max');
    setBounds(win, win.restoreRect || { x: 80, y: 80, w: Math.min(880, wa.w - 120), h: Math.min(600, wa.h - 120) }, true);
    updateMaxButton(win);
  } else {
    win.restoreRect = { ...win.rect };
    win.max = true;
    win.el.classList.add('max');
    setBounds(win, maxRect(), true);
    updateMaxButton(win);
  }
  focusWindow(win);
}

function minimizeWindow(win) {
  if (!win || win.minimized) return;
  const from = win.el.getBoundingClientRect();
  const selector = '.tb-btn[data-key="' + String(win.key).replace(/"/g, '\\"') + '"]';
  const button = document.querySelector(selector);
  win.minimized = true;
  if (state.activeKey === win.key) state.activeKey = null;
  for (const other of state.windows.values()) other.el.classList.remove('active');
  syncTaskbar();
  const finish = () => {
    win.el.style.display = 'none';
    win.el.style.transform = '';
    win.el.style.opacity = '';
  };
  if (button) {
    const to = button.getBoundingClientRect();
    const dx = (to.left + to.width / 2) - (from.left + from.width / 2);
    const dy = (to.top + to.height / 2) - (from.top + from.height / 2);
    const anim = win.el.animate([
      { transform: 'translate(0,0) scale(1)', opacity: 1 },
      { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(.14)', opacity: 0 }
    ], { duration: 260, easing: 'cubic-bezier(.4,0,.2,1)' });
    anim.onfinish = finish;
  } else {
    setTimeout(finish, 150);
  }
}

function restoreWindow(win) {
  if (!win || !win.minimized) {
    if (win) focusWindow(win);
    return;
  }
  win.el.getAnimations().forEach((anim) => anim.cancel());
  win.minimized = false;
  win.el.style.display = '';
  focusWindow(win);
  const selector = '.tb-btn[data-key="' + String(win.key).replace(/"/g, '\\"') + '"]';
  const button = document.querySelector(selector);
  if (button) {
    const to = win.el.getBoundingClientRect();
    const from = button.getBoundingClientRect();
    const dx = (from.left + from.width / 2) - (to.left + to.width / 2);
    const dy = (from.top + from.height / 2) - (to.top + to.height / 2);
    win.el.animate([
      { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(.14)', opacity: 0 },
      { transform: 'translate(0,0) scale(1)', opacity: 1 }
    ], { duration: 260, easing: 'cubic-bezier(.16,1,.3,1)' });
  }
  syncTaskbar();
}

function detectSnap(px, py) {
  const wa = workArea();
  const g = snapGap();
  if (py <= 12) return { type: 'max', ...maxRect() };
  const halfW = Math.max(240, Math.round((wa.w - g * 3) / 2));
  if (px <= 12) return { type: 'left', x: g, y: g, w: halfW, h: Math.max(180, wa.h - g * 2) };
  if (px >= window.innerWidth - 12) return { type: 'right', x: wa.w - g - halfW, y: g, w: halfW, h: Math.max(180, wa.h - g * 2) };
  return null;
}

function showSnap(rect) {
  const preview = $('#snap-preview');
  if (!rect) {
    preview.classList.remove('show');
    return;
  }
  preview.style.left = rect.x + 'px';
  preview.style.top = rect.y + 'px';
  preview.style.width = rect.w + 'px';
  preview.style.height = rect.h + 'px';
  preview.classList.add('show');
}

function hideSnap() {
  $('#snap-preview').classList.remove('show');
}

function startDrag(win, event) {
  if (event.button !== undefined && event.button !== 0) return;
  if (event.target.closest('button')) return;
  event.preventDefault();
  focusWindow(win);
  const wa = workArea();
  const pointerId = event.pointerId;
  const startX = event.clientX;
  const startY = event.clientY;
  let base = { ...win.rect };
  const preDrag = { ...win.rect };

  if (win.max) {
    const ratio = clamp((event.clientX - win.rect.x) / Math.max(1, win.rect.w), 0, 1);
    const target = win.restoreRect || { w: Math.min(900, wa.w - 120), h: Math.min(620, wa.h - 120) };
    const width = Math.min(target.w, wa.w - 24);
    const height = Math.min(target.h, wa.h - 24);
    const x = clamp(event.clientX - width * ratio, 8, Math.max(8, wa.w - width - 8));
    win.max = false;
    win.el.classList.remove('max');
    updateMaxButton(win);
    setBounds(win, { x, y: 8, w: width, h: height }, false);
    base = { x, y: 8, w: width, h: height };
  }

  win.el.classList.add('dragging');
  document.body.classList.add('is-dragging');
  $('#drag-shield').classList.add('on');
  let dx = 0;
  let dy = 0;
  let moved = false;
  let raf = 0;
  let snap = null;

  const render = () => {
    raf = 0;
    win.el.style.transform = 'translate3d(' + dx + 'px,' + dy + 'px,0)';
  };

  const onMove = (ev) => {
    if (ev.pointerId !== pointerId) return;
    dx = ev.clientX - startX;
    dy = ev.clientY - startY;
    if (!moved && Math.hypot(dx, dy) > 3) moved = true;
    if (!moved) return;
    if (!raf) raf = requestAnimationFrame(render);
    snap = detectSnap(ev.clientX, ev.clientY);
    showSnap(snap);
  };

  const finish = (ev) => {
    if (ev && ev.pointerId !== pointerId) return;
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', finish);
    window.removeEventListener('pointercancel', finish);
    if (raf) cancelAnimationFrame(raf);
    win.el.classList.remove('dragging');
    document.body.classList.remove('is-dragging');
    $('#drag-shield').classList.remove('on');
    hideSnap();
    if (snap) {
      win.el.style.transform = '';
      if (!win.max) win.restoreRect = { ...preDrag };
      setBounds(win, snap, true);
      if (snap.type === 'max') {
        win.max = true;
        win.el.classList.add('max');
        updateMaxButton(win);
      }
    } else if (moved) {
      const nx = clamp(base.x + dx, -base.w + 140, wa.w - 140);
      const ny = clamp(base.y + dy, 0, Math.max(0, wa.h - 46));
      win.el.style.transform = '';
      setBounds(win, { x: nx, y: ny, w: base.w, h: base.h }, false);
    } else {
      win.el.style.transform = '';
    }
    snap = null;
  };

  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', finish);
  window.addEventListener('pointercancel', finish);
}

function startResize(win, event, dir) {
  if (event.button !== undefined && event.button !== 0) return;
  if (win.max || win.minimized) return;
  event.preventDefault();
  event.stopPropagation();
  focusWindow(win);
  const start = { ...win.rect };
  const startX = event.clientX;
  const startY = event.clientY;
  const pointerId = event.pointerId;
  const wa = workArea();
  const minW = Math.min(340, Math.max(260, wa.w - 40));
  const minH = Math.min(220, Math.max(180, wa.h - 40));
  let raf = 0;
  let current = { ...start };
  document.body.classList.add('is-resizing');
  $('#drag-shield').classList.add('on');

  const apply = () => {
    raf = 0;
    win.el.style.left = current.x + 'px';
    win.el.style.top = current.y + 'px';
    win.el.style.width = current.w + 'px';
    win.el.style.height = current.h + 'px';
    win.rect = { ...current };
  };

  const onMove = (ev) => {
    if (ev.pointerId !== pointerId) return;
    const dx = ev.clientX - startX;
    const dy = ev.clientY - startY;
    let x = start.x;
    let y = start.y;
    let w = start.w;
    let h = start.h;
    if (dir.includes('e')) w = Math.max(minW, start.w + dx);
    if (dir.includes('s')) h = Math.max(minH, start.h + dy);
    if (dir.includes('w')) {
      w = Math.max(minW, start.w - dx);
      x = start.x + (start.w - w);
    }
    if (dir.includes('n')) {
      h = Math.max(minH, start.h - dy);
      y = start.y + (start.h - h);
    }
    if (dir.includes('w') || dir.includes('n')) {
      x = Math.min(x, wa.w - minW);
      y = Math.min(y, wa.h - minH);
    }
    current = { x, y, w, h };
    if (!raf) raf = requestAnimationFrame(apply);
  };

  const finish = (ev) => {
    if (ev && ev.pointerId !== pointerId) return;
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', finish);
    window.removeEventListener('pointercancel', finish);
    if (raf) cancelAnimationFrame(raf);
    document.body.classList.remove('is-resizing');
    $('#drag-shield').classList.remove('on');
    current.x = Math.max(-current.w + 140, Math.min(current.x, wa.w - 120));
    current.y = Math.max(0, Math.min(current.y, wa.h - 46));
    apply();
  };

  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', finish);
  window.addEventListener('pointercancel', finish);
}

function syncWindowTitles() {
  for (const win of state.windows.values()) {
    if (win.type === 'imported') {
      const app = state.apps.get(win.key.slice(4));
      if (!app) continue;
      win.app = app;
      win.titleEl.textContent = app.name;
      win.el.setAttribute('aria-label', app.name);
      if (win.iframe) win.iframe.setAttribute('title', app.name);
      const art = win.el.querySelector('.win-title .t-art');
      if (art) art.replaceWith(makeArt({ key: app.id, name: app.name, icon: app.icon, size: 18, className: 't-art' }));
    }
  }
}

function clampAllWindows() {
  const wa = workArea();
  for (const win of state.windows.values()) {
    if (win.minimized) continue;
    if (win.max) {
      setBounds(win, maxRect(), false);
      continue;
    }
    const width = clamp(win.rect.w, 280, Math.max(280, wa.w - 8));
    const height = clamp(win.rect.h, 180, Math.max(180, wa.h - 8));
    const x = clamp(win.rect.x, -width + 140, Math.max(4, wa.w - 140));
    const y = clamp(win.rect.y, 0, Math.max(0, wa.h - 46));
    setBounds(win, { x, y, w: width, h: height }, false);
  }
}

let resizeRaf = 0;
window.addEventListener('resize', () => {
  if (resizeRaf) cancelAnimationFrame(resizeRaf);
  resizeRaf = requestAnimationFrame(() => {
    resizeRaf = 0;
    clampAllWindows();
  });
});

const PINNED = ['files', 'settings'];

function taskbarDef(key) {
  const def = resolveApp(key);
  return def ? def.app : null;
}

function syncTaskbar() {
  const tasks = $('#tb-tasks');
  if (!tasks) return;
  tasks.innerHTML = '';
  const keys = [...PINNED];
  for (const win of state.windows.values()) {
    if (!keys.includes(win.key)) keys.push(win.key);
  }
  for (const key of keys) {
    const app = taskbarDef(key);
    if (!app) continue;
    const win = state.windows.get(key);
    const btn = document.createElement('button');
    btn.className = 'tb-btn' + (win ? ' running' : '') + (state.activeKey === key ? ' active' : '');
    btn.dataset.key = key;
    btn.title = app.name;
    btn.setAttribute('aria-label', app.name);
    if (key.startsWith('app.')) {
      btn.appendChild(makeArt({ key: app.id, name: app.name, icon: app.icon, size: 26, className: 'tb-glyph' }));
    } else {
      btn.appendChild(makeArt({ key: app.id, name: app.name, svg: app.icon, g1: app.g1, g2: app.g2, size: 26, className: 'tb-glyph' }));
    }
    btn.addEventListener('click', () => {
      closeStart();
      const current = state.windows.get(key);
      if (current) {
        if (current.minimized) restoreWindow(current);
        else if (state.activeKey === key) minimizeWindow(current);
        else focusWindow(current);
      } else {
        openApp(key);
      }
    });
    tasks.appendChild(btn);
  }
  $('#start-btn').classList.toggle('active', state.startOpen);
  $('#start-btn').setAttribute('aria-expanded', state.startOpen ? 'true' : 'false');
}

function renderDesktopIcons(animateKey) {
  const container = $('#desktop-icons');
  if (!container) return;
  container.innerHTML = '';
  const entries = [];
  for (const key of ['files', 'notes', 'settings']) {
    const app = BUILTINS[key];
    if (app) entries.push({ key, type: 'builtin', app });
  }
  const imported = [...state.apps.values()].sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  for (const app of imported) entries.push({ key: 'app.' + app.id, type: 'imported', app });

  entries.forEach((entry, index) => {
    const btn = document.createElement('button');
    btn.className = 'd-icon';
    btn.dataset.key = entry.key;
    btn.title = entry.type === 'imported' ? entry.app.filename : entry.app.name;
    btn.style.setProperty('--i', String(Math.min(index, 12)));
    if (animateKey && entry.key === animateKey) btn.style.animation = 'iconIn .45s var(--ease-out)';
    if (entry.type === 'builtin') {
      btn.appendChild(makeArt({ key: entry.app.id, name: entry.app.name, svg: entry.app.icon, g1: entry.app.g1, g2: entry.app.g2, size: 46, className: 'd-icon-art' }));
    } else {
      btn.appendChild(makeArt({ key: entry.app.id, name: entry.app.name, icon: entry.app.icon, size: 46, className: 'd-icon-art' }));
    }
    const label = document.createElement('span');
    label.className = 'd-icon-label';
    label.textContent = entry.app.name;
    btn.appendChild(label);

    btn.addEventListener('click', () => {
      selectIcon(entry.key, btn);
      if (window.matchMedia('(pointer: coarse)').matches) openApp(entry.key);
    });
    btn.addEventListener('dblclick', () => openApp(entry.key));
    btn.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        openApp(entry.key);
      }
    });
    btn.addEventListener('contextmenu', (event) => {
      event.preventDefault();
      event.stopPropagation();
      selectIcon(entry.key, btn);
      showIconMenu(entry, event.clientX, event.clientY);
    });
    container.appendChild(btn);
  });
  state.selectedIcon = null;
}

function selectIcon(key, el) {
  state.selectedIcon = key;
  $$('.d-icon', $('#desktop-icons')).forEach((node) => node.classList.toggle('sel', node === el));
}

function clearIconSelection() {
  state.selectedIcon = null;
  $$('.d-icon.sel', $('#desktop-icons')).forEach((node) => node.classList.remove('sel'));
}

function launchableApps() {
  const order = ['files', 'notes', 'settings', 'welcome', 'about'];
  const items = [];
  for (const key of order) {
    const app = BUILTINS[key];
    if (app) items.push({ key, type: 'builtin', app });
  }
  const imported = [...state.apps.values()].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  for (const app of imported) items.push({ key: 'app.' + app.id, type: 'imported', app });
  return items;
}

function renderStartApps(query) {
  const grid = $('#start-apps');
  if (!grid) return;
  const q = String(query || '').trim().toLowerCase();
  const items = launchableApps();
  const filtered = q
    ? items.filter((item) => {
        const haystack = (item.app.name + ' ' + (item.app.filename || '') + ' ' + (item.app.sub || '')).toLowerCase();
        return haystack.includes(q);
      })
    : items;
  grid.innerHTML = '';
  for (const item of filtered) {
    const btn = document.createElement('button');
    btn.className = 'start-app';
    btn.dataset.key = item.key;
    btn.title = item.type === 'imported' ? item.app.filename : item.app.name;
    if (item.type === 'builtin') {
      btn.appendChild(makeArt({ key: item.app.id, name: item.app.name, svg: item.app.icon, g1: item.app.g1, g2: item.app.g2, size: 36 }));
    } else {
      btn.appendChild(makeArt({ key: item.app.id, name: item.app.name, icon: item.app.icon, size: 36 }));
    }
    const txt = document.createElement('span');
    txt.className = 'txt';
    const nm = document.createElement('span');
    nm.className = 'nm';
    nm.textContent = item.app.name;
    const sb = document.createElement('span');
    sb.className = 'sb';
    sb.textContent = item.type === 'imported' ? (item.app.filename || '网页应用') : (item.app.sub || '内置应用');
    txt.append(nm, sb);
    btn.appendChild(txt);
    btn.addEventListener('click', () => {
      closeStart();
      openApp(item.key);
    });
    grid.appendChild(btn);
  }
  $('#start-empty').hidden = filtered.length > 0;
  const count = state.apps.size;
  $('#start-count').textContent = count ? count + ' 个导入应用' : '尚未导入应用';
}

function syncStartResults() {
  renderStartApps($('#start-search').value);
}

function openStart(focusSearch) {
  if (state.startOpen) return;
  if (!$('#start').classList.contains('open')) {
    renderStartApps('');
    $('#start-search').value = '';
  }
  state.startOpen = true;
  $('#start').classList.add('open');
  $('#start').setAttribute('aria-hidden', 'false');
  $('#start-btn').classList.add('active');
  $('#start-btn').setAttribute('aria-expanded', 'true');
  if (focusSearch && !window.matchMedia('(pointer: coarse)').matches) {
    setTimeout(() => $('#start-search').focus(), 120);
  }
}

function closeStart() {
  if (!state.startOpen) return;
  state.startOpen = false;
  $('#start').classList.remove('open');
  $('#start').setAttribute('aria-hidden', 'true');
  $('#start-btn').classList.remove('active');
  $('#start-btn').setAttribute('aria-expanded', 'false');
}
