<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-wallpaper="aurora" data-motion="on"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<title>幻境 OS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%237d9bff'/%3E%3Cstop offset='1' stop-color='%23b06cff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='6' fill='url(%23g)'/%3E%3Cpath d='M12 4.5 19 8.8 12 19.5 5 8.8Z' fill='none' stroke='white' stroke-width='1.2' stroke-linejoin='round'/%3E%3Cpath d='M5 8.8h14M12 4.5v15M8 8.8 12 19.5l4-10.7' fill='none' stroke='white' stroke-opacity='.7' stroke-width='.9'/%3E%3C/svg%3E">
<style>
/* ==========================================================================
   幻境 OS · 视觉层 v2
   风格：半透明玻璃 / 无拟物
   —— 不使用渐变高光、内阴影、立体投影来模拟材质；
      只用「半透明底色 + 1px 细描边 + 背景模糊 + 一处柔光」表达层级。
   所有颜色、圆角、模糊、动效均来自 --ui-* 令牌，
   皮肤文件（UI Engine）可整体覆盖，见「界面皮肤」应用内的规范。
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{color-scheme:dark;-webkit-text-size-adjust:100%}
[data-theme="light"]{color-scheme:light}

:root{
  /* —— 强调色（设置面板写入，皮肤可覆盖 --ui-accent 接管） —— */
  --accent:#7c8cff;
  --accent-rgb:124,140,255;
  --ui-accent:var(--accent);
  --ui-accent-rgb:var(--accent-rgb);

  /* —— 底层与表面 —— */
  --ui-bg:#070910;
  --ui-surface:rgba(20,25,35,.44);
  --ui-surface-2:rgba(24,29,40,.68);
  --ui-surface-3:rgba(30,36,48,.82);
  --ui-body:rgba(9,12,19,.62);
  --ui-elev:rgba(255,255,255,.05);
  --ui-elev-2:rgba(255,255,255,.10);
  --ui-border:rgba(255,255,255,.10);
  --ui-border-soft:rgba(255,255,255,.06);
  --ui-track:rgba(255,255,255,.10);
  --tile-bg-a:.20;
  --tile-border-a:.22;
  --tile-ink-l:78%;
  --label-bg:rgba(6,9,15,.30);
  --label-ink:#e9edf5;

  /* —— 文字 —— */
  --ui-text:#e9edf5;
  --ui-dim:#98a2b5;
  --ui-dim-2:#6f798b;
  --ui-ink:#ffffff;

  /* —— 形状 —— */
  --ui-radius:14px;
  --ui-radius-sm:9px;
  --ui-radius-lg:18px;
  --ui-blur:28px;
  --ui-blur-lg:40px;
  --ui-shadow:0 26px 70px -30px rgba(0,0,0,.78);
  --ui-shadow-sm:0 2px 10px -6px rgba(0,0,0,.45);
  --ui-scrim:rgba(5,7,12,.52);

  /* —— 排版与动效 —— */
  --ui-font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
  --ui-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --ui-ease:cubic-bezier(.2,.8,.2,1);
  --ui-dur:.18s;
  --ui-taskbar-h:56px;

  /* —— 状态色 —— */
  --danger:#ff6b6f;
  --ok:#48d597;
  --warn:#f2b34c;

  /* —— 兼容旧令牌（皮肤可继续使用旧变量名） —— */
  --taskbar-h:var(--ui-taskbar-h);
  --text:var(--ui-text);
  --muted:var(--ui-dim);
  --muted-2:var(--ui-dim-2);
  --glass:var(--ui-surface);
  --glass-2:var(--ui-surface-2);
  --glass-3:var(--ui-surface-3);
  --stroke:var(--ui-border);
  --stroke-2:var(--ui-border-soft);
  --hover:var(--ui-elev);
  --active:var(--ui-elev-2);
  --bg-elev:var(--ui-elev);
  --panel-1:var(--ui-surface);
  --panel-2:var(--ui-surface);
  --window-bg:var(--ui-body);
  --radius:var(--ui-radius);
  --shadow-win:var(--ui-shadow);
  --ease:var(--ui-ease);
  --ease-out:var(--ui-ease);
}

[data-theme="light"]{
  --ui-bg:#e9edf4;
  --ui-surface:rgba(255,255,255,.68);
  --ui-surface-2:rgba(255,255,255,.82);
  --ui-surface-3:rgba(255,255,255,.90);
  --ui-body:rgba(255,255,255,.78);
  --ui-elev:rgba(16,24,40,.045);
  --ui-elev-2:rgba(16,24,40,.09);
  --ui-border:rgba(16,24,40,.11);
  --ui-border-soft:rgba(16,24,40,.07);
  --ui-track:rgba(16,24,40,.12);
  --tile-bg-a:.12;
  --tile-border-a:.14;
  --tile-ink-l:36%;
  --label-bg:rgba(255,255,255,.55);
  --label-ink:#101725;
  --ui-text:#101725;
  --ui-dim:#5b6679;
  --ui-dim-2:#7c8698;
  --ui-ink:#ffffff;
  --ui-shadow:0 26px 60px -30px rgba(23,34,66,.35);
  --ui-shadow-sm:0 2px 10px -6px rgba(23,34,66,.25);
  --ui-scrim:rgba(12,18,30,.30);
}

body{
  margin:0;
  font-family:var(--ui-font);
  background:var(--ui-bg);
  color:var(--ui-text);
  overflow:hidden;
  overscroll-behavior:none;
  user-select:none;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit;user-select:text}
img{display:block;max-width:100%}
h1,h2,h3,h4,p{margin:0}
a{color:var(--ui-accent);text-decoration:none}
svg{display:block}
[hidden]{display:none!important}
:focus{outline:none}
:focus-visible{outline:2px solid rgba(var(--ui-accent-rgb),.72);outline-offset:2px}
::selection{background:rgba(var(--ui-accent-rgb),.28)}
*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.16) transparent}
[data-theme="light"] *{scrollbar-color:rgba(16,24,40,.2) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:99px;border:3px solid transparent;background-clip:content-box}
[data-theme="light"] ::-webkit-scrollbar-thumb{background:rgba(16,24,40,.18);border:3px solid transparent;background-clip:content-box}
body.is-dragging,body.is-dragging *{cursor:grabbing!important}
body.is-resizing,body.is-resizing *{cursor:default!important}

/* ============================ 启动 ============================ */
#boot{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:var(--ui-bg);transition:opacity .55s ease,visibility .55s ease}
#boot::before{content:"";position:absolute;inset:0;background:radial-gradient(58% 46% at 50% 42%,rgba(var(--ui-accent-rgb),.16),transparent 72%);pointer-events:none}
#boot.done{opacity:0;visibility:hidden;pointer-events:none}
.boot-inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px;transform:translateY(-2vh)}
.boot-logo{width:72px;height:72px;border-radius:22px;display:grid;place-items:center;color:var(--ui-text);background:var(--ui-elev);border:1px solid var(--ui-border);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);animation:logoIn .7s var(--ui-ease) both}
.boot-name{font-size:23px;letter-spacing:.32em;text-indent:.32em;font-weight:500}
.boot-sub{font-size:10px;color:var(--ui-dim-2);letter-spacing:.34em;text-indent:.34em;margin-top:-12px}
.boot-track{width:196px;height:2px;border-radius:99px;background:var(--ui-track);overflow:hidden;margin-top:12px}
.boot-fill{height:100%;width:0;border-radius:99px;background:var(--ui-accent);transition:width .5s var(--ui-ease)}
.boot-tip{font-size:11px;color:var(--ui-dim-2);letter-spacing:.04em}
@keyframes logoIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}

/* ============================ 壁纸 ============================ */
#wallpaper{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--ui-bg)}
#wallpaper .w-blob{position:absolute;border-radius:50%;filter:blur(96px);opacity:.34;will-change:transform;transform:translateZ(0);pointer-events:none}
#wp-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;display:none}
[data-wallpaper="custom"] #wp-image{display:block}
[data-wallpaper="custom"] .w-blob{display:none}
.w-grid{position:absolute;inset:0;opacity:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:46px 46px;mask-image:radial-gradient(120% 120% at 50% 40%,#000 30%,transparent 78%);-webkit-mask-image:radial-gradient(120% 120% at 50% 40%,#000 30%,transparent 78%)}
.w-stars{position:absolute;inset:0;opacity:0;background-image:radial-gradient(1px 1px at 18% 24%,rgba(255,255,255,.85) 50%,transparent 51%),radial-gradient(1px 1px at 62% 12%,rgba(255,255,255,.7) 50%,transparent 51%),radial-gradient(1.4px 1.4px at 84% 38%,rgba(255,255,255,.9) 50%,transparent 51%),radial-gradient(1px 1px at 34% 62%,rgba(255,255,255,.55) 50%,transparent 51%),radial-gradient(1.2px 1.2px at 74% 72%,rgba(255,255,255,.75) 50%,transparent 51%),radial-gradient(1px 1px at 12% 82%,rgba(255,255,255,.5) 50%,transparent 51%),radial-gradient(1px 1px at 48% 40%,rgba(255,255,255,.4) 50%,transparent 51%),radial-gradient(1px 1px at 92% 84%,rgba(255,255,255,.55) 50%,transparent 51%);background-size:520px 520px,640px 640px,720px 720px,460px 460px,580px 580px,620px 620px,540px 540px,760px 760px}
.w-vignette{position:absolute;inset:0;z-index:2;background:radial-gradient(130% 120% at 50% 16%,transparent 48%,rgba(0,0,0,.34) 100%);pointer-events:none}
[data-theme="light"] .w-vignette{background:radial-gradient(130% 120% at 50% 16%,transparent 58%,rgba(24,34,56,.14) 100%)}

[data-wallpaper="aurora"] #wallpaper{background:radial-gradient(120% 110% at 14% -4%,#142752 0%,#0a1020 56%,#05070c 100%)}
[data-wallpaper="aurora"] .b1{width:56vmax;height:56vmax;left:-15vmax;top:-20vmax;background:radial-gradient(circle,#2f6bff,transparent 64%);opacity:.55;animation:drift1 28s ease-in-out infinite alternate}
[data-wallpaper="aurora"] .b2{width:44vmax;height:44vmax;right:-10vmax;top:6vmax;background:radial-gradient(circle,#00c9c0,transparent 64%);opacity:.34;animation:drift2 33s ease-in-out infinite alternate}
[data-wallpaper="aurora"] .b3{width:52vmax;height:52vmax;left:18vmax;bottom:-26vmax;background:radial-gradient(circle,#8b5cf6,transparent 66%);opacity:.42;animation:drift3 38s ease-in-out infinite alternate}

[data-wallpaper="dusk"] #wallpaper{background:linear-gradient(158deg,#1b0d2e 0%,#380f3a 48%,#0a0714 100%)}
[data-wallpaper="dusk"] .b1{width:52vmax;height:52vmax;left:-10vmax;top:-16vmax;background:radial-gradient(circle,#ff7a45,transparent 62%);opacity:.30;animation:drift2 30s ease-in-out infinite alternate}
[data-wallpaper="dusk"] .b2{width:44vmax;height:44vmax;right:-8vmax;top:18vmax;background:radial-gradient(circle,#ff3d7f,transparent 64%);opacity:.26;animation:drift1 36s ease-in-out infinite alternate}
[data-wallpaper="dusk"] .b3{width:48vmax;height:48vmax;left:24vmax;bottom:-22vmax;background:radial-gradient(circle,#7b5cff,transparent 66%);opacity:.28;animation:drift3 42s ease-in-out infinite alternate}

[data-wallpaper="ocean"] #wallpaper{background:linear-gradient(180deg,#04131f 0%,#072b33 58%,#04121a 100%)}
[data-wallpaper="ocean"] .b1{width:54vmax;height:54vmax;left:-12vmax;top:-18vmax;background:radial-gradient(circle,#00b8d4,transparent 64%);opacity:.26;animation:drift3 34s ease-in-out infinite alternate}
[data-wallpaper="ocean"] .b2{width:46vmax;height:46vmax;right:-10vmax;bottom:-12vmax;background:radial-gradient(circle,#14e0a0,transparent 64%);opacity:.20;animation:drift1 29s ease-in-out infinite alternate}
[data-wallpaper="ocean"] .b3{width:40vmax;height:40vmax;left:30vmax;top:20vmax;background:radial-gradient(circle,#2f6bff,transparent 66%);opacity:.18;animation:drift2 40s ease-in-out infinite alternate}

[data-wallpaper="nebula"] #wallpaper{background:radial-gradient(120% 120% at 70% 0%,#180c2e 0%,#080614 55%,#040309 100%)}
[data-wallpaper="nebula"] .b1{width:54vmax;height:54vmax;left:-10vmax;top:-14vmax;background:radial-gradient(circle,#5b21b6,transparent 64%);opacity:.30;animation:drift1 32s ease-in-out infinite alternate}
[data-wallpaper="nebula"] .b2{width:44vmax;height:44vmax;right:-12vmax;bottom:-14vmax;background:radial-gradient(circle,#1d4ed8,transparent 66%);opacity:.24;animation:drift2 37s ease-in-out infinite alternate}
[data-wallpaper="nebula"] .w-stars{opacity:.85}

[data-wallpaper="mono"] #wallpaper{background:#0a0c11}
[data-wallpaper="mono"] .b1{width:60vmax;height:60vmax;left:50%;top:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,#242b3a,transparent 68%);opacity:.6;animation:none}
[data-wallpaper="mono"] .w-grid{opacity:.45}
[data-wallpaper="mono"] .w-blob.b2,[data-wallpaper="mono"] .w-blob.b3{display:none}

@keyframes drift1{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(6vmax,4vmax,0) scale(1.08)}}
@keyframes drift2{from{transform:translate3d(0,0,0) scale(1.04)}to{transform:translate3d(-5vmax,5vmax,0) scale(.96)}}
@keyframes drift3{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(4vmax,-6vmax,0) scale(1.1)}}
[data-motion="off"] .w-blob{animation:none!important}
[data-motion="off"] *{scroll-behavior:auto}

/* ============================ 桌面 ============================ */
#desktop{position:fixed;inset:0 0 var(--ui-taskbar-h) 0;z-index:1}
#desktop-icons{display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;height:100%;padding:16px 14px;gap:4px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
#desktop-icons::-webkit-scrollbar{display:none}
.d-icon{width:92px;height:108px;flex:0 0 auto;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 4px 7px;transition:background var(--ui-dur),border-color var(--ui-dur);color:var(--ui-text);position:relative;border:1px solid transparent}
.d-icon:hover{background:var(--ui-elev);border-color:var(--ui-border-soft)}
.d-icon.sel{background:rgba(var(--ui-accent-rgb),.13);border-color:rgba(var(--ui-accent-rgb),.32)}
.d-icon-art{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;overflow:hidden;position:relative;flex-shrink:0;background:hsl(var(--h,232) 72% 60% / var(--tile-bg-a));border:1px solid hsl(var(--h,232) 72% 72% / var(--tile-border-a));color:hsl(var(--h,232) 82% var(--tile-ink-l))}
.d-icon-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit}
.d-icon-art svg{width:23px;height:23px}
.d-icon-art .letter{font-size:19px;font-weight:600;line-height:1;color:inherit}
.d-icon-label{max-width:100%;flex:0 0 auto;font-size:12px;line-height:1.5;text-align:center;padding:1px 5px;border-radius:6px;background:var(--label-bg);color:var(--label-ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;word-break:normal;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.icons-live .d-icon{animation:iconIn .4s var(--ui-ease) both;animation-delay:calc(var(--i,0)*22ms)}
@keyframes iconIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ============================ 窗口 ============================ */
#windows{position:fixed;inset:0;z-index:20;pointer-events:none}
.win{position:fixed;pointer-events:auto;display:flex;flex-direction:column;background:var(--ui-surface);border:1px solid var(--ui-border);border-radius:var(--ui-radius-lg);box-shadow:var(--ui-shadow);overflow:hidden;transform-origin:50% 50%;backdrop-filter:blur(var(--ui-blur)) saturate(140%);-webkit-backdrop-filter:blur(var(--ui-blur)) saturate(140%)}
.win.active{border-color:rgba(var(--ui-accent-rgb),.30);box-shadow:var(--ui-shadow),0 0 0 1px rgba(var(--ui-accent-rgb),.12)}
.win.opening{animation:winIn .26s var(--ui-ease)}
.win.closing{animation:winOut .16s ease-out forwards}
.win.anim{transition:left .3s var(--ui-ease),top .3s var(--ui-ease),width .3s var(--ui-ease),height .3s var(--ui-ease)}
.win.max{border-radius:var(--ui-radius)}
.win-titlebar{height:42px;display:flex;align-items:center;padding:0 8px 0 12px;gap:10px;flex-shrink:0;background:transparent;border-bottom:1px solid var(--ui-border-soft);cursor:grab;touch-action:none}
.win.dragging .win-titlebar{cursor:grabbing}
.win-title{display:flex;align-items:center;gap:8px;min-width:0;flex:1;font-size:12.5px;font-weight:500;color:var(--ui-text)}
.win-title .t-art{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;overflow:hidden;flex-shrink:0;position:relative;background:hsl(var(--h,232) 72% 60% / var(--tile-bg-a));border:1px solid hsl(var(--h,232) 72% 72% / var(--tile-border-a));color:hsl(var(--h,232) 82% var(--tile-ink-l))}
.win-title .t-art svg{width:11px;height:11px}
.win-title .t-art .letter{font-size:9px;font-weight:600;line-height:1;color:inherit}
.win-title .t-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.win-title .t-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win-controls{display:flex;gap:2px;align-items:center;flex-shrink:0}
.win-btn{width:34px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--ui-dim);transition:background var(--ui-dur),color var(--ui-dur)}
.win-btn:hover{background:var(--ui-elev-2);color:var(--ui-text)}
.win-btn.close:hover{background:rgba(255,107,111,.18);color:#ffb3b5}
.win-body{position:relative;flex:1;min-height:0;background:var(--ui-body);display:flex;flex-direction:column}
.win-body>.app{flex:1;min-height:0}
.win-body iframe{width:100%;height:100%;border:0;display:block;background:#fff;flex:1}
.win-loader{position:absolute;inset:0;display:grid;place-items:center;background:var(--ui-body);z-index:3;transition:opacity .25s;pointer-events:none}
.win-loader.hide{opacity:0}
.spinner{width:24px;height:24px;border-radius:50%;border:2px solid var(--ui-track);border-top-color:var(--ui-accent);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes winIn{from{opacity:0;transform:scale(.98) translateY(8px)}to{opacity:1;transform:none}}
@keyframes winOut{to{opacity:0;transform:scale(.985) translateY(4px)}}
.rz{position:absolute;z-index:6;touch-action:none}
.rz[data-dir="n"]{top:0;left:12px;right:12px;height:6px;cursor:ns-resize}
.rz[data-dir="s"]{bottom:0;left:12px;right:12px;height:6px;cursor:ns-resize}
.rz[data-dir="e"]{right:0;top:12px;bottom:12px;width:6px;cursor:ew-resize}
.rz[data-dir="w"]{left:0;top:12px;bottom:12px;width:6px;cursor:ew-resize}
.rz[data-dir="ne"]{top:0;right:0;width:14px;height:14px;cursor:nesw-resize}
.rz[data-dir="nw"]{top:0;left:0;width:14px;height:14px;cursor:nwse-resize}
.rz[data-dir="se"]{bottom:0;right:0;width:14px;height:14px;cursor:nwse-resize}
.rz[data-dir="sw"]{bottom:0;left:0;width:14px;height:14px;cursor:nesw-resize}

#drag-shield{position:fixed;inset:0;z-index:55;display:none;cursor:grabbing}
#drag-shield.on{display:block}
#snap-preview{position:fixed;z-index:40;border-radius:var(--ui-radius);border:1px solid rgba(var(--ui-accent-rgb),.55);background:rgba(var(--ui-accent-rgb),.08);opacity:0;pointer-events:none;transition:opacity .14s,left .16s var(--ui-ease),top .16s var(--ui-ease),width .16s var(--ui-ease),height .16s var(--ui-ease)}
#snap-preview.show{opacity:1}

/* ============================ 任务栏 ============================ */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--ui-taskbar-h);z-index:60;display:flex;align-items:center;padding:0 10px;background:var(--ui-surface);border-top:1px solid var(--ui-border);backdrop-filter:blur(var(--ui-blur-lg)) saturate(150%);-webkit-backdrop-filter:blur(var(--ui-blur-lg)) saturate(150%)}
#tb-center{position:absolute;left:50%;bottom:0;height:100%;transform:translateX(-50%);display:flex;align-items:center;gap:5px;max-width:calc(100vw - 280px)}
#tb-tasks{display:flex;align-items:center;gap:5px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;max-width:100%}
#tb-tasks::-webkit-scrollbar{display:none}
.tb-btn{position:relative;width:42px;height:42px;border-radius:11px;display:grid;place-items:center;transition:background var(--ui-dur),transform .12s;flex-shrink:0}
.tb-btn:hover{background:var(--ui-elev)}

.tb-btn .tb-glyph{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;overflow:hidden;position:relative;background:hsl(var(--h,232) 72% 60% / var(--tile-bg-a));border:1px solid hsl(var(--h,232) 72% 72% / var(--tile-border-a));color:hsl(var(--h,232) 82% var(--tile-ink-l))}

.tb-btn.running::after{content:"";position:absolute;left:50%;bottom:2px;width:6px;height:2px;border-radius:2px;background:var(--ui-dim-2);transform:translateX(-50%);transition:width var(--ui-dur),background var(--ui-dur)}
.tb-btn.active::after{width:16px;background:var(--ui-accent)}
.tb-btn.active{background:var(--ui-elev-2)}
#start-btn{width:44px;height:44px}
#start-btn .tb-glyph{width:30px;height:30px;border-radius:9px;background:rgba(var(--ui-accent-rgb),.14);border:1px solid rgba(var(--ui-accent-rgb),.26);color:var(--ui-text)}
#start-btn:hover .tb-glyph{background:rgba(var(--ui-accent-rgb),.22)}
#start-btn.active{background:var(--ui-elev)}
#tb-tray{position:absolute;right:6px;bottom:0;height:100%;display:flex;align-items:center;gap:2px}
.tb-status{display:flex;align-items:center;gap:1px;color:var(--ui-dim);padding-right:2px}
.tb-tray-btn{width:30px;height:34px;border-radius:8px;display:grid;place-items:center;transition:background var(--ui-dur),color var(--ui-dur)}
.tb-tray-btn:hover{background:var(--ui-elev);color:var(--ui-text)}
#tb-clock{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;line-height:1.15;height:38px;padding:0 9px;border-radius:8px;color:var(--ui-text);font-variant-numeric:tabular-nums;transition:background var(--ui-dur)}
#tb-clock:hover{background:var(--ui-elev)}
#tb-clock .t{font-size:12.5px;font-weight:500}
#tb-clock .d{font-size:10.5px;color:var(--ui-dim);margin-top:1px}
#tb-showdesk{width:6px;height:100%;border-left:1px solid var(--ui-border-soft);margin-left:4px;transition:background var(--ui-dur)}
#tb-showdesk:hover{background:var(--ui-elev)}

/* ============================ 开始菜单 ============================ */
#start{position:fixed;z-index:70;left:50%;bottom:calc(var(--ui-taskbar-h) + 10px);width:min(680px,calc(100vw - 20px));max-height:min(660px,calc(100vh - var(--ui-taskbar-h) - 30px));display:flex;flex-direction:column;background:var(--ui-surface-2);border:1px solid var(--ui-border);border-radius:var(--ui-radius-lg);box-shadow:var(--ui-shadow);backdrop-filter:blur(var(--ui-blur-lg)) saturate(160%);-webkit-backdrop-filter:blur(var(--ui-blur-lg)) saturate(160%);transform:translate(-50%,12px) scale(.99);opacity:0;pointer-events:none;transition:opacity .16s,transform .2s var(--ui-ease);overflow:hidden}
#start.open{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
.start-head{padding:18px 20px 8px;display:flex;flex-direction:column;gap:10px}
.start-search{display:flex;align-items:center;gap:9px;height:41px;border-radius:var(--ui-radius-sm);border:1px solid var(--ui-border);background:var(--ui-elev);padding:0 7px 0 12px;transition:border-color var(--ui-dur),box-shadow var(--ui-dur)}
.start-search:focus-within{border-color:rgba(var(--ui-accent-rgb),.55);box-shadow:0 0 0 3px rgba(var(--ui-accent-rgb),.12)}
.start-search svg{color:var(--ui-dim);flex-shrink:0}
.start-search input{flex:1;border:0;background:none;outline:none;font-size:13.5px;color:var(--ui-text);min-width:0}
.start-search input::placeholder{color:var(--ui-dim-2)}
.start-search .icon-btn{width:30px;height:28px}
.start-body{overflow:auto;padding:2px 14px 14px;flex:1;min-height:0}
.start-label{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--ui-dim);letter-spacing:.04em;padding:8px 8px 6px}
.start-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:3px}
.start-app{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;text-align:left;position:relative;transition:background var(--ui-dur);min-width:0;border:1px solid transparent}
.start-app:hover{background:var(--ui-elev);border-color:var(--ui-border-soft)}
.start-app:active{transform:scale(.99)}
.start-app .art{width:36px;height:36px;border-radius:10px;flex-shrink:0;display:grid;place-items:center;overflow:hidden;position:relative;background:hsl(var(--h,232) 72% 60% / var(--tile-bg-a));border:1px solid hsl(var(--h,232) 72% 72% / var(--tile-border-a));color:hsl(var(--h,232) 82% var(--tile-ink-l))}
.start-app .art svg{width:18px;height:18px}
.start-app .art .letter{font-size:15px;font-weight:600;line-height:1;color:inherit}
.start-app .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.start-app .txt{min-width:0;display:block}
.start-app .nm{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.start-app .sb{display:block;font-size:10.5px;color:var(--ui-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.start-empty{padding:34px 12px;text-align:center;color:var(--ui-dim);font-size:12.5px;line-height:1.7}
.start-empty b{color:var(--ui-text);display:block;margin-bottom:4px;font-size:13px}
.start-foot{display:flex;align-items:center;gap:6px;padding:10px 14px;border-top:1px solid var(--ui-border-soft);background:var(--ui-elev)}
.start-user{display:flex;align-items:center;gap:9px;margin-right:auto;padding:4px 6px;border-radius:8px}
.start-user .av{width:29px;height:29px;border-radius:50%;background:rgba(var(--ui-accent-rgb),.16);border:1px solid rgba(var(--ui-accent-rgb),.28);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--ui-text)}
.start-user .nm{font-size:12px;line-height:1.2}
.start-user .st{font-size:10px;color:var(--ui-dim);margin-top:1px}
.fbtn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ui-dim);transition:background var(--ui-dur),color var(--ui-dur)}
.fbtn:hover{background:var(--ui-elev-2);color:var(--ui-text)}

/* ============================ 右键菜单 ============================ */
#ctx{position:fixed;z-index:90;min-width:206px;padding:5px;border-radius:var(--ui-radius);background:var(--ui-surface-3);border:1px solid var(--ui-border);box-shadow:var(--ui-shadow);backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);opacity:0;pointer-events:none;transform:scale(.97);transform-origin:top left;transition:opacity .12s,transform .12s var(--ui-ease)}
#ctx.open{opacity:1;pointer-events:auto;transform:none}
.ctx-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;font-size:12.5px;color:var(--ui-text);text-align:left;transition:background .1s}
.ctx-item:hover{background:var(--ui-elev-2)}
.ctx-item .ci{color:var(--ui-dim);flex-shrink:0;display:grid;place-items:center;width:16px}
.ctx-item.danger{color:#ff9a9d}
.ctx-item.danger .ci{color:#ff9a9d}
.ctx-item.danger:hover{background:rgba(255,107,111,.12)}
.ctx-sep{height:1px;background:var(--ui-border-soft);margin:5px 8px}

/* ============================ 弹窗 ============================ */
#modal-layer{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--ui-scrim);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity var(--ui-dur);padding:16px}
#modal-layer.open{opacity:1;pointer-events:auto}
.dialog{width:min(440px,94vw);background:var(--ui-surface-3);border:1px solid var(--ui-border);border-radius:var(--ui-radius-lg);padding:20px;box-shadow:var(--ui-shadow);transform:translateY(8px);transition:transform .2s var(--ui-ease)}
#modal-layer.open .dialog{transform:none}
.dialog h3{font-size:15px;font-weight:600;margin-bottom:7px}
.dialog p{font-size:12.5px;line-height:1.65;color:var(--ui-dim);white-space:pre-wrap;word-break:break-word;margin-bottom:16px}
.dialog input{width:100%;height:38px;border-radius:var(--ui-radius-sm);border:1px solid var(--ui-border);background:var(--ui-elev);padding:0 11px;outline:none;font-size:13px;margin-bottom:16px;transition:border-color var(--ui-dur),box-shadow var(--ui-dur)}
.dialog input:focus{border-color:rgba(var(--ui-accent-rgb),.55);box-shadow:0 0 0 3px rgba(var(--ui-accent-rgb),.12)}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px}

/* ============================ 按钮 ============================ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 13px;border-radius:var(--ui-radius-sm);font-size:12.5px;font-weight:500;border:1px solid var(--ui-border);background:var(--ui-elev);color:var(--ui-text);transition:background var(--ui-dur),border-color var(--ui-dur),filter var(--ui-dur),transform .1s;white-space:nowrap}
.btn:hover{background:var(--ui-elev-2)}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--ui-accent);border-color:transparent;color:var(--ui-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08);background:var(--ui-accent)}
.btn.ghost{background:transparent}
.btn.danger{color:#ff9a9d;border-color:rgba(255,107,111,.32);background:rgba(255,107,111,.08)}
.btn.danger:hover{background:rgba(255,107,111,.15)}
.btn.sm{height:28px;padding:0 9px;font-size:11.5px;border-radius:7px}
.btn[disabled]{opacity:.45;pointer-events:none}

.icon-btn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ui-dim);transition:background var(--ui-dur),color var(--ui-dur);flex-shrink:0}
.icon-btn:hover{background:var(--ui-elev-2);color:var(--ui-text)}
.icon-btn.danger:hover{background:rgba(255,107,111,.14);color:#ff9a9d}

/* ============================ 通知 ============================ */
#toasts{position:fixed;right:16px;bottom:calc(var(--ui-taskbar-h) + 14px);z-index:110;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;min-width:250px;max-width:min(390px,92vw);padding:11px 12px;border-radius:12px;background:var(--ui-surface-3);border:1px solid var(--ui-border);box-shadow:var(--ui-shadow-sm);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);font-size:12px;pointer-events:auto;animation:toastIn .26s var(--ui-ease)}
.toast .t-ic{width:27px;height:27px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;background:rgba(var(--ui-accent-rgb),.13);color:var(--ui-accent)}
.toast.success .t-ic{background:rgba(72,213,151,.12);color:var(--ok)}
.toast.error .t-ic{background:rgba(255,107,111,.12);color:#ff9a9d}
.toast.warn .t-ic{background:rgba(242,179,76,.12);color:var(--warn)}
.toast .t-msg{flex:1;line-height:1.45;word-break:break-word}
.toast .t-act{font-size:11.5px;font-weight:600;color:var(--ui-accent);padding:4px 7px;border-radius:6px;white-space:nowrap}
.toast .t-act:hover{background:var(--ui-elev-2)}
.toast.out{animation:toastOut .22s forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(6px)}}

/* ============================ 拖放 ============================ */
#dropzone{position:fixed;inset:10px;z-index:95;border-radius:var(--ui-radius-lg);border:1px dashed rgba(var(--ui-accent-rgb),.55);background:rgba(6,10,20,.42);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity var(--ui-dur);color:#fff}
#dropzone.show{opacity:1}
.drop-inner{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;padding:20px}
.drop-inner .dic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:rgba(var(--ui-accent-rgb),.16);border:1px solid rgba(var(--ui-accent-rgb),.32);margin-bottom:7px;color:#fff}
.drop-inner b{font-size:15px}
.drop-inner span{font-size:12px;color:rgba(255,255,255,.7)}

/* ============================ 应用容器 ============================ */
.app{height:100%;overflow:auto;font-size:13px;color:var(--ui-text)}

/* ---- 应用库 ---- */
.files{height:100%;display:flex;flex-direction:column}
.files-head{padding:22px 24px 14px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;flex-shrink:0}
.files-head h2{font-size:19px;font-weight:600;letter-spacing:-.01em}
.files-head .sub{font-size:11.5px;color:var(--ui-dim);margin-top:4px}
.files-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.files-search{display:flex;align-items:center;gap:7px;height:34px;padding:0 10px;border:1px solid var(--ui-border);border-radius:var(--ui-radius-sm);background:var(--ui-elev);min-width:180px;transition:border-color var(--ui-dur),box-shadow var(--ui-dur)}
.files-search:focus-within{border-color:rgba(var(--ui-accent-rgb),.5);box-shadow:0 0 0 3px rgba(var(--ui-accent-rgb),.1)}

.files-list{flex:1;overflow:auto;padding:4px 14px 18px;min-height:0}
.file-row{display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px;border:1px solid transparent;transition:background var(--ui-dur),border-color var(--ui-dur);cursor:default}
.file-row:hover{background:var(--ui-elev);border-color:var(--ui-border-soft)}
.file-row .art{width:40px;height:40px;border-radius:11px;flex-shrink:0;display:grid;place-items:center;overflow:hidden;position:relative;background:hsl(var(--h,232) 72% 60% / var(--tile-bg-a));border:1px solid hsl(var(--h,232) 72% 72% / var(--tile-border-a));color:hsl(var(--h,232) 82% var(--tile-ink-l))}
.file-row .art svg{width:19px;height:19px}
.file-row .art .letter{font-size:16px;font-weight:600;line-height:1;color:inherit}
.file-row .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.file-row .meta{flex:1;min-width:0}
.file-row .nm{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-row .sub{font-size:11px;color:var(--ui-dim);margin-top:3px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.file-row .sub i{font-style:normal;opacity:.45}
.file-row .row-actions{display:flex;gap:2px;opacity:.45;transition:opacity .14s;flex-shrink:0}
.file-row:hover .row-actions{opacity:1}
.files-empty{padding:46px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--ui-dim);text-align:center}
.files-empty .art{width:60px;height:60px;border-radius:16px;display:grid;place-items:center;background:var(--ui-elev);border:1px solid var(--ui-border);margin-bottom:4px}
.files-empty b{color:var(--ui-text);font-size:14px}
.files-empty p{font-size:12px;line-height:1.7;max-width:360px}
.files-empty .btn{margin-top:8px}

/* ---- 设置 ---- */
.settings{height:100%;overflow:auto;padding:24px 26px 40px;display:flex;flex-direction:column;gap:24px;max-width:860px;margin:0 auto;width:100%}
.set-sec{display:flex;flex-direction:column;gap:10px}
.set-title{font-size:13px;font-weight:600;letter-spacing:.01em}
.set-desc{font-size:11.5px;color:var(--ui-dim);margin-top:3px;line-height:1.6}
.set-card{background:var(--ui-elev);border:1px solid var(--ui-border-soft);border-radius:12px;padding:14px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--ui-border-soft)}
.set-row:first-child{padding-top:0}
.set-row:last-child{border-bottom:0;padding-bottom:0}
.set-row .lab{font-size:12.5px;line-height:1.4}
.set-row .hint{font-size:11px;color:var(--ui-dim);margin-top:2px;line-height:1.5}
.seg{display:flex;background:var(--ui-elev);border:1px solid var(--ui-border);border-radius:var(--ui-radius-sm);padding:2px;gap:2px;flex-shrink:0}
.seg button{height:28px;padding:0 11px;border-radius:7px;font-size:11.5px;color:var(--ui-dim);transition:background var(--ui-dur),color var(--ui-dur)}
.seg button.on{background:var(--ui-elev-2);color:var(--ui-text)}
.wp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.wp-opt{position:relative;height:66px;border-radius:10px;border:1px solid var(--ui-border);overflow:hidden;transition:border-color var(--ui-dur),box-shadow var(--ui-dur);background:#0b1020;cursor:pointer}
.wp-opt .wp-name{position:absolute;left:6px;bottom:5px;font-size:10px;color:#fff;background:rgba(0,0,0,.4);padding:1px 6px;border-radius:4px;backdrop-filter:blur(4px)}
.wp-opt.on{border-color:rgba(var(--ui-accent-rgb),.7);box-shadow:0 0 0 2px rgba(var(--ui-accent-rgb),.18)}
.wp-opt.aurora{background:radial-gradient(circle at 30% 26%,#2d6bff,transparent 58%),radial-gradient(circle at 76% 70%,#00d4c8,transparent 55%),radial-gradient(circle at 60% 20%,#8b5cf6,transparent 50%),#070b16}
.wp-opt.dusk{background:radial-gradient(circle at 24% 24%,#ff7a45,transparent 58%),radial-gradient(circle at 76% 66%,#ff3d7f,transparent 55%),linear-gradient(150deg,#1a0b2e,#3b0d3a 60%,#0a0714)}
.wp-opt.ocean{background:radial-gradient(circle at 28% 24%,#00b8d4,transparent 58%),radial-gradient(circle at 78% 76%,#14e0a0,transparent 55%),linear-gradient(160deg,#03121f,#062b33)}
.wp-opt.nebula{background:radial-gradient(circle at 32% 30%,#5b21b6,transparent 60%),radial-gradient(circle at 72% 70%,#1d4ed8,transparent 58%),#05040d}
.wp-opt.mono{background:linear-gradient(150deg,#161b24,#0a0c11);background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:12px 12px}
.wp-opt.custom{background:linear-gradient(140deg,#334155,#0f172a)}
.dots{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dot{width:24px;height:24px;border-radius:50%;border:2px solid transparent;transition:transform .12s,box-shadow .12s;position:relative}
.dot:hover{transform:scale(1.08)}
.dot.on{border-color:rgba(255,255,255,.85);box-shadow:0 0 0 2px rgba(var(--ui-accent-rgb),.45)}
[data-theme="light"] .dot.on{border-color:rgba(16,24,40,.6)}
.toggle{width:40px;height:23px;border-radius:99px;background:var(--ui-track);position:relative;transition:background var(--ui-dur);flex-shrink:0;cursor:pointer}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:transform var(--ui-dur) var(--ui-ease);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.toggle.on{background:var(--ui-accent)}
.toggle.on::after{transform:translateX(17px)}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--ui-elev);border:1px solid var(--ui-border-soft);border-radius:10px;padding:12px}
.stat b{display:block;font-size:18px;font-weight:600;line-height:1.2;word-break:break-all}
.stat span{font-size:10.5px;color:var(--ui-dim);display:block;margin-top:3px}

/* ---- 备忘录 ---- */
.notes{height:100%;display:flex;flex-direction:column;background:transparent}
.notes-top{display:flex;align-items:center;gap:10px;padding:14px 18px 4px;flex-shrink:0}
.note-title{flex:1;border:0;background:none;outline:none;font-size:16px;font-weight:600;color:var(--ui-text);padding:6px 0}
.note-title::placeholder{color:var(--ui-dim-2)}
.note-body{flex:1;resize:none;border:0;outline:none;background:none;padding:8px 20px 18px;font-size:13px;line-height:1.8;color:var(--ui-text);min-height:0}
.note-body::placeholder{color:var(--ui-dim-2)}
.note-foot{padding:8px 18px;border-top:1px solid var(--ui-border-soft);font-size:10.5px;color:var(--ui-dim);display:flex;justify-content:space-between;gap:10px;flex-shrink:0}

/* ---- 欢迎 / 关于 ---- */
.welcome{height:100%;overflow:auto;padding:34px 32px 30px;position:relative;background:radial-gradient(100% 80% at 0% 0%,rgba(var(--ui-accent-rgb),.10),transparent 62%)}
.welcome .mark{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:var(--ui-elev);border:1px solid var(--ui-border);color:var(--ui-text)}
.welcome h1{font-size:26px;margin:18px 0 9px;letter-spacing:-.02em;line-height:1.25}

.welcome .cta{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 26px}

.about .hero{display:flex;align-items:center;gap:16px}
.about .mark{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:var(--ui-elev);border:1px solid var(--ui-border);color:var(--ui-text);flex-shrink:0}
.about h1{font-size:20px;letter-spacing:-.01em}

kbd{display:inline-block;padding:2px 6px;border-radius:5px;border:1px solid var(--ui-border);background:var(--ui-elev);font-size:10.5px;font-family:inherit;color:var(--ui-text)}

.chip{font-size:10.5px;color:var(--ui-dim);border:1px solid var(--ui-border);border-radius:99px;padding:4px 9px;background:var(--ui-elev)}

.skin-app{height:100%;overflow:auto;padding:24px 26px 40px;display:flex;flex-direction:column;gap:18px;max-width:900px;margin:0 auto;width:100%}
.skin-hero{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.skin-hero .mk{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:rgba(var(--ui-accent-rgb),.13);border:1px solid rgba(var(--ui-accent-rgb),.26);color:var(--ui-accent);flex-shrink:0}
.skin-hero h2{font-size:19px;font-weight:600;letter-spacing:-.01em}
.skin-hero p{font-size:11.5px;color:var(--ui-dim);margin-top:4px;line-height:1.6;max-width:560px}
.skin-state{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:99px;font-size:11px;border:1px solid var(--ui-border);background:var(--ui-elev);color:var(--ui-dim);white-space:nowrap}

.skin-drop:hover{border-color:rgba(var(--ui-accent-rgb),.45);background:rgba(var(--ui-accent-rgb),.04)}

.skin-drop span{font-size:11px;color:var(--ui-dim);line-height:1.6}

.skin-item .swatch{width:28px;height:28px;border-radius:8px;flex-shrink:0;border:1px solid var(--ui-border);background:linear-gradient(135deg,var(--sw1,#7c8cff),var(--sw2,#1b2030))}
.skin-item .nm{font-size:12px;line-height:1.3}
.skin-item .mt{font-size:10.5px;color:var(--ui-dim);margin-top:2px}

.spec-list{display:grid;grid-template-columns:1fr;gap:1px;border:1px solid var(--ui-border-soft);border-radius:10px;overflow:hidden;background:var(--ui-border-soft)}
.spec-row{display:grid;grid-template-columns:170px 1fr;gap:12px;padding:8px 11px;background:var(--ui-body);font-size:11.5px;align-items:baseline}
.spec-row code{font-family:var(--ui-mono);font-size:11px;color:var(--ui-accent);word-break:break-all}
.spec-row span{color:var(--ui-dim);line-height:1.55}

.plug-list{display:flex;flex-direction:column;gap:8px}
.plug-row{display:flex;gap:10px;align-items:flex-start;padding:10px 11px;border-radius:11px;border:1px solid var(--ui-border-soft);background:rgba(255,255,255,.02);transition:border-color var(--ui-dur),background var(--ui-dur)}

.plug-safe .acts{margin-left:auto;flex-shrink:0}

.plug-editor{min-height:190px}
.plug-hint{font-size:10.5px;color:var(--ui-dim);line-height:1.6}
.plug-doc{display:flex;flex-direction:column;gap:6px}
.plug-doc .row{display:grid;grid-template-columns:150px 1fr;gap:8px;font-size:11px;line-height:1.55;padding:6px 0;border-bottom:1px solid var(--ui-border-soft)}
.plug-doc .row:last-child{border-bottom:0}

.plug-doc span{color:var(--ui-dim)}
#tb-plugin-widgets{display:flex;align-items:center;gap:4px}
.tb-plugin{display:flex;align-items:center;gap:6px;height:34px;padding:0 8px;border-radius:9px;font-size:11px;color:var(--ui-dim);border:1px solid transparent;white-space:nowrap}

const clamp = (n, min, max) => Math.min(max, Math.max(min, n));
const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

const esc = (value) => String(value).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const fmtBytes = (bytes) => {
  const n = Number(bytes) || 0;
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(n < 10240 ? 1 : 0) + ' KB';
  return (n / 1024 / 1024).toFixed(n < 10 * 1024 * 1024 ? 1 : 0) + ' MB';
};
const fmtDate = (ts) => {
  try { return new Intl.DateTimeFormat('zh-CN', { month: 'numeric', day: 'numeric' }).format(new Date(ts)); }
  catch (err) { return ''; }
};
const initialOf = (name) => {
  const value = String(name || '').trim();
  if (!value) return '?';
  const first = Array.from(value)[0];
  return /[a-z]/i.test(first) ? first.toUpperCase() : first;
};
const hexToRgb = (hex) => {
  let h = String(hex || '').replace('#', '');
  if (h.length === 3) h = h.split('').map((c) => c + c).join('');
  const n = parseInt(h, 16);
  if (!Number.isFinite(n)) return [108, 140, 255];
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
};
const hashHue = (str) => {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (Math.imul(h, 31) + str.charCodeAt(i)) >>> 0;
  return h % 360;
};
const hexHue = (hex) => {
  const [r, g, b] = hexToRgb(hex);
  const max = Math.max(r, g, b);
  const min = Math.min(r, g, b);
  if (max === min) return 232;
  const d = max - min;
  let h;
  if (max === r) h = ((g - b) / d) % 6;
  else if (max === g) h = (b - r) / d + 2;
  else h = (r - g) / d + 4;
  return Math.round((h * 60 + 360) % 360);
};

function loadSettings() {
  const loaded = { ...DEFAULT_SETTINGS };
  try {
    const raw = localStorage.getItem(LS.settings);
    if (raw) Object.assign(loaded, JSON.parse(raw));
  } catch (err) {}
  if (!/^#[0-9a-f]{6}$/i.test(String(loaded.accent || ''))) loaded.accent = DEFAULT_SETTINGS.accent;
  if (!['dark', 'light'].includes(loaded.theme)) loaded.theme = DEFAULT_SETTINGS.theme;
  if (!WALLPAPERS.some((w) => w.id === loaded.wallpaper)) loaded.wallpaper = DEFAULT_SETTINGS.wallpaper;
  loaded.motion = loaded.motion !== false;
  return loaded;
}

function saveSettings() {
  try {
    localStorage.setItem(LS.settings, JSON.stringify(settings));
    return true;
  } catch (err) {
    return false;
  }
}

function applySettingsImpl() {
  const root = document.documentElement;
  root.dataset.theme = settings.theme === 'light' ? 'light' : 'dark';
  root.dataset.wallpaper = settings.wallpaper || 'aurora';
  root.dataset.motion = settings.motion === false ? 'off' : 'on';
  root.style.setProperty('--accent', settings.accent);
  root.style.setProperty('--accent-rgb', hexToRgb(settings.accent).join(','));
  const wp = $('#wp-image');
  if (wp) {
    if (settings.wallpaper === 'custom' && settings.wallpaperImage) {
      if (wp.getAttribute('src') !== settings.wallpaperImage) wp.setAttribute('src', settings.wallpaperImage);
    } else {
      wp.removeAttribute('src');
    }
  }
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', settings.theme === 'light' ? '#eef2f9' : '#05070d');
}

function setSettingsImpl(patch, opts = {}) {
  settings = { ...settings, ...patch };
  applySettings();
  saveSettings();
  if (opts.notify !== false) emit('settings-changed', settings);
}

function hash36(str) {
  let h = 0;
  const text = String(str || '');
  for (let i = 0; i < text.length; i++) h = (Math.imul(h, 31) + text.charCodeAt(i)) >>> 0;
  return h.toString(36);
}

function readSkinRecord(key) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  } catch (err) {
    return null;
  }
}

function writeSkinRecord(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
    return true;
  } catch (err) {
    return false;
  }
}

function parseSkinSource(text, filename) {
  const raw = String(text == null ? '' : text);
  const trimmed = raw.trim();
  if (!trimmed) return { error: '文件是空的' };
  if (trimmed.length > SKIN_MAX_BYTES) return { error: '文件超过 1.6 MB，皮肤应当只包含样式' };

  const manifest = {};
  let css = '';
  const isCssFile = /\.css$/i.test(filename || '') || (!/^\s*</.test(trimmed) && !/<html[\s>]/i.test(trimmed));

  if (isCssFile) {
    css = raw;
  } else {
    const doc = new DOMParser().parseFromString(raw, 'text/html');
    const metaNode = doc.getElementById('mirage-skin-manifest') || doc.querySelector('script[type="application/json"][data-mirage-manifest]');
    if (metaNode) {
      try { Object.assign(manifest, JSON.parse(metaNode.textContent || '{}') || {}); } catch (err) {}
    }
    const htmlEl = doc.documentElement;
    if (htmlEl) {
      if (!manifest.name && htmlEl.dataset.skinName) manifest.name = htmlEl.dataset.skinName;
      if (!manifest.id && htmlEl.dataset.skinId) manifest.id = htmlEl.dataset.skinId;
    }
    const styles = Array.from(doc.querySelectorAll('style'));
    const marked = styles.filter((node) => node.hasAttribute('data-mirage-skin'));
    css = (marked.length ? marked : styles).map((node) => node.textContent || '').join('\n\n').trim();
  }

  if (!css) return { error: '没有找到样式：皮肤需要包含 <style data-mirage-skin>' };

  const meta = {
    id: String(manifest.id || '').trim() || 'skin-' + hash36(css),
    name: String(manifest.name || '').trim() || String(filename || '未命名皮肤').replace(/\.[^.]+$/, ''),
    author: String(manifest.author || '').trim(),
    version: String(manifest.version || '').trim(),
    description: String(manifest.description || '').trim(),
    theme: manifest.theme === 'light' || manifest.theme === 'dark' ? manifest.theme : '',
    accent: /^#[0-9a-f]{6}$/i.test(String(manifest.accent || '')) ? manifest.accent : '',
    wallpaper: WALLPAPERS.some((wp) => wp.id === manifest.wallpaper) ? manifest.wallpaper : '',
    tokens: manifest.tokens && typeof manifest.tokens === 'object' ? manifest.tokens : null
  };
  return { css, manifest: meta };
}

function saveToSkinLibrary(record) {
  const library = readSkinRecord(LS.skins);
  const list = Array.isArray(library) ? library : [];
  const filtered = list.filter((item) => item && item.id !== record.id);
  filtered.unshift(record);
  writeSkinRecord(LS.skins, filtered.slice(0, SKIN_LIB_MAX));
}

function skinLibrary() {
  const library = readSkinRecord(LS.skins);
  return Array.isArray(library) ? library.filter((item) => item && item.css) : [];
}

function applySkin(input, opts = {}) {
  const manifest = { ...(input.manifest || {}) };
  const baseCss = String(input.css || '');
  if (!baseCss.trim()) return false;

  let css = baseCss;
  if (manifest.tokens) {
    const decls = Object.keys(manifest.tokens)
      .filter((key) => /^--[a-z0-9-]+$/i.test(key))
      .map((key) => key + ':' + manifest.tokens[key])
      .join(';');
    if (decls) css = ':root{' + decls + '}\n' + css;
  }

  let node = document.getElementById(SKIN_STYLE_ID);
  if (!node) {
    node = document.createElement('style');
    node.id = SKIN_STYLE_ID;
    node.setAttribute('data-mirage-skin', '');
    document.head.appendChild(node);
  }
  node.textContent = css;
  document.head.appendChild(node);

  const id = manifest.id || 'custom';
  document.documentElement.dataset.skin = id;

  let metaNode = document.getElementById(SKIN_META_ID);
  if (!metaNode) {
    metaNode = document.createElement('script');
    metaNode.type = 'application/json';
    metaNode.id = SKIN_META_ID;
    document.head.appendChild(metaNode);
  }
  metaNode.textContent = JSON.stringify({
    id,
    name: manifest.name || '自定义皮肤',
    author: manifest.author || '',
    version: manifest.version || '',
    description: manifest.description || '',
    source: input.source || '本地文件'
  }).replace(/</g, '\\u003c');

  skinState.id = id;
  skinState.name = manifest.name || '自定义皮肤';
  skinState.css = baseCss;
  skinState.manifest = manifest;
  skinState.source = input.source || '本地文件';
  if (opts.persist !== false) skinState.auto = 'manual';

  const patch = {};
  if (manifest.theme) patch.theme = manifest.theme;
  if (manifest.accent) patch.accent = manifest.accent;
  if (manifest.wallpaper) patch.wallpaper = manifest.wallpaper;
  if (Object.keys(patch).length) setSettings(patch);

  if (opts.persist !== false) {
    const record = {
      id,
      name: skinState.name,
      css: baseCss,
      manifest,
      source: skinState.source,
      at: Date.now()
    };
    if (!writeSkinRecord(LS.skin, record)) toast('皮肤已应用，但体积过大无法持久保存', 'warn');
    saveToSkinLibrary(record);
  }

  emit('skin-changed', skinState);
  return true;
}

function clearSkin(opts = {}) {
  const node = document.getElementById(SKIN_STYLE_ID);
  if (node) node.remove();
  const metaNode = document.getElementById(SKIN_META_ID);
  if (metaNode) metaNode.remove();
  document.documentElement.removeAttribute('data-skin');
  skinState.id = 'default';
  skinState.name = '默认 · 薄雾玻璃';
  skinState.css = '';
  skinState.manifest = null;
  skinState.source = '内置';
  skinState.auto = opts.auto || 'none';
  if (opts.persist !== false) {
    try { localStorage.removeItem(LS.skin); } catch (err) {}
  }
  emit('skin-changed', skinState);
}

async function loadSkinText(text, filename, opts = {}) {
  const parsed = parseSkinSource(text, filename);
  if (parsed.error) {
    toast('皮肤载入失败：' + parsed.error, 'error', { duration: 6000 });
    return false;
  }
  const ok = applySkin({ ...parsed, source: opts.source || filename || '本地文件' }, { persist: opts.persist !== false });
  if (ok) toast('已应用皮肤「' + skinState.name + '」', 'success');
  return ok;
}

function looksLikeSkin(text, filename) {
  const name = String(filename || '');
  if (/\.css$/i.test(name)) return true;
  const sample = String(text || '').slice(0, 20000);
  return /data-mirage-skin/i.test(sample)
    || /id\s*=\s*["']mirage-skin-manifest["']/i.test(sample)
    || /name\s*=\s*["']mirage-skin["']/i.test(sample);
}

async function probeSkinFile() {
  const link = document.querySelector('link[rel="mirage-skin"]');
  const explicit = link && link.getAttribute('href');
  const names = explicit ? [explicit] : SKIN_FILES;
  for (const name of names) {
    try {
      const res = await fetch(name, { cache: 'no-store' });
      if (!res.ok) continue;
      const text = await res.text();
      if (!text || text.length > SKIN_MAX_BYTES) continue;
      const marked = /\.css$/i.test(name) || /data-mirage-skin|mirage-skin-manifest/i.test(text);
      if (!marked) continue;
      const parsed = parseSkinSource(text, name);
      if (parsed && parsed.css) return { ...parsed, source: name };
    } catch (err) {
      skinState.auto = 'blocked';
      return null;
    }
  }
  return null;
}

async function initSkin() {
  const inline = document.getElementById(SKIN_STYLE_ID);
  if (inline && (inline.textContent || '').trim()) {
    let manifest = {};
    try {
      const metaNode = document.getElementById(SKIN_META_ID);
      manifest = JSON.parse((metaNode && metaNode.textContent) || '{}') || {};
    } catch (err) {}
    skinState.id = manifest.id || 'embedded';
    skinState.name = manifest.name || '内嵌皮肤';
    skinState.css = inline.textContent;
    skinState.manifest = manifest;
    skinState.source = '内嵌于本文件';
    skinState.auto = 'inline';
    document.documentElement.dataset.skin = skinState.id;
    return;
  }

  const saved = readSkinRecord(LS.skin);
  if (saved && saved.css) {
    applySkin(saved, { persist: false });
    skinState.auto = 'saved';
    return;
  }

  const found = await probeSkinFile();
  if (found) {
    applySkin({ ...found, source: '同目录 · ' + found.source }, { persist: false });
    skinState.auto = 'file';
    skinState.autoFile = found.source;
    return;
  }

  if (skinState.auto !== 'blocked') skinState.auto = 'none';
}

function pickSkin() {
  const input = document.getElementById('skin-input');
  if (!input) return;
  input.value = '';
  input.click();
}

async function handleSkinFile(file) {
  if (!file) return;
  try {
    const buffer = await file.arrayBuffer();
    const text = decodeHtmlBuffer(buffer);
    if (!text.trim()) {
      toast('皮肤文件是空的', 'warn');
      return;
    }
    await loadSkinText(text, file.name);
  } catch (err) {
    console.error(err);
    toast('「' + file.name + '」读取失败', 'error');
  }
}

}

      const text = editor.value;
      if (!text.trim()) {

      const parsed = parseSkinSource(text, '手写皮肤');

      downloadTextFile(

    } else if (act === 'fill-template') {
      editor.value = templateText;

    } else if (act === 'apply-skin') {
      const record = skinLibrary().find((item) => item.id === btn.dataset.id);
      if (!record) return;
      applySkin(record);

      toast('已应用「' + record.name + '」', 'success');

      const id = btn.dataset.id;

      writeSkinRecord(LS.skins, library);
      if (skinState.id === id) clearSkin();
      paint();

  });

  function paint() {
    const cur = $('#skin-current', root);
    if (cur) cur.textContent = skinState.name;
    const au = $('#skin-auto', root);
    if (au) au.textContent = autoText();
    const list = $('#skin-list', root);

    if (!library.length) {
      list.innerHTML = '<div class="desc">还没有记录。载入一份皮肤后会出现在这里。</div>';
      return;

    for (const record of library) {
      const item = document.createElement('div');
      item.className = 'skin-item' + (record.id === skinState.id ? ' active' : '');
      const swatch = document.createElement('span');
      swatch.className = 'swatch';
      const manifest = record.manifest || {};
      swatch.style.setProperty('--sw1', manifest.accent || '#7c8cff');
      swatch.style.setProperty('--sw2', manifest.theme === 'light' ? '#f4f6fb' : '#1b2030');
      const meta = document.createElement('div');
      const nm = document.createElement('div');
      nm.className = 'nm';
      nm.textContent = record.name || '未命名皮肤';
      const mt = document.createElement('div');
      mt.className = 'mt';
      mt.textContent = [record.source || '本地文件', fmtBytes((record.css || '').length)].join(' · ');
      meta.append(nm, mt);
      const acts = document.createElement('div');
      acts.className = 'acts';
      const applyBtn = document.createElement('button');
      applyBtn.className = 'btn sm' + (record.id === skinState.id ? ' ghost' : '');
      applyBtn.dataset.act = 'apply-skin';
      applyBtn.dataset.id = record.id;
      applyBtn.textContent = record.id === skinState.id ? '使用中' : '应用';
      if (record.id === skinState.id) applyBtn.disabled = true;
      const delBtn = document.createElement('button');
      delBtn.className = 'icon-btn danger';
      delBtn.dataset.act = 'delete-skin';
      delBtn.dataset.id = record.id;
      delBtn.title = '从皮肤库移除';
      delBtn.innerHTML = icon('trash', 15);
      acts.append(applyBtn, delBtn);
      item.append(swatch, meta, acts);
      list.appendChild(item);
    }
  }

  const onSkin = () => paint();
  bus.addEventListener('skin-changed', onSkin);
  paint();
  return () => bus.removeEventListener('skin-changed', onSkin);
}

function fallbackWrite(apps) {
