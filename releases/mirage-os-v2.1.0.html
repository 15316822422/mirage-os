}

function detectSafeMode() {
  try {
    const url = new URL(location.href);
    if (url.searchParams.get('safe') === '1') return true;
  } catch (err) {}
  return Boolean(readCrashState().safeMode);
}

/* 退出安全模式时，若地址栏还挂着 ?safe=1，必须一并摘掉，否则重载后又进安全模式 */
function stripSafeModeParam() {
  try {
    const url = new URL(location.href);
    if (url.searchParams.get('safe') !== '1') return;
    url.searchParams.delete('safe');
    const next = url.pathname + (url.search || '') + (url.hash || '');
    history.replaceState(null, '', next);
  } catch (err) {
    try {
      const clean = location.href.replace(/([?&])safe=1(&|$)/, (m, p1, p2) => (p2 ? p1 : '')).replace(/[?&]$/, '');
      history.replaceState(null, '', clean);
    } catch (err2) {}
  }
}

function setActivePlugin(id) {
  pluginState.activeId = id;
  if (id) {
    pluginState.lastActive = { id, ts: Date.now() };
    try { localStorage.setItem(LS.pluginRuntime, JSON.stringify({ id, ts: Date.now() })); } catch (err) {}
  } else {
    try { localStorage.removeItem(LS.pluginRuntime); } catch (err) {}
  }
}

function readRuntimeMarker() {
  try {
    const raw = localStorage.getItem(LS.pluginRuntime);
    return raw ? JSON.parse(raw) : null;
  } catch (err) {
    return null;
  }
}

function pluginIdFromError(err) {
  const text = String(err && (err.stack || err.message) || '');
  const match = text.match(/mirage-plugin:\/\/([^\s/:)]+)/);
  if (match) {
    try { return decodeURIComponent(match[1]); } catch (err) { return match[1]; }
  }
  return '';
}

function normalizePluginRecord(raw) {
  if (!raw || typeof raw !== 'object') return null;
  const source = typeof raw.source === 'string' ? raw.source : '';
  if (!source.trim()) return null;
  const id = String(raw.id || '').trim();
  if (!/^[a-z0-9][a-z0-9._-]{0,79}$/i.test(id)) return null;
  return {
    id,
    name: String(raw.name || id),
    version: String(raw.version || '1.0.0'),
    author: String(raw.author || ''),
    description: String(raw.description || ''),
    source,
    filename: String(raw.filename || ''),
    origin: ['file', 'auto', 'paste', 'embedded', 'sample'].includes(raw.origin) ? raw.origin : 'file',
    enabled: raw.enabled !== false,
    priority: Number(raw.priority) || 0,
    crashes: Number(raw.crashes) || 0,
    lastError: raw.lastError && typeof raw.lastError === 'object' ? raw.lastError : null,
    createdAt: Number(raw.createdAt) || Date.now(),
    updatedAt: Number(raw.updatedAt) || Date.now()
  };
}

function pluginFallbackRead() {
  try {
    const raw = localStorage.getItem(LS.plugins);
    const list = raw ? JSON.parse(raw) : [];
    return Array.isArray(list) ? list : [];
  } catch (err) {
    return [];
  }
}

function pluginFallbackWrite() {
  try {
    localStorage.setItem(LS.plugins, JSON.stringify([...pluginState.records.values()]));
    return true;
  } catch (err) {
    return false;
  }
}

async function savePluginRecord(rec) {
  rec.updatedAt = Date.now();
  pluginState.records.set(rec.id, rec);
  let saved = false;
  if (dbReady) {
    try {
      await dbPutPlugin(rec);
      saved = true;
    } catch (err) {}
  }
  if (!saved) pluginFallbackWrite();
  return saved;
}

async function deletePluginRecord(id) {
  pluginState.records.delete(id);
  if (dbReady) {
    try { await dbDeletePlugin(id); } catch (err) {}
  }
  pluginFallbackWrite();
}

async function hydratePlugins(embedded) {
  try { await openDB(); } catch (err) {}
  let stored = [];
  if (dbReady) {
    try { stored = await dbAllPlugins(); } catch (err) { stored = pluginFallbackRead(); }
  } else {
    stored = pluginFallbackRead();
  }
  for (const raw of stored) {
    const rec = normalizePluginRecord(raw);
    if (rec) pluginState.records.set(rec.id, rec);
  }
  if (embedded && Array.isArray(embedded.plugins)) {
    for (const raw of embedded.plugins) {
      const rec = normalizePluginRecord({ ...raw, origin: 'embedded', enabled: true });
      if (rec) pluginState.records.set(rec.id, rec);
    }
  }
  pluginState.errors = readPluginErrors();
  pluginState.hydrated = true;
}

function readPluginManifest(doc) {
  const meta = doc.querySelector('meta[name="mirage-plugin"]');
  if (meta) {
    const raw = meta.getAttribute('content') || '';
    try {
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed === 'object') return parsed;
    } catch (err) {}
  }
  const node = doc.querySelector('script#mirage-plugin-manifest, script[type="application/json"][data-mirage-plugin]');
  if (node) {
    try {
      const parsed = JSON.parse(node.textContent || '');
      if (parsed && typeof parsed === 'object') return parsed;
    } catch (err) {}
  }
  return {};
}

function parsePluginSource(text, filename) {
  const name = String(filename || '');
  const looksHtml = /<!doctype html/i.test(text) || /<meta[^>]+name=["']mirage-plugin["']/i.test(text) || (/<script[\s>]/i.test(text) && /<\/script>/i.test(text));
  const looksJs = !looksHtml;
  if (looksJs) {
    const marker = text.match(/@mirage-plugin\s+(\{[\s\S]*?\})/);
    let manifest = {};
    if (marker) {
      try { manifest = JSON.parse(marker[1]); } catch (err) {}
    }
    return { manifest, styles: [], scripts: [text], body: '', kind: 'js' };
  }
  const doc = new DOMParser().parseFromString(text, 'text/html');
  const manifest = readPluginManifest(doc);
  const styles = Array.from(doc.querySelectorAll('style')).map((node) => node.textContent || '').filter((css) => css.trim());
  const scripts = Array.from(doc.querySelectorAll('script'))
    .filter((node) => !node.getAttribute('src'))
    .map((node) => node.textContent || '')
    .filter((code) => code.trim());
  const bodyNode = doc.body ? doc.body.cloneNode(true) : null;
  if (bodyNode) {
    bodyNode.querySelectorAll('script,style,link,meta,title').forEach((node) => node.remove());
  }
  const body = bodyNode ? bodyNode.innerHTML.trim() : '';
  return { manifest, styles, scripts, body, kind: 'html' };
}

function looksLikePlugin(text, filename) {
  const name = String(filename || '');
  if (/\.js$/i.test(name)) return /Mirage\.register\s*\(|@mirage-plugin/i.test(text);
  return /<meta[^>]+name=["']mirage-plugin["']/i.test(text);
}

function pluginManifestId(manifest, text, filename) {
  const raw = String(manifest && manifest.id || '').trim();
  if (/^[a-z0-9][a-z0-9._-]{0,79}$/i.test(raw)) return raw;
  return 'plug_' + hash36(String(text || '') + String(filename || '')).slice(0, 10);
}

async function installPluginText(text, filename, opts = {}) {
  if (!text || !text.trim()) throw new Error('插件内容为空');
  if (text.length > PLUGIN_MAX_BYTES) throw new Error('插件超过 ' + fmtBytes(PLUGIN_MAX_BYTES));
  if (!opts.force && !looksLikePlugin(text, filename)) throw new Error('没有检测到 <meta name="mirage-plugin"> 标记');
  const parsed = parsePluginSource(text, filename);
  const manifest = parsed.manifest || {};
  const id = opts.id || pluginManifestId(manifest, text, filename);
  const existing = pluginState.records.get(id);
  const rec = normalizePluginRecord({
    ...(existing || {}),
    id,
    name: manifest.name || opts.name || String(filename || '').replace(/\.[^.]+$/, '') || '未命名插件',
    version: manifest.version || '1.0.0',
    author: manifest.author || '',
    description: manifest.description || '',
    priority: Number(manifest.priority) || 0,
    source: text,
    filename: String(filename || ''),
    origin: opts.origin || 'file',
    enabled: opts.enabled !== false,
    crashes: existing ? existing.crashes : 0,
    createdAt: existing ? existing.createdAt : Date.now()
  });
  await savePluginRecord(rec);
  emit('plugins-changed');
  return rec;
}

function addPluginStyle(runtime, css) {
  const style = document.createElement('style');
  style.dataset.miragePlugin = runtime.id;
  style.textContent = css;
  document.head.appendChild(style);
  runtime.styles.push(style);
}

function makePluginCtx(runtime) {
  const id = runtime.id;
  const rec = runtime.rec;

  const trackCleanup = (fn) => {
    runtime.cleanups.push(fn);
    return fn;
  };

  const wrapCallback = (fn, once) => {
    const handler = (event) => {
      setActivePlugin(id);
      try {
        fn(event.detail, event);
      } catch (err) {
        pluginError(id, err);
      } finally {
        setActivePlugin(null);
      }
      if (once) bus.removeEventListener(event.type, handler);
    };
    return handler;
  };

  const storagePrefix = 'mirage.plugin.' + id + '.';

  const ctx = {
    id,
    apiVersion: PLUGIN_API,
    manifest: runtime.parsed.manifest || {},
    plugin: rec,
    document,
    log: (...args) => console.log('[plugin:' + id + ']', ...args),

    on(type, fn) {
      if (typeof fn !== 'function') throw pluginCtxError('on 需要回调函数');
      const handler = wrapCallback(fn);
      bus.addEventListener(type, handler);
      const off = () => bus.removeEventListener(type, handler);
      trackCleanup(off);
      return off;
    },

    interval(fn, ms) {
      const delay = Math.max(16, Number(ms) || 1000);
      const handle = setInterval(() => {
        setActivePlugin(id);
        try { fn(); } catch (err) { pluginError(id, err); } finally { setActivePlugin(null); }
      }, delay);
      runtime.timers.add({ handle, type: 'interval' });
      return handle;
    },

    timeout(fn, ms) {
      const delay = Math.max(0, Number(ms) || 0);
      const handle = setTimeout(() => {
        runtime.timers.delete(entry);
        setActivePlugin(id);
        try { fn(); } catch (err) { pluginError(id, err); } finally { setActivePlugin(null); }
      }, delay);
      const entry = { handle, type: 'timeout' };
      runtime.timers.add(entry);
      return handle;
    },

    clearTimer(handle) {
      clearInterval(handle);
      clearTimeout(handle);
      for (const entry of runtime.timers) {
        if (entry.handle === handle) runtime.timers.delete(entry);
      }
    },

    cleanup(fn) {
      if (typeof fn === 'function') trackCleanup(fn);
      return fn;
    },

    css(css) {
      addPluginStyle(runtime, String(css || ''));
    },

    mount(target, html) {
      const parent = typeof target === 'string' ? document.querySelector(target) : target;
      if (!parent) throw pluginCtxError('mount 目标不存在');
      const node = document.createElement('div');
      node.dataset.miragePlugin = id;
      node.innerHTML = String(html || '');
      parent.appendChild(node);
      trackCleanup(() => node.remove());
      return node;
    },

    toast(message, type = 'info', options = {}) {
      return toastImpl(message, type, options);
    },

    notify(message, type) {
      return toastImpl(message, type || 'info');
    },

    confirm(options) {
      return askConfirm(options || {});
    },

    prompt(options) {
      return askText(options || {});
    },

    app(def = {}) {
      return registerPluginApp(runtime, def);
    },

    openWindow(options = {}) {
      return openPluginWindow(runtime, options);
    },

    storage: {
      get(key, fallback) {
        try {
          const raw = localStorage.getItem(storagePrefix + key);
          return raw === null ? fallback : JSON.parse(raw);
        } catch (err) {
          return fallback;
        }
      },
      set(key, value) {
        try {
          localStorage.setItem(storagePrefix + key, JSON.stringify(value));
          return true;
        } catch (err) {
          return false;
        }
      },
      remove(key) {
        try { localStorage.removeItem(storagePrefix + key); } catch (err) {}
      },
      keys() {
        const out = [];
        try {
          for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key && key.startsWith(storagePrefix)) out.push(key.slice(storagePrefix.length));
          }
        } catch (err) {}
        return out;
      }
    },

    ui: {
      desktopIcon(def = {}) {
        return registerPluginIcon(runtime, def);
      },
      menuItem(def = {}) {
        return registerPluginMenuItem(runtime, def);
      },
      taskbarWidget(def = {}) {
        return registerPluginWidget(runtime, def);
      },
      settingsSection(def = {}) {
        return registerPluginSettings(runtime, def);
      }
    },

    kernel: {
      override(name, fn) {
        return addPluginHook(runtime, name, fn);
      },
      restore(name) {
        removePluginHooks(runtime, name);
      },
      list() {
        const out = {};
        for (const [name, list] of coreHooks) out[name] = list.length;
        return out;
      },
      api() {
        return {
          state,
          getSettings: () => ({ ...settings }),
          setSettings: (patch, opts) => setSettings(patch, opts),
          applySettings: () => applySettings(),
          openApp: (key) => openApp(key),
          closeWindow: (win) => closeWindow(win),
          renderDesktopIcons: (animateKey) => renderDesktopIcons(animateKey),
          renderStartApps: (query) => renderStartApps(query),
          toast: (message, type, opts) => toastImpl(message, type, opts),
          confirm: (opts) => askConfirm(opts),
          prompt: (opts) => askText(opts),
          showMenu: (items, x, y) => showMenu(items, x, y),
          emit: (type, detail) => emit(type, detail),
          bus,
          BUILTINS,
          makeArt,
          icon,
          esc,
          uid,
          version: VERSION
        };
      }
    }
  };

  return ctx;
}

function registerPluginDef(def) {
  if (!def || typeof def !== 'object') throw pluginCtxError('Mirage.register 需要一个对象');
  const id = pluginState.activeId || String(def.id || '').trim();
  const runtime = pluginState.runtimes.get(id);
  if (!runtime) throw pluginCtxError('Mirage.register 只能在插件脚本或 start() 中调用');
  runtime.def = def;
  runtime.ctx = runtime.ctx || makePluginCtx(runtime);
  if (typeof def.setup === 'function' && !runtime.setupDone) {
    runtime.setupDone = true;
    try {
      const result = def.setup(runtime.ctx);
      if (result && typeof result.then === 'function') result.catch((err) => pluginError(id, err));
    } catch (err) {
      pluginError(id, err);
      throw err;
    }
  }
  if (runtime.loaded && typeof def.start === 'function') {
    setActivePlugin(id);
    try {
      const result = def.start(runtime.ctx);
      if (result && typeof result.then === 'function') result.catch((err) => pluginError(id, err));
    } catch (err) {
      pluginError(id, err);
    } finally {
      setActivePlugin(null);
    }
  }
  return runtime.ctx;
}

function registerPluginApp(runtime, def) {
  const id = runtime.id;
  const slug = String(def.id || def.name || 'app').toLowerCase().replace(/[^a-z0-9_-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'app';
  const key = 'plugin.' + id + '.' + slug;
  const app = {
    id: key,
    name: String(def.name || '插件应用'),
    sub: String(def.sub || ('来自 ' + runtime.rec.name)),
    icon: def.icon || 'spark',
    g1: def.g1,
    g2: def.g2,
    w: Number(def.w) || 860,
    h: Number(def.h) || 620,
    hidden: Boolean(def.hidden),
    render(root, win) {
      try {
        if (typeof def.render === 'function') return def.render(root, win, runtime.ctx);
        root.innerHTML = String(def.html || '');
        return null;
      } catch (err) {
        pluginError(id, err);
        throw err;
      }
    }
  };
  pluginState.apps.set(key, { app, pluginId: id });
  runtime.apps.push(key);
  if (def.desktop) {
    registerPluginIcon(runtime, {
      id: 'app-' + slug,
      name: app.name,
      icon: app.icon,
      appKey: key
    });
  }
  emit('apps-changed');
  emit('plugins-changed');
  return {
    key,
    open: () => openApp(key),
    close: () => {
      const win = state.windows.get(key);
      if (win) closeWindowImpl(win);
    },
    get window() { return state.windows.get(key) || null; }
  };
}

function registerPluginIcon(runtime, def) {
  const id = String(def.id || def.name || uid('icon'));
  const entry = {
    id,
    key: 'plugin.icon.' + runtime.id + '.' + id,
    pluginId: runtime.id,
    name: String(def.name || '插件'),
    icon: def.icon || 'spark',
    g1: def.g1,
    g2: def.g2,
    appKey: def.appKey || def.app || '',
    onOpen: typeof def.onOpen === 'function' ? def.onOpen : null,
    order: Number(def.order) || 0
  };
  pluginState.icons.push(entry);
  runtime.icons.push(entry);
  renderDesktopIcons();
  return () => {
    const index = pluginState.icons.indexOf(entry);
    if (index >= 0) pluginState.icons.splice(index, 1);
    renderDesktopIcons();
  };
}

function registerPluginMenuItem(runtime, def) {
  const entry = {
    pluginId: runtime.id,
    label: String(def.label || '插件操作'),
    icon: def.icon || 'spark',
    order: Number(def.order) || 0,
    onClick: typeof def.onClick === 'function' ? def.onClick : () => {}
  };
  pluginState.menuItems.push(entry);
  runtime.menuItems.push(entry);
  return () => {
    const index = pluginState.menuItems.indexOf(entry);
    if (index >= 0) pluginState.menuItems.splice(index, 1);
  };
}

function registerPluginWidget(runtime, def) {
  const host = $('#tb-plugin-widgets');
  if (!host) return () => {};
  const el = document.createElement('div');
  el.className = 'tb-plugin';
  el.dataset.plugin = runtime.id;
  host.appendChild(el);
  try {
    if (typeof def.render === 'function') def.render(el, runtime.ctx);
    else el.innerHTML = String(def.html || '');
  } catch (err) {
    pluginError(runtime.id, err);
  }
  runtime.widgets.push(el);
  return () => el.remove();
}

function registerPluginSettings(runtime, def) {
  const entry = {
    pluginId: runtime.id,
    id: String(def.id || uid('section')),
    title: String(def.title || runtime.rec.name),
    desc: String(def.desc || ''),
    render: typeof def.render === 'function' ? def.render : null,
    ctx: runtime.ctx
  };
  pluginState.sections.push(entry);
  runtime.sections.push(entry);
  emit('plugins-changed');
  return () => {
    const index = pluginState.sections.indexOf(entry);
    if (index >= 0) pluginState.sections.splice(index, 1);
    emit('plugins-changed');
  };
}

function renderPluginSettings(host, root) {
  if (!host) return;
  host.innerHTML = '';
  for (const section of pluginState.sections) {
    const wrap = document.createElement('div');
    wrap.className = 'set-sec';
    const head = document.createElement('div');
    const title = document.createElement('div');
    title.className = 'set-title';
    title.textContent = section.title;
    head.appendChild(title);
    if (section.desc) {
      const desc = document.createElement('div');
      desc.className = 'set-desc';
      desc.textContent = section.desc;
      head.appendChild(desc);
    }
    const card = document.createElement('div');
    card.className = 'set-card';
    wrap.append(head, card);
    host.appendChild(wrap);
    if (section.render) {
      try {
        section.render(card, section.ctx);
      } catch (err) {
        pluginError(section.pluginId, err);
      }
    }
  }
}

function openPluginWindow(runtime, options) {
  const title = String(options.title || '插件窗口');
  const handle = registerPluginApp(runtime, {
    id: 'win-' + uid('w'),
    name: title,
    sub: runtime.rec.name,
    icon: options.icon || 'window',
    w: options.width || options.w || 760,
    h: options.height || options.h || 560,
    hidden: true,
    render(root, win) {
      if (typeof options.render === 'function') return options.render(root, win, runtime.ctx);
      root.innerHTML = String(options.html || '');
      return null;
    }
  });
  const win = openApp(handle.key);
  runtime.windows.add(handle.key);
  if (win) {
    const prevDispose = win.dispose;
    win.dispose = () => {
      if (typeof prevDispose === 'function') {
        try { prevDispose(); } catch (err) {}
      }
      if (typeof options.onClose === 'function') {
        try { options.onClose(); } catch (err) { pluginError(runtime.id, err); }
      }
    };
  }
  return {
    key: handle.key,
    win,
    body: win ? win.bodyEl : null,
    close: handle.close
  };
}

function addPluginHook(runtime, name, fn) {
  if (!CORE_HOOK_NAMES.includes(name)) throw pluginCtxError('不支持的内核函数：' + name);
  if (typeof fn !== 'function') throw pluginCtxError('override 需要函数');
  if (!coreHooks.has(name)) coreHooks.set(name, []);
  const entry = { pluginId: runtime.id, fn };
  coreHooks.get(name).push(entry);
  runtime.hooks.push({ name, entry });
  return () => {
    const list = coreHooks.get(name);
    if (!list) return;
    const index = list.indexOf(entry);
    if (index >= 0) list.splice(index, 1);
  };
}

function removePluginHooks(runtime, name) {
  const list = coreHooks.get(name);
  if (!list) return;
  for (let i = list.length - 1; i >= 0; i--) {
    if (list[i].pluginId === runtime.id) list.splice(i, 1);
  }
}

function removePluginApp(runtime, key) {
  const win = state.windows.get(key);
  if (win) closeWindowImpl(win);
  pluginState.apps.delete(key);
}

async function stopPlugin(id) {
  const runtime = pluginState.runtimes.get(id);
  if (!runtime || runtime.stopping) return;
  runtime.stopping = true;
  if (runtime.def && typeof runtime.def.stop === 'function') {
    setActivePlugin(id);
    try {
      const result = runtime.def.stop(runtime.ctx);
      if (result && typeof result.then === 'function') await result;
    } catch (err) {
      pluginError(id, err, { silent: true });
    } finally {
      setActivePlugin(null);
    }
  }
  for (const key of runtime.apps) removePluginApp(runtime, key);
  for (const winKey of runtime.windows) {
    const win = state.windows.get(winKey);
    if (win) closeWindowImpl(win);
  }
  for (const fn of runtime.cleanups.reverse()) {
    try { fn(); } catch (err) {}
  }
  for (const entry of runtime.timers) {
    clearInterval(entry.handle);
    clearTimeout(entry.handle);
  }
  for (const style of runtime.styles) style.remove();
  for (const icon of runtime.icons) {
    const index = pluginState.icons.indexOf(icon);
    if (index >= 0) pluginState.icons.splice(index, 1);
  }
  for (const item of runtime.menuItems) {
    const index = pluginState.menuItems.indexOf(item);
    if (index >= 0) pluginState.menuItems.splice(index, 1);
  }
  for (const widget of runtime.widgets) widget.remove();
  for (const section of runtime.sections) {
    const index = pluginState.sections.indexOf(section);
    if (index >= 0) pluginState.sections.splice(index, 1);
  }
  for (const hook of runtime.hooks) {
    const list = coreHooks.get(hook.name);
    if (!list) continue;
    const index = list.indexOf(hook.entry);
    if (index >= 0) list.splice(index, 1);
  }
  if (runtime.host) runtime.host.remove();
  pluginState.runtimes.delete(id);
  renderDesktopIconsImpl();
  syncTaskbar();
  syncStartResults();
  emit('plugins-changed');
  emit('plugin-stopped', { id });
}

async function startPlugin(id) {
  const rec = pluginState.records.get(id);
  if (!rec || !rec.enabled || pluginState.safeMode) return false;
  if (pluginState.runtimes.has(id)) return true;
  if (!rec.source || !rec.source.trim()) return false;
  const parsed = parsePluginSource(rec.source, rec.filename);
  const runtime = {
    id,
    rec,
    parsed,
    def: null,
    ctx: null,
    loaded: false,
    started: false,
    host: null,
    cleanups: [],
    styles: [],
    timers: new Set(),
    apps: [],
    icons: [],
    menuItems: [],
    widgets: [],
    sections: [],
    hooks: [],
    windows: new Set()
  };
  pluginState.runtimes.set(id, runtime);
  setActivePlugin(id);
  try {
    for (const css of parsed.styles) addPluginStyle(runtime, css);
    if (parsed.body) {
      const host = document.createElement('div');
      host.className = 'plugin-root';
      host.dataset.miragePlugin = id;
      host.innerHTML = parsed.body;
      document.body.appendChild(host);
      runtime.host = host;
      runtime.cleanups.push(() => host.remove());
    }
    for (const code of parsed.scripts) {
      const fn = new Function('Mirage', code + '\n//# sourceURL=' + PLUGIN_SOURCE_PREFIX + encodeURIComponent(id));
      fn(window.Mirage);
    }
    runtime.loaded = true;
    if (!runtime.def) runtime.def = { id, name: rec.name };
    runtime.ctx = runtime.ctx || makePluginCtx(runtime);
    if (typeof runtime.def.setup === 'function' && !runtime.setupDone) {
      runtime.setupDone = true;
      const result = runtime.def.setup(runtime.ctx);
      if (result && typeof result.then === 'function') await result;
    }
    if (typeof runtime.def.start === 'function') {
      const result = runtime.def.start(runtime.ctx);
      if (result && typeof result.then === 'function') await result;
    }
    runtime.started = true;
    emit('plugin-started', { id, rec });
    return true;
  } catch (err) {
    await failPlugin(id, err, { phase: 'start' });
    return false;
  } finally {
    setActivePlugin(null);
  }
}

async function failPlugin(id, err, opts = {}) {
  const rec = pluginState.records.get(id);
  const name = rec ? rec.name : id;
  const message = err && err.message ? err.message : String(err);
  pluginState.errors.unshift({
    id,
    name,
    time: Date.now(),
    message,
    stack: String(err && err.stack || '').slice(0, 1200),
    phase: opts.phase || 'runtime'
  });
  pluginState.errors = pluginState.errors.slice(0, 40);
  savePluginErrors();
  if (rec) {
    rec.enabled = false;
    rec.crashes = (rec.crashes || 0) + 1;
    rec.lastError = { time: Date.now(), message, phase: opts.phase || 'runtime' };
    await savePluginRecord(rec);
  }
  await stopPlugin(id);
  emit('plugins-changed');
  toastImpl('插件「' + name + '」启动失败，已自动禁用', 'error', {
    duration: 8000,
    action: '详情',
    onAction: () => openAppImpl('plugins')
  });
  if (opts.reload !== false) scheduleCrashReload(1200);
}

function pluginError(id, err, opts = {}) {
  if (!id) return;
  const runtime = pluginState.runtimes.get(id);
  if (!runtime) return;
  const rec = pluginState.records.get(id);
  const name = rec ? rec.name : id;
  const message = err && err.message ? err.message : String(err);
  const entry = {
    id,
    name,
    time: Date.now(),
    message,
    stack: String(err && err.stack || '').slice(0, 1200),
    phase: opts.phase || 'runtime'
  };
  pluginState.errors.unshift(entry);
  pluginState.errors = pluginState.errors.slice(0, 40);
  savePluginErrors();
  try { console.error('[mirage plugin:' + id + ']', err); } catch (e) {}
  if (pluginState.reloading) return;
  if (!opts.silent && Date.now() - pluginState.lastToast > 4000) {
    pluginState.lastToast = Date.now();
    toastImpl('插件「' + name + '」运行出错', 'error', {
      duration: 6000,
      action: '详情',
      onAction: () => openAppImpl('plugins')
    });
  }
  if (opts.fatal || (pluginState.booting && pluginState.bootLast === id)) {
    disablePlugin(id, '启动崩溃', { reload: true, detail: message });
    return;
  }
  const recent = pluginState.errors.filter((item) => item.id === id && Date.now() - item.time < 15000);
  if (recent.length >= 3) {
    disablePlugin(id, '连续出错', { reload: true, detail: message });
  }
}

async function disablePlugin(id, reason, opts = {}) {
  const rec = pluginState.records.get(id);
  if (!rec) return;
  const wasEnabled = rec.enabled;
  rec.enabled = false;
  rec.crashes = (rec.crashes || 0) + 1;
  rec.lastError = { time: Date.now(), message: String(opts.detail || reason || '插件被禁用'), phase: reason };
  await savePluginRecord(rec);
  await stopPlugin(id);
  try {
    const runtime = readRuntimeMarker();
    if (runtime && runtime.id === id) localStorage.removeItem(LS.pluginRuntime);
  } catch (err) {}
  emit('plugins-changed');
  if (wasEnabled && opts.reload !== false) {
    toastImpl('插件「' + rec.name + '」已因' + reason + '被自动禁用，界面即将重置', 'error', {
      duration: 5000,
      action: '插件中心',
      onAction: () => openAppImpl('plugins')
    });
    scheduleCrashReload(1000);
  }
}

function scheduleCrashReload(delay = 900) {
  if (pluginState.reloading) return;
  pluginState.reloading = true;
  pluginState.intentionalReload = true;
  setTimeout(() => { location.reload(); }, delay);
}

function pluginBootWatchdog() {
  let lastBeat = Date.now();
  setInterval(() => {
    const now = Date.now();
    const gap = now - lastBeat;
    if (document.visibilityState === 'visible' && gap > 12000) {
      const last = pluginState.lastActive;
      if (last && last.ts >= lastBeat && now - last.ts < 90000) {
        pluginError(last.id, new Error('插件阻塞主线程 ' + Math.round(gap / 1000) + ' 秒'), { fatal: true, phase: 'hang' });
      }
    }
    lastBeat = now;
  }, 2000);
}

window.addEventListener('error', (event) => {
  const id = pluginIdFromError(event.error) || pluginIdFromError(event.message) || pluginState.activeId;
  if (id && pluginState.runtimes.has(id)) {
    pluginError(id, event.error || new Error(event.message || '脚本错误'));
  }
});

window.addEventListener('unhandledrejection', (event) => {
  const reason = event.reason;
  const id = pluginIdFromError(reason) || pluginState.activeId;
  if (id && pluginState.runtimes.has(id)) {
    pluginError(id, reason || new Error('未处理的 Promise 拒绝'));
  }
});

async function fetchPluginText(url, timeout = 2200) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeout);
  try {
    const res = await fetch(url, { cache: 'no-store', signal: controller.signal });
    if (!res.ok) return null;
    const text = await res.text();
    return text.length > PLUGIN_MAX_BYTES ? null : text;
  } catch (err) {
    return null;
  } finally {
    clearTimeout(timer);
  }
}

async function discoverPlugins(opts = {}) {
  if (pluginState.safeMode) {
    pluginState.auto = 'safe';
    emit('plugins-changed');
    return 0;
  }
  if (location.protocol === 'file:') {
    pluginState.auto = 'blocked';
    emit('plugins-changed');
    return 0;
  }
  pluginState.auto = 'checking';
  emit('plugins-changed');
  const found = new Map();
  document.querySelectorAll('link[rel~="mirage-plugin"]').forEach((link) => {
    if (link.href) found.set(link.href, true);
  });

  for (const name of PLUGIN_AUTO_MANIFESTS) {
    const url = new URL(name, location.href).href;
    const text = await fetchPluginText(url);
    if (!text) continue;
    try {
      const data = JSON.parse(text);
      const list = Array.isArray(data) ? data : (Array.isArray(data.plugins) ? data.plugins : []);
      for (const item of list) {
        if (typeof item === 'string') found.set(new URL(item, location.href).href, true);
        else if (item && item.src) found.set(new URL(item.src, location.href).href, item.enabled !== false);
      }
    } catch (err) {}
  }

  await Promise.all(PLUGIN_AUTO_FILES.map(async (name) => {
    const url = new URL(name, location.href).href;
    if (found.has(url)) return;
    const text = await fetchPluginText(url);
    if (text && looksLikePlugin(text, name)) found.set(url, true);
  }));

  let count = 0;
  const added = [];
  for (const [url, enabled] of found) {
    if (pluginState.reloading) break;
    const text = await fetchPluginText(url);
    if (!text || !looksLikePlugin(text, url)) continue;
    try {
      const parsed = parsePluginSource(text, url);
      const manifest = parsed.manifest || {};
      const id = pluginManifestId(manifest, text, url);
      const existing = pluginState.records.get(id);
      if (existing && existing.origin !== 'auto' && existing.origin !== 'embedded') continue;
      const rec = normalizePluginRecord({
        ...(existing || {}),
        id,
        name: manifest.name || (existing && existing.name) || decodeURIComponent(url.split('/').pop() || id),
        version: manifest.version || (existing && existing.version) || '1.0.0',
        author: manifest.author || (existing && existing.author) || '',
        description: manifest.description || (existing && existing.description) || '',
        priority: Number(manifest.priority) || (existing && existing.priority) || 0,
        source: text,
        filename: url,
        origin: 'auto',
        enabled: existing ? existing.enabled : enabled,
        crashes: existing ? existing.crashes : 0,
        createdAt: existing ? existing.createdAt : Date.now()
      });
      await savePluginRecord(rec);
      if (!existing) added.push(rec.id);
      count += 1;
    } catch (err) {}
  }

  pluginState.auto = found.size ? 'ok' : 'none';
  pluginState.autoCount = count;
  emit('plugins-changed');

  if (opts.start && !pluginState.booting && !pluginState.safeMode) {
    for (const id of added) {
      const rec = pluginState.records.get(id);
      if (rec && rec.enabled) await startPlugin(id);
    }
  }
  return count;
}

async function initPlugins() {
  if (!pluginState.hydrated) await hydratePlugins(state.embedded);
  pluginState.safeMode = detectSafeMode();
  pluginState.errors = readPluginErrors();

  const runtimeMarker = readRuntimeMarker();
  let recovered = null;
  if (runtimeMarker && runtimeMarker.id && Date.now() - Number(runtimeMarker.ts || 0) < 120000) {
    const rec = pluginState.records.get(runtimeMarker.id);
    if (rec && rec.enabled) {
      rec.enabled = false;
      rec.crashes = (rec.crashes || 0) + 1;
      rec.lastError = { time: Date.now(), message: '上次运行在插件回调中中断，疑似卡死', phase: 'runtime' };
      await savePluginRecord(rec);
      recovered = rec;
    }
  }
  try { localStorage.removeItem(LS.pluginRuntime); } catch (err) {}

  const marker = readBootMarker();
  if (marker && marker.booting === true && marker.last && Date.now() - Number(marker.ts || 0) < 120000) {
    const rec = pluginState.records.get(marker.last);
    if (rec && rec.enabled) {
      rec.enabled = false;
      rec.crashes = (rec.crashes || 0) + 1;
      rec.lastError = { time: Date.now(), message: '上次启动未完成，疑似崩溃', phase: 'boot' };
      await savePluginRecord(rec);
      recovered = rec;
      const stateNow = readCrashState();
      stateNow.crashes = (Number(stateNow.crashes) || 0) + 1;
      stateNow.lastCrash = { id: rec.id, name: rec.name, ts: Date.now() };
      if (stateNow.crashes >= 2) stateNow.safeMode = true;
      writeCrashState(stateNow);
      pluginState.safeMode = pluginState.safeMode || Boolean(stateNow.safeMode);
    }
  }
  clearBootMarker();

  if (pluginState.safeMode) {
    pluginState.auto = 'safe';
    emit('plugins-changed');
    toastImpl('安全模式：本次启动未加载任何插件', 'warn', {
      duration: 9000,
      action: '插件中心',
      onAction: () => openAppImpl('plugins')
    });
    return;
  }

  const list = [...pluginState.records.values()]
    .filter((rec) => rec.enabled)
    .sort((a, b) => (a.priority || 0) - (b.priority || 0) || (a.createdAt || 0) - (b.createdAt || 0));
  if (!list.length) {
    emit('plugins-changed');
    if (recovered) {
      toastImpl('上次启动因插件「' + recovered.name + '」崩溃，已自动禁用', 'warn', {
        duration: 8000,
        action: '插件中心',
        onAction: () => openAppImpl('plugins')
      });
    }
    return;
  }

  pluginState.booting = true;
  pluginState.bootIds = list.map((rec) => rec.id);
  writeBootMarker({ ts: Date.now(), ids: pluginState.bootIds, last: null, booting: true });
  const watchdog = setTimeout(() => {
    if (!pluginState.booting || pluginState.reloading) return;
    const culprit = pluginState.bootLast;
    pluginState.booting = false;
    if (culprit) disablePlugin(culprit, '启动超时', { reload: true });
    else {
      clearBootMarker();
      toastImpl('插件启动超时，已跳过本次加载', 'warn');
    }
  }, 15000);

  for (const rec of list) {
    if (pluginState.reloading) break;
    pluginState.bootLast = rec.id;
    writeBootMarker({ ts: Date.now(), ids: pluginState.bootIds, last: rec.id, booting: true });
    await startPlugin(rec.id);
  }

  clearTimeout(watchdog);
  pluginState.booting = false;
  if (!pluginState.reloading) {
    writeBootMarker({ ts: Date.now(), ids: pluginState.bootIds, last: null, booting: false });
    setTimeout(() => {
      if (!pluginState.reloading) clearBootMarker();
    }, 3000);
    setTimeout(() => {
      const stateNow = readCrashState();
      if (stateNow.crashes) {
        stateNow.crashes = 0;
        writeCrashState(stateNow);
      }
    }, 15000);
  }
  emit('plugins-changed');
  if (recovered) {
    toastImpl('上次启动因插件「' + recovered.name + '」崩溃，已自动禁用', 'warn', {
      duration: 9000,
      action: '插件中心',
      onAction: () => openAppImpl('plugins')
    });
  }
}

async function installPluginFromEditor(text, filename) {
  if (!String(text || '').trim()) {
    toastImpl('请先写入插件代码', 'warn');
    return null;
  }
  if (!looksLikePlugin(text, filename || 'plugin.html')) {
    const ok = await askConfirm({
      title: '缺少插件标记',
      message: '没有找到 <meta name="mirage-plugin"> 或 Mirage.register()。仍要尝试安装吗？',
      confirmText: '仍然安装',
      danger: true
    });
    if (!ok) return null;
  }
  const parsed = parsePluginSource(text, filename || 'plugin.html');
  const manifest = parsed.manifest || {};
  const id = pluginManifestId(manifest, text, filename || 'plugin.html');
  const existing = pluginState.records.get(id);
  if (existing && pluginState.runtimes.has(id)) await stopPlugin(id);
  const ok = await askConfirm({
    title: existing ? '更新插件' : '安装插件',
    message: '「' + (manifest.name || filename || '未命名插件') + '」\n\n插件拥有完整控制权：可读取与修改全部数据、界面布局和内核行为，不会运行在沙箱中。只安装你信任的代码。' + (existing ? '\n\n已存在同 ID 插件，将覆盖其代码并重新启动。' : ''),
    confirmText: existing ? '覆盖并运行' : '安装并运行',
    danger: true
  });
  if (!ok) return null;
  const rec = await installPluginText(text, filename || 'plugin.html', { origin: 'paste', enabled: true, force: true });
  await startPlugin(rec.id);
  emit('plugins-changed');
  toastImpl('插件「' + rec.name + '」已启用', 'success', {
    duration: 5000,
    action: '插件中心',
    onAction: () => openAppImpl('plugins')
  });
  return rec;
}

async function handlePluginFiles(files) {
  const list = Array.from(files || []);
  for (const file of list) {
    if (!file) continue;
    if (file.size > PLUGIN_MAX_BYTES) {
      toastImpl('「' + file.name + '」超过 2 MB，无法安装', 'warn');
      continue;
    }
    try {
      const text = await readFileText(file);
      if (!looksLikePlugin(text, file.name)) {
        toastImpl('「' + file.name + '」不是插件文件', 'warn');
        continue;
      }
      await installPluginFromEditor(text, file.name);
    } catch (err) {
      console.error(err);
      toastImpl('「' + file.name + '」安装失败', 'error');
    }
  }
}

        '<div class="mk">' + icon('code', 22) + '</div>' +
        '<div><h2>插件中心</h2>' +
          '<p>插件与系统同权：可以新增应用与窗口、改写界面布局、拦截内核函数，甚至替换任何行为。出错时引擎会自动禁用并重置界面。</p></div>' +
        '<div class="skin-state">' +
          '<span class="badge on"><span class="dotmark"></span><span data-plug-count>0 个已启用</span></span>' +
          '<span class="badge" data-plug-auto>尚未检测</span>' +
        '</div>' +
      '</div>' +
      '<div data-plug-safe></div>' +
      '<div class="skin-card">' +
        '<h3>已安装</h3>' +
        '<div class="desc">启用状态、来源与崩溃记录。禁用会立即移除插件注入的样式、图标、应用与钩子。</div>' +
        '<div class="body"><div class="plug-list" data-plug-list></div></div>' +
      '</div>' +
      '<div class="skin-card">' +
        '<h3>安装插件</h3>' +
        '<div class="desc">选择 HTML / JS 文件，或直接粘贴代码。HTML 插件必须包含 <span class="inline-code">meta[name="mirage-plugin"]</span> 清单。</div>' +
        '<div class="body">' +
          '<div class="skin-actions" style="margin-bottom:8px">' +
            '<button class="btn sm" data-plug="pick">' + icon('import', 14) + '选择文件</button>' +
            '<button class="btn sm" data-plug="template">填入模板</button>' +
            '<button class="btn sm" data-plug="download">下载模板</button>' +
            '<button class="btn sm" data-plug="discover">' + icon('refresh', 14) + '刷新自动发现</button>' +
          '</div>' +
          '<textarea class="skin-editor plug-editor" data-plug-editor spellcheck="false" placeholder="粘贴插件 HTML 或 JS…"></textarea>' +
          '<div class="skin-actions" style="margin-top:8px">' +
            '<button class="btn primary" data-plug="install">' + icon('check', 14) + '安装并运行</button>' +
            '<span class="plug-hint">插件不隔离、不沙箱；请只安装可信代码。</span>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="skin-card">' +
        '<h3>崩溃与恢复</h3>' +
        '<div class="desc">启动标记、运行时错误计数与主线程卡顿会被记录。连续崩溃会自动禁用插件；再次失败则进入安全模式。</div>' +
        '<div class="body">' +
          '<div class="skin-actions" style="margin-bottom:10px">' +
            '<button class="btn sm" data-plug="safe">' + icon('alert', 14) + '进入安全模式</button>' +
            '<button class="btn sm danger" data-plug="disable-all">全部禁用并重启</button>' +
            '<button class="btn sm ghost" data-plug="clear-errors">清空错误记录</button>' +
          '</div>' +
          '<div class="plug-log" data-plug-log></div>' +
        '</div>' +
      '</div>' +
      '<div class="skin-card">' +
        '<h3>API 速查</h3>' +
        '<div class="desc">完整规范见同目录 <span class="inline-code">PLUGIN-SPEC.md</span>。插件脚本中通过 <span class="inline-code">Mirage.register({ start(ctx) {...} })</span> 获取上下文。</div>' +
        '<div class="body plug-doc">' +
          '<div class="row"><code>ctx.app({ id, name, icon, render, desktop })</code><span>注册一个出现在开始菜单/桌面上的应用窗口。</span></div>' +
          '<div class="row"><code>ctx.openWindow({ title, html, width, height })</code><span>直接打开一个独立窗口。</span></div>' +
          '<div class="row"><code>ctx.ui.desktopIcon / menuItem / taskbarWidget / settingsSection</code><span>注入桌面图标、右键菜单、任务栏组件与设置区块。</span></div>' +
          '<div class="row"><code>ctx.kernel.override(name, fn)</code><span>拦截 openApp、closeWindow、toast、applySettings 等内核函数，fn(next, ...args)。</span></div>' +
          '<div class="row"><code>ctx.on(event, fn) / ctx.interval / ctx.timeout</code><span>监听系统事件与定时任务，停用时自动清理。</span></div>' +
          '<div class="row"><code>ctx.storage / ctx.css / ctx.mount / ctx.toast / ctx.confirm</code><span>命名空间存储、样式注入、DOM 挂载与交互。</span></div>' +
          '<div class="row"><code>ctx.document</code><span>直接访问 DOM。插件没有沙箱，可修改任何元素与全局对象。</span></div>' +
        '</div>' +
      '</div>' +
    '</div>';

  const listNode = $('[data-plug-list]', root);
  const editor = $('[data-plug-editor]', root);
  const logNode = $('[data-plug-log]', root);
  const safeNode = $('[data-plug-safe]', root);

  const paint = () => {
    const records = [...pluginState.records.values()].sort((a, b) => {
      if (a.enabled !== b.enabled) return a.enabled ? -1 : 1;
      return String(a.name).localeCompare(String(b.name), 'zh-CN');
    });
    $('[data-plug-count]', root).textContent = records.filter((rec) => rec.enabled).length + ' 个已启用';
    $('[data-plug-auto]', root).textContent = pluginAutoLabel();

    safeNode.innerHTML = pluginState.safeMode
      ? '<div class="plug-safe"><div><b>安全模式已开启</b><p>本次启动没有加载任何插件。可以退出安全模式，或先禁用可疑插件再重启。</p></div><div class="acts"><button class="btn sm primary" data-plug="exit-safe">退出安全模式</button></div></div>'
      : '';

    if (!records.length) {
      listNode.innerHTML = '<div class="files-empty" style="padding:24px 12px"><b>还没有插件</b><p>选择一个 HTML 插件文件，或把文件拖进桌面。</p></div>';
    } else {
      listNode.innerHTML = records.map((rec) => {
        const running = pluginState.runtimes.has(rec.id);
        const tags = [
          '<span class="plug-tag ' + (rec.enabled ? 'on' : '') + '">' + (rec.enabled ? (running ? '运行中' : '已启用') : '已禁用') + '</span>',
          '<span class="plug-tag">' + esc(pluginOriginLabel(rec.origin)) + '</span>',
          rec.version ? '<span class="plug-tag">v' + esc(rec.version) + '</span>' : '',
          rec.crashes ? '<span class="plug-tag err">崩溃 ' + rec.crashes + ' 次</span>' : ''
        ].filter(Boolean).join('');
        const errorLine = rec.lastError
          ? '<div class="ds" style="color:#fb7185">最近错误：' + esc(String(rec.lastError.message || '').slice(0, 160)) + '</div>'
          : '';
        const meta = [rec.author ? '作者 ' + rec.author : '', rec.filename ? rec.filename : ''].filter(Boolean).join(' · ');
        return '<div class="plug-row ' + (rec.enabled ? 'on' : '') + '" data-id="' + esc(rec.id) + '">' +
          '<span class="mk">' + icon('code', 16) + '</span>' +
          '<div class="meta">' +
            '<div class="nm">' + esc(rec.name) + tags + '</div>' +
            '<div class="ds">' + esc(rec.description || '没有填写描述') + '</div>' +
            (meta ? '<div class="ds" style="opacity:.72">' + esc(meta) + '</div>' : '') +
            errorLine +
          '</div>' +
          '<div class="acts">' +
            '<button class="btn sm" data-act="toggle">' + (rec.enabled ? '禁用' : '启用') + '</button>' +
            '<button class="btn sm ghost" data-act="reload">重载</button>' +
            '<button class="btn sm danger" data-act="delete">删除</button>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    const errors = pluginState.errors.slice(0, 8);
    logNode.innerHTML = errors.length
      ? errors.map((item) => '<div class="row"><b>' + esc(item.name || item.id) + '</b> · ' + pluginTime(item.time) + ' · ' + esc(String(item.message || '').slice(0, 220)) + '</div>').join('')
      : '<div class="plug-hint">没有错误记录。插件抛出的异常、Promise 拒绝与启动失败都会出现在这里。</div>';
  };

  paint();

  root.addEventListener('click', async (event) => {
    const actionBtn = event.target.closest('[data-plug]');
    if (actionBtn) {
      const action = actionBtn.dataset.plug;
      if (action === 'pick') {
        const input = $('#plugin-input');
        input.value = '';
        input.click();
      } else if (action === 'template') {
        editor.value = buildPluginTemplate();
        editor.focus();
      } else if (action === 'download') {
        downloadTextFile(buildPluginTemplate(), 'plugin-template.html');
      } else if (action === 'install') {
        await installPluginFromEditor(editor.value, 'plugin.html');
        paint();
      } else if (action === 'discover') {
        toastImpl('正在检测同目录插件…', 'info', { duration: 1800 });
        const count = await discoverPlugins({ start: true });
        toastImpl(count ? '已发现并载入 ' + count + ' 个插件' : '没有发现新的插件', count ? 'success' : 'info');
        paint();
      } else if (action === 'safe') {
        const stateNow = readCrashState();
        stateNow.safeMode = true;
        writeCrashState(stateNow);
        scheduleCrashReload(300);
      } else if (action === 'exit-safe') {
        const stateNow = readCrashState();
        stateNow.safeMode = false;
        stateNow.crashes = 0;
        writeCrashState(stateNow);
        stripSafeModeParam();
        scheduleCrashReload(300);
      } else if (action === 'disable-all') {
        const ok = await askConfirm({
          title: '禁用全部插件',
          message: '所有插件都会被禁用，然后重新启动界面。插件注入的样式、图标与钩子会一并移除。',
          confirmText: '全部禁用并重启',
          danger: true
        });
        if (!ok) return;
        for (const rec of pluginState.records.values()) {
          rec.enabled = false;
          await savePluginRecord(rec);
        }
        pluginState.intentionalReload = true;
        location.reload();
      } else if (action === 'clear-errors') {
        pluginState.errors = [];
        savePluginErrors();
        for (const rec of pluginState.records.values()) {
          if (rec.lastError) {
            rec.lastError = null;
            await savePluginRecord(rec);
          }
        }
        paint();
        toastImpl('错误记录已清空', 'success');
      }
      return;
    }

    const row = event.target.closest('.plug-row');
    const actBtn = event.target.closest('[data-act]');
    if (!row || !actBtn) return;
    const rec = pluginState.records.get(row.dataset.id);
    if (!rec) return;
    const act = actBtn.dataset.act;
    if (act === 'toggle') {
      if (rec.enabled) {
        rec.enabled = false;
        await savePluginRecord(rec);
        await stopPlugin(rec.id);
        toastImpl('已禁用「' + rec.name + '」', 'info');
      } else {
        if (pluginState.safeMode) {
          toastImpl('安全模式下不会加载插件，请先退出安全模式', 'warn');
          return;
        }
        rec.enabled = true;
        await savePluginRecord(rec);
        const ok = await startPlugin(rec.id);
        toastImpl(ok ? '已启用「' + rec.name + '」' : '「' + rec.name + '」启动失败', ok ? 'success' : 'error');
      }
      emit('plugins-changed');
      paint();
    } else if (act === 'reload') {
      await stopPlugin(rec.id);
      const ok = await startPlugin(rec.id);
      toastImpl(ok ? '已重载「' + rec.name + '」' : '「' + rec.name + '」重载失败', ok ? 'success' : 'error');
      paint();
    } else if (act === 'delete') {
      const ok = await askConfirm({
        title: '删除插件',
        message: '将删除「' + rec.name + '」的代码与启用状态。插件注入的界面会立即移除，此操作不可撤销。',
        confirmText: '删除',
        danger: true
      });
      if (!ok) return;
      await stopPlugin(rec.id);
      await deletePluginRecord(rec.id);
      emit('plugins-changed');
      paint();
      toastImpl('已删除「' + rec.name + '」', 'success');
    }
  });

  const off = () => bus.removeEventListener('plugins-changed', onChanged);
  const onChanged = () => paint();
  bus.addEventListener('plugins-changed', onChanged);
  return off;
}

/* ---------- 全局 Mirage API ---------- */

function activePluginCtx() {
  const id = pluginState.activeId;
  const runtime = id ? pluginState.runtimes.get(id) : null;
  if (!runtime) throw pluginCtxError('当前没有活动的插件上下文');
  if (!runtime.ctx) runtime.ctx = makePluginCtx(runtime);
  return runtime.ctx;
}

window.Mirage = {
  apiVersion: PLUGIN_API,
  version: VERSION,
  get pluginId() { return pluginState.activeId; },
  register(def) { return registerPluginDef(def); },
  on(type, fn) { return activePluginCtx().on(type, fn); },
  ui: {
    desktopIcon(def) { return activePluginCtx().ui.desktopIcon(def); },
    menuItem(def) { return activePluginCtx().ui.menuItem(def); },
    taskbarWidget(def) { return activePluginCtx().ui.taskbarWidget(def); },
    settingsSection(def) { return activePluginCtx().ui.settingsSection(def); }
  },
  kernel: {
    override(name, fn) { return activePluginCtx().kernel.override(name, fn); },
    restore(name) { return activePluginCtx().kernel.restore(name); },
    list() { return activePluginCtx().kernel.list(); },
    api() { return activePluginCtx().kernel.api(); }
  },
  plugins: {
    list() {
      return [...pluginState.records.values()].map((rec) => {
        const { source, ...meta } = rec;
        return { ...meta, running: pluginState.runtimes.has(rec.id) };
      });
    },
    async enable(id) {
      const rec = pluginState.records.get(id);
      if (!rec) return false;
      rec.enabled = true;
      await savePluginRecord(rec);
      const ok = await startPlugin(id);
      emit('plugins-changed');
      return ok;
    },
    async disable(id) {
      const rec = pluginState.records.get(id);
      if (!rec) return false;
      rec.enabled = false;
      await savePluginRecord(rec);
      await stopPlugin(id);
      emit('plugins-changed');
      return true;
    },
    async reload(id) {
      await stopPlugin(id);
      const ok = await startPlugin(id);
      emit('plugins-changed');
      return ok;
    },
    async uninstall(id) {
      await stopPlugin(id);
      await deletePluginRecord(id);
      emit('plugins-changed');
      return true;
    },
    install(text, filename, options) {
      return installPluginText(text, filename || 'plugin.html', options || {});
    }
  },
  safeMode(value) {
    const stateNow = readCrashState();
    stateNow.safeMode = value !== false;
    if (!stateNow.safeMode) stateNow.crashes = 0;
    writeCrashState(stateNow);
    if (!stateNow.safeMode) stripSafeModeParam();
    scheduleCrashReload(200);
    return stateNow.safeMode;
  },
  utils: { esc, uid, icon, toast: (message, type, opts) => toastImpl(message, type, opts) }
};

pluginBootWatchdog();

function setBootProgress(percent, tip) {
  const fill = $('#boot-fill');
  if (fill) fill.style.width = clamp(percent, 0, 100) + '%';
  if (tip) {
    const node = $('#boot-tip');
    if (node) node.textContent = tip;
  }
}

async function boot() {
  const started = performance.now();
  try {
    settings = loadSettings();
    applySettings();
    bindGlobal();
    setBootProgress(10, '正在读取本机数据…');

    const embedded = await readEmbedded();
    if (embedded && embedded.settings) {
      settings = { ...DEFAULT_SETTINGS, ...embedded.settings };
      if (!WALLPAPERS.some((wp) => wp.id === settings.wallpaper)) settings.wallpaper = DEFAULT_SETTINGS.wallpaper;
      applySettings();
    }
    setBootProgress(32, embedded ? '正在载入内嵌应用…' : '正在初始化桌面环境…');

    await initSkin();
    setBootProgress(40, skinState.css ? '正在套用界面皮肤…' : '正在准备界面…');

    await hydrateApps(embedded);
    setBootProgress(52, '正在读取插件…');
    await hydratePlugins(embedded);
    pluginState.safeMode = detectSafeMode();
    setBootProgress(58, pluginState.safeMode ? '安全模式：跳过插件…' : '正在检测同目录插件…');
    try {
      await discoverPlugins();
    } catch (err) {
      console.error(err);
    }
    setBootProgress(64, '正在绘制窗口与图标…');

    renderDesktopIcons();
    syncTaskbar();
    renderStartApps('');
    startClock();
    setBootProgress(88, embedded ? '已载入 ' + state.apps.size + ' 个应用' : state.apps.size ? '已恢复 ' + state.apps.size + ' 个应用' : '系统就绪');

    await sleep(Math.max(0, 1150 - (performance.now() - started)));
    setBootProgress(100);
    await sleep(330);
    $('#boot').classList.add('done');
    document.body.classList.add('ready');
    state.booted = true;

    if (skinState.auto === 'file') {
      toast('已自动载入同目录皮肤「' + skinState.name + '」', 'success', { duration: 5000 });
    } else if (skinState.auto === 'blocked' && !skinState.css) {
      setTimeout(() => {
        toast('同目录皮肤无法自动读取（本地文件模式），可在「界面皮肤」中手动载入', 'info', { duration: 6500 });
      }, 1400);
    }
    if (pluginState.auto === 'blocked' && !pluginState.records.size) {
      setTimeout(() => {
        toast('同目录插件无法自动读取（本地文件模式），可在「插件中心」手动安装', 'info', { duration: 6500 });
      }, 2100);
    }

    setTimeout(() => {
      initPlugins().catch((err) => {
        console.error(err);
        toast('插件初始化失败：' + (err && err.message ? err.message : String(err)), 'error');
      });
    }, 300);

    let seen = false;
    try { seen = Boolean(localStorage.getItem(LS.seen)); } catch (err) {}
    if (!state.apps.size && !embedded && !seen) {
      setTimeout(() => {
        openApp('welcome');
        try { localStorage.setItem(LS.seen, '1'); } catch (err) {}
      }, 380);
    }
  } catch (err) {
    console.error(err);
    setBootProgress(100, '初始化遇到问题');
    setTimeout(() => {
      $('#boot').classList.add('done');
      document.body.classList.add('ready');
    }, 600);
    toast('初始化失败：' + (err && err.message ? err.message : String(err)), 'error', { duration: 8000 });
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot, { once: true });
} else {
  setTimeout(boot, 60);
}
})();
</script>


<script type="application/json" id="embedded-data">{"app":"mirage-os","version":"2.1.0","exportId":"exp_mvdd877wlxst3","exportedAt":1792300140428,"settings":{"theme":"dark","wallpaper":"aurora","accent":"#6c8cff","motion":true,"wallpaperImage":""},"apps":[],"plugins":[{"id":"com.mirage.demo.hello","name":"插件示例","version":"1.0.0","author":"幻境 OS","description":"演示插件 API：应用窗口、桌面图标、设置区块、右键菜单与内核钩子。","source":"\u003c!DOCTYPE html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"mirage-plugin\" content='{\"id\":\"com.mirage.demo.hello\",\"name\":\"插件示例\",\"version\":\"1.0.0\",\"author\":\"幻境 OS\",\"description\":\"演示插件 API：应用窗口、桌面图标、设置区块、右键菜单与内核钩子。\",\"priority\":10}'>\n\u003cstyle data-mirage-plugin>\n  .hello-app{padding:26px 28px;height:100%;overflow:auto;font-size:12.5px;line-height:1.7;color:var(--ui-text)}\n  .hello-app h2{margin:0;font-size:20px;letter-spacing:-.01em}\n  .hello-app .sub{color:var(--ui-dim);font-size:11.5px;margin-top:5px}\n  .hello-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:18px 0}\n  .hello-stat{border:1px solid var(--ui-border-soft);border-radius:11px;background:var(--ui-elev);padding:11px 12px}\n  .hello-stat b{display:block;font-size:18px;font-weight:600;letter-spacing:-.01em}\n  .hello-stat span{font-size:10.5px;color:var(--ui-dim)}\n  .hello-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}\n  .hello-note{margin-top:16px;padding:10px 12px;border-radius:9px;border:1px solid rgba(var(--ui-accent-rgb),.22);background:rgba(var(--ui-accent-rgb),.07);font-size:11px;color:var(--ui-dim)}\n  .hello-app code{font-family:var(--ui-mono);font-size:10.5px;color:var(--ui-accent)}\n  .hello-badge{position:fixed;right:18px;bottom:calc(var(--ui-taskbar-h) + 18px);z-index:40;padding:7px 11px;border-radius:99px;border:1px solid rgba(var(--ui-accent-rgb),.3);background:rgba(var(--ui-accent-rgb),.12);backdrop-filter:blur(12px);font-size:11px;color:var(--ui-text);pointer-events:none}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cscript data-mirage-plugin>\nMirage.register({\n  id: 'com.mirage.demo.hello',\n  name: '插件示例',\n  version: '1.0.0',\n\n  start(ctx) {\n    const app = ctx.app({\n      id: 'hello',\n      name: '插件示例',\n      sub: '来自 com.mirage.demo.hello',\n      icon: 'spark',\n      desktop: true,\n      w: 760,\n      h: 560,\n      render(root) {\n        const hooks = ctx.kernel.list();\n        const hookCount = Object.values(hooks).reduce((sum, n) => sum + n, 0);\n        root.innerHTML =\n          '\u003cdiv class=\"hello-app\">' +\n            '\u003ch2>这个窗口由插件生成\u003c/h2>' +\n            '\u003cdiv class=\"sub\">插件拥有与系统相同的权限：注册应用、改写 DOM、拦截内核函数、读写本机存储。\u003c/div>' +\n            '\u003cdiv class=\"hello-grid\">' +\n              '\u003cdiv class=\"hello-stat\">\u003cb>' + Object.keys(hooks).length + '\u003c/b>\u003cspan>可拦截的内核函数\u003c/span>\u003c/div>' +\n              '\u003cdiv class=\"hello-stat\">\u003cb>' + hookCount + '\u003c/b>\u003cspan>当前生效的钩子\u003c/span>\u003c/div>' +\n              '\u003cdiv class=\"hello-stat\">\u003cb>' + Mirage.plugins.list().filter((p) => p.running).length + '\u003c/b>\u003cspan>运行中的插件\u003c/span>\u003c/div>' +\n            '\u003c/div>' +\n            '\u003cdiv class=\"hello-note\">试试下面的按钮：它们分别调用内核 API、写入插件命名空间存储、以及弹出系统级通知。\u003c/div>' +\n            '\u003cdiv class=\"hello-actions\">' +\n              '\u003cbutton class=\"btn primary\" data-hello=\"theme\">切换深浅主题\u003c/button>' +\n              '\u003cbutton class=\"btn\" data-hello=\"toast\">弹一条通知\u003c/button>' +\n              '\u003cbutton class=\"btn\" data-hello=\"settings\">打开系统设置\u003c/button>' +\n              '\u003cbutton class=\"btn ghost\" data-hello=\"count\">读取点击次数\u003c/button>' +\n            '\u003c/div>' +\n            '\u003cdiv class=\"hello-note\" data-hello-out>内核 API 已就绪。\u003c/div>' +\n          '\u003c/div>';\n\n        const out = root.querySelector('[data-hello-out]');\n        const say = (text) => { out.textContent = text; };\n        root.querySelector('[data-hello=\"theme\"]').addEventListener('click', () => {\n          const api = ctx.kernel.api();\n          const next = api.getSettings().theme === 'light' ? 'dark' : 'light';\n          api.setSettings({ theme: next });\n          say('主题已切换为 ' + (next === 'light' ? '浅色' : '深色'));\n        });\n        root.querySelector('[data-hello=\"toast\"]').addEventListener('click', () => {\n          ctx.toast('来自插件示例的通知', 'success', { duration: 3200 });\n          say('已调用 ctx.toast()');\n        });\n        root.querySelector('[data-hello=\"settings\"]').addEventListener('click', () => {\n          ctx.kernel.api().openApp('settings');\n          say('已通过内核 API 打开设置');\n        });\n        root.querySelector('[data-hello=\"count\"]').addEventListener('click', () => {\n          const count = (ctx.storage.get('clicks', 0) || 0) + 1;\n          ctx.storage.set('clicks', count);\n          say('插件存储中的点击次数：' + count);\n        });\n      }\n    });\n\n    ctx.ui.menuItem({\n      label: '打开插件示例',\n      icon: 'spark',\n      order: 10,\n      onClick: () => app.open()\n    });\n\n    ctx.ui.settingsSection({\n      id: 'hello',\n      title: '插件示例',\n      desc: '这一段设置区块由插件注入，停用插件后会立即消失。',\n      render(card) {\n        card.innerHTML =\n          '\u003cdiv style=\"display:flex;align-items:center;gap:10px;padding:4px 2px\">' +\n            '\u003cdiv style=\"flex:1\">\u003cdiv style=\"font-size:12px\">插件状态\u003c/div>\u003cdiv style=\"font-size:11px;color:var(--ui-dim);margin-top:2px\">com.mirage.demo.hello · v1.0.0\u003c/div>\u003c/div>' +\n            '\u003cbutton class=\"btn sm\" data-hello-open>打开示例应用\u003c/button>' +\n          '\u003c/div>';\n        card.querySelector('[data-hello-open]').addEventListener('click', () => app.open());\n      }\n    });\n\n    ctx.kernel.override('openApp', (next, key) => {\n      ctx.log('即将打开应用', key);\n      return next(key);\n    });\n\n    ctx.log('插件示例已启动');\n  },\n\n  stop(ctx) {\n    ctx.log('插件示例已停止');\n  }\n});\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","filename":"http://127.0.0.1:8899/plugins/hello.html","priority":10,"enabled":true}]}</script></body></html>
