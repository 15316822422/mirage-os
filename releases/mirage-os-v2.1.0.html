}

function openDB() {
  return new Promise((resolve, reject) => {
    let req;
    try {
      if (!('indexedDB' in window)) throw new Error('IndexedDB unavailable');
      req = indexedDB.open(DB_NAME, 2);
    } catch (err) {
      reject(err);
      return;
    }
    req.onupgradeneeded = () => {
      const database = req.result;
      if (!database.objectStoreNames.contains(DB_STORE)) database.createObjectStore(DB_STORE, { keyPath: 'id' });
      if (!database.objectStoreNames.contains(DB_PLUGIN_STORE)) database.createObjectStore(DB_PLUGIN_STORE, { keyPath: 'id' });
    };
    req.onsuccess = () => {
      db = req.result;
      dbReady = true;
      resolve(db);
    };
    req.onerror = () => reject(req.error || new Error('IndexedDB open failed'));
    req.onblocked = () => reject(new Error('IndexedDB blocked'));
  });
}

function dbAll() {
  return new Promise((resolve, reject) => {
    if (!dbReady || !db) return reject(new Error('no db'));
    const tx = db.transaction(DB_STORE, 'readonly');
    const req = tx.objectStore(DB_STORE).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

function dbPut(app) {
  return new Promise((resolve, reject) => {
    if (!dbReady || !db) return reject(new Error('no db'));
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).put(app);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error || new Error('aborted'));
  });
}

function dbDelete(id) {
  return new Promise((resolve, reject) => {
    if (!dbReady || !db) return reject(new Error('no db'));
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).delete(id);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}

function dbAllPlugins() {
  return new Promise((resolve, reject) => {
    if (!dbReady || !db) return reject(new Error('no db'));
    const tx = db.transaction(DB_PLUGIN_STORE, 'readonly');
    const req = tx.objectStore(DB_PLUGIN_STORE).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

function dbPutPlugin(record) {
  return new Promise((resolve, reject) => {
    if (!dbReady || !db) return reject(new Error('no db'));
    const tx = db.transaction(DB_PLUGIN_STORE, 'readwrite');
    tx.objectStore(DB_PLUGIN_STORE).put(record);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error || new Error('aborted'));
  });
}

function dbDeletePlugin(id) {
  return new Promise((resolve, reject) => {
    if (!dbReady || !db) return reject(new Error('no db'));
    const tx = db.transaction(DB_PLUGIN_STORE, 'readwrite');
    tx.objectStore(DB_PLUGIN_STORE).delete(id);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}

async function persistApp(app) {
  const record = { ...app };
  if (dbReady) {
    try {
      await dbPut(record);
      return true;
    } catch (err) {}
  }
  const all = fallbackRead().filter((item) => item.id !== app.id);
  all.push(record);
  return fallbackWrite(all);
}

async function removePersisted(id) {
  if (dbReady) {
    try { await dbDelete(id); } catch (err) {}
  }
  fallbackWrite(fallbackRead().filter((item) => item.id !== id));
}

async function readEmbedded() {
  const node = document.getElementById('embedded-data');
  if (!node) return null;
  try {
    const data = JSON.parse(node.textContent || 'null');
    if (!data || !Array.isArray(data.apps)) return null;
    return data;
  } catch (err) {
    return null;
  }
}

async function hydrateApps(embedded) {
  try {
    await openDB();
  } catch (err) {
    dbReady = false;
  }

  if (embedded) {
    state.embedded = embedded;
    state.exportId = embedded.exportId || 'embedded';
    for (const raw of embedded.apps) {
      if (!raw || !raw.id || typeof raw.html !== 'string') continue;
      const app = { ...raw, group: state.exportId };
      state.apps.set(app.id, app);
    }
    if (dbReady) {
      try {
        const saved = await dbAll();
        for (const app of saved) {
          if (app.group === state.exportId && !state.apps.has(app.id)) state.apps.set(app.id, app);
        }
      } catch (err) {}
    } else {
      for (const app of fallbackRead()) {
        if (app.group === state.exportId && !state.apps.has(app.id)) state.apps.set(app.id, app);
      }
    }
    return;
  }

  let stored = [];
  if (dbReady) {
    try {
      stored = (await dbAll()).filter((app) => !app.group || app.group === 'local');
    } catch (err) {
      stored = fallbackRead();
    }
  } else {
    stored = fallbackRead();
  }
  for (const app of stored) {
    if (!app || !app.id || typeof app.html !== 'string') continue;
    state.apps.set(app.id, { ...app, group: app.group || 'local' });
  }
}

function taskbarHeight() {
  const raw = getComputedStyle(document.documentElement).getPropertyValue('--taskbar-h');
  return parseFloat(raw) || 58;
}

function workArea() {
  return { x: 0, y: 0, w: window.innerWidth, h: Math.max(240, window.innerHeight - taskbarHeight()) };
}

function snapGap() {
  return window.innerWidth < 560 ? 6 : 8;
}

function maxRect() {
  const wa = workArea();
  const g = snapGap();
  return { x: g, y: g, w: Math.max(240, wa.w - g * 2), h: Math.max(180, wa.h - g * 2) };
}

function makeArt(opts = {}) {
  const el = document.createElement('span');
  el.className = opts.className || 'art';
  const key = opts.key || '';
  const name = opts.name || '';
  const size = opts.size || 36;
  const hue = opts.g1 ? hexHue(opts.g1) : hashHue(key + name);
  el.style.setProperty('--h', String(hue));
  el.style.setProperty('--g1', opts.g1 || 'hsl(' + hue + ' 72% 62%)');
  el.style.setProperty('--g2', opts.g2 || 'hsl(' + ((hue + 46) % 360) + ' 68% 46%)');
  if (opts.svg) {
    el.innerHTML = icon(opts.svg, Math.round(size * 0.48));
  } else {
    const letter = document.createElement('span');
    letter.className = 'letter';
    letter.style.fontSize = Math.round(size * 0.42) + 'px';
    letter.textContent = initialOf(name);
    el.appendChild(letter);
  }
  if (opts.icon) {
    const img = document.createElement('img');
    img.alt = '';
    img.decoding = 'async';
    img.onerror = () => img.remove();
    img.src = opts.icon;
    el.appendChild(img);
  }
  return el;
}

function resolveApp(key) {
  if (key.startsWith('app.')) {
    const app = state.apps.get(key.slice(4));
    if (!app) return null;
    return { key, type: 'imported', app };
  }
  if (key.startsWith('plugin.')) {
    const entry = pluginState.apps.get(key);
    if (!entry) return null;
    return { key, type: 'builtin', app: entry.app, pluginId: entry.pluginId };
  }
  const builtin = BUILTINS[key];
  if (!builtin) return null;
  return { key, type: 'builtin', app: builtin };
}

function windowTitleArt(def) {
  if (def.type === 'builtin') {
    const app = def.app;
    return makeArt({ key: app.id, name: app.name, svg: app.icon, g1: app.g1, g2: app.g2, size: 18, className: 't-art' });
  }
  return makeArt({ key: def.app.id, name: def.app.name, icon: def.app.icon, size: 18, className: 't-art' });
}

function updateMaxButton(win) {
  const btn = $('[data-role="max"]', win.el);
  if (!btn) return;
  const isMax = win.max;
  btn.innerHTML = icon(isMax ? 'restore' : 'maximize', 14);
  btn.title = isMax ? '还原' : '最大化';
}

function setBounds(win, rect, animate) {
  win.rect = { x: Math.round(rect.x), y: Math.round(rect.y), w: Math.round(rect.w), h: Math.round(rect.h) };
  if (animate) win.el.classList.add('anim');
  win.el.style.left = win.rect.x + 'px';
  win.el.style.top = win.rect.y + 'px';
  win.el.style.width = win.rect.w + 'px';
  win.el.style.height = win.rect.h + 'px';
  if (animate) setTimeout(() => win.el.classList.remove('anim'), 360);
}

function focusWindow(win) {
  if (!win || win.minimized) return;
  state.zTop += 1;
  win.el.style.zIndex = String(state.zTop);
  if (state.activeKey === win.key) return;
  for (const other of state.windows.values()) other.el.classList.toggle('active', other === win);
  state.activeKey = win.key;
  syncTaskbar();
}

function openAppImpl(key) {
  const def = resolveApp(key);
  if (!def) {
    toast('应用不存在或已被移除', 'error');
    return;
  }
  const existing = state.windows.get(key);
  if (existing) {
    if (existing.minimized) restoreWindow(existing);
    else focusWindow(existing);
    return;
  }

  const wa = workArea();
  const base = def.type === 'builtin' ? def.app : { w: 940, h: 640 };
  let width = Math.min(base.w || 900, Math.max(320, wa.w - 24));
  let height = Math.min(base.h || 600, Math.max(220, wa.h - 24));
  const count = state.windows.size;
  let x = Math.round((wa.w - width) / 2) + (count % 5) * 26 - 52;
  let y = Math.round((wa.h - height) / 2) + (count % 5) * 20 - 40;
  if (window.innerWidth < 720) {
    x = 6;
    y = 6;
    width = Math.max(280, wa.w - 12);
    height = Math.max(200, wa.h - 12);
  }
  x = clamp(x, 8, Math.max(8, wa.w - width - 8));
  y = clamp(y, 8, Math.max(8, wa.h - height - 8));

  const title = def.app.name;
  const el = document.createElement('section');
  el.className = 'win opening';
  el.dataset.key = key;
  el.setAttribute('role', 'dialog');
  el.setAttribute('aria-label', title);

  const bar = document.createElement('header');
  bar.className = 'win-titlebar';
  const titleWrap = document.createElement('div');
  titleWrap.className = 'win-title';
  titleWrap.appendChild(windowTitleArt(def));
  const titleText = document.createElement('span');
  titleText.className = 't-name';
  titleText.textContent = title;
  titleWrap.appendChild(titleText);
  bar.appendChild(titleWrap);

  const controls = document.createElement('div');
  controls.className = 'win-controls';
  const minBtn = document.createElement('button');
  minBtn.className = 'win-btn';
  minBtn.dataset.role = 'min';
  minBtn.title = '最小化';
  minBtn.setAttribute('aria-label', '最小化');
  minBtn.innerHTML = icon('minimize', 14);
  const maxBtn = document.createElement('button');
  maxBtn.className = 'win-btn';
  maxBtn.dataset.role = 'max';
  maxBtn.title = '最大化';
  maxBtn.setAttribute('aria-label', '最大化');
  maxBtn.innerHTML = icon('maximize', 14);
  const closeBtn = document.createElement('button');
  closeBtn.className = 'win-btn close';
  closeBtn.dataset.role = 'close';
  closeBtn.title = '关闭';
  closeBtn.setAttribute('aria-label', '关闭');
  closeBtn.innerHTML = icon('close', 14);
  controls.append(minBtn, maxBtn, closeBtn);
  bar.appendChild(controls);
  el.appendChild(bar);

  const body = document.createElement('div');
  body.className = 'win-body';
  el.appendChild(body);

  for (const dir of ['n', 's', 'e', 'w', 'ne', 'nw', 'se', 'sw']) {
    const handle = document.createElement('div');
    handle.className = 'rz';
    handle.dataset.dir = dir;
    el.appendChild(handle);
  }

  const win = {
    key,
    type: def.type,
    def,
    app: def.app,
    el,
    titleEl: titleText,
    bodyEl: body,
    rect: { x, y, w: width, h: height },
    restoreRect: null,
    max: false,
    minimized: false,
    created: Date.now(),
    dispose: null,
    iframe: null,
    closing: false
  };

  setBounds(win, win.rect, false);
  $('#windows').appendChild(el);
  state.windows.set(key, win);
  focusWindow(win);

  if (def.type === 'builtin') {
    const root = document.createElement('div');
    root.className = 'app';
    root.dataset.app = key;
    body.appendChild(root);
    try {
      const result = def.app.render(root, win);
      if (typeof result === 'function') win.dispose = result;
    } catch (err) {
      console.error(err);
      root.innerHTML = '<div class="files-empty"><b>应用加载失败</b><p>' + esc(err && err.message ? err.message : String(err)) + '</p></div>';
    }
  } else {
    const loader = document.createElement('div');
    loader.className = 'win-loader';
    loader.innerHTML = '<div class="spinner"></div>';
    body.appendChild(loader);
    const frame = document.createElement('iframe');
    frame.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-downloads allow-pointer-lock allow-popups-to-escape-sandbox');
    frame.setAttribute('title', title);
    frame.srcdoc = def.app.html;
    win.iframe = frame;
    body.appendChild(frame);
    let hidden = false;
    const hideLoader = () => {
      if (hidden) return;
      hidden = true;
      loader.classList.add('hide');
      setTimeout(() => loader.remove(), 320);
    };
    frame.addEventListener('load', () => setTimeout(hideLoader, 80), { once: true });
    setTimeout(hideLoader, 5000);
  }

  el.addEventListener('pointerdown', () => focusWindow(win), true);
  bar.addEventListener('pointerdown', (event) => startDrag(win, event));
  bar.addEventListener('dblclick', (event) => {
    if (event.target.closest('button')) return;
    toggleMaximize(win);
  });
  minBtn.addEventListener('click', () => minimizeWindow(win));
  maxBtn.addEventListener('click', () => toggleMaximize(win));
  closeBtn.addEventListener('click', () => closeWindow(win));
  for (const handle of $$('.rz', el)) handle.addEventListener('pointerdown', (event) => startResize(win, event, handle.dataset.dir));

  setTimeout(() => {
    el.classList.remove('opening');
    if (win.rect.w > 340 && win.rect.h > 260 && !win.max) setBounds(win, win.rect, false);
  }, 320);

  syncTaskbar();
  syncStartResults();
  emit('app-opened', { key, def, win });
  return win;
}

function closeWindowImpl(win) {
  if (!win || win.closing) return;
  win.closing = true;
  if (typeof win.dispose === 'function') {
    try { win.dispose(); } catch (err) {}
  }
  if (win.iframe) {
    try { win.iframe.srcdoc = ''; } catch (err) {}
  }
  win.el.classList.add('closing');
  setTimeout(() => {
    win.el.remove();
    state.windows.delete(win.key);
    if (state.activeKey === win.key) {
      state.activeKey = null;
      let top = null;
      for (const other of state.windows.values()) {
        if (other.minimized) continue;
        if (!top || other.el.style.zIndex > top.el.style.zIndex) top = other;
      }
      if (top) focusWindow(top);
    }
    syncTaskbar();
    syncStartResults();
    emit('app-closed', { key: win.key, win });
  }, 170);
}

function toggleMaximize(win) {
  if (!win || win.minimized) return;
  const wa = workArea();
  if (win.max) {
    win.max = false;
    win.el.classList.remove('max');
    setBounds(win, win.restoreRect || { x: 80, y: 80, w: Math.min(880, wa.w - 120), h: Math.min(600, wa.h - 120) }, true);
    updateMaxButton(win);
  } else {
    win.restoreRect = { ...win.rect };
    win.max = true;
    win.el.classList.add('max');
    setBounds(win, maxRect(), true);
    updateMaxButton(win);
  }
  focusWindow(win);
}

function minimizeWindow(win) {
  if (!win || win.minimized) return;
  const from = win.el.getBoundingClientRect();
  const selector = '.tb-btn[data-key="' + String(win.key).replace(/"/g, '\\"') + '"]';
  const button = document.querySelector(selector);
  win.minimized = true;
  if (state.activeKey === win.key) state.activeKey = null;
  for (const other of state.windows.values()) other.el.classList.remove('active');
  syncTaskbar();
  const finish = () => {
    win.el.style.display = 'none';
    win.el.style.transform = '';
    win.el.style.opacity = '';
  };
  if (button) {
    const to = button.getBoundingClientRect();
    const dx = (to.left + to.width / 2) - (from.left + from.width / 2);
    const dy = (to.top + to.height / 2) - (from.top + from.height / 2);
    const anim = win.el.animate([
      { transform: 'translate(0,0) scale(1)', opacity: 1 },
      { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(.14)', opacity: 0 }
    ], { duration: 260, easing: 'cubic-bezier(.4,0,.2,1)' });
    anim.onfinish = finish;
  } else {
    setTimeout(finish, 150);
  }
}

function restoreWindow(win) {
  if (!win || !win.minimized) {
    if (win) focusWindow(win);
    return;
  }
  win.el.getAnimations().forEach((anim) => anim.cancel());
  win.minimized = false;
  win.el.style.display = '';
  focusWindow(win);
  const selector = '.tb-btn[data-key="' + String(win.key).replace(/"/g, '\\"') + '"]';
  const button = document.querySelector(selector);
  if (button) {
    const to = win.el.getBoundingClientRect();
    const from = button.getBoundingClientRect();
    const dx = (from.left + from.width / 2) - (to.left + to.width / 2);
    const dy = (from.top + from.height / 2) - (to.top + to.height / 2);
    win.el.animate([
      { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(.14)', opacity: 0 },
      { transform: 'translate(0,0) scale(1)', opacity: 1 }
    ], { duration: 260, easing: 'cubic-bezier(.16,1,.3,1)' });
  }
  syncTaskbar();
}

function detectSnap(px, py) {
  const wa = workArea();
  const g = snapGap();
  if (py <= 12) return { type: 'max', ...maxRect() };
  const halfW = Math.max(240, Math.round((wa.w - g * 3) / 2));
  if (px <= 12) return { type: 'left', x: g, y: g, w: halfW, h: Math.max(180, wa.h - g * 2) };
  if (px >= window.innerWidth - 12) return { type: 'right', x: wa.w - g - halfW, y: g, w: halfW, h: Math.max(180, wa.h - g * 2) };
  return null;
}

function showSnap(rect) {
  const preview = $('#snap-preview');
  if (!rect) {
    preview.classList.remove('show');
    return;
  }
  preview.style.left = rect.x + 'px';
  preview.style.top = rect.y + 'px';
  preview.style.width = rect.w + 'px';
  preview.style.height = rect.h + 'px';
  preview.classList.add('show');
}

function hideSnap() {
  $('#snap-preview').classList.remove('show');
}

function startDrag(win, event) {
  if (event.button !== undefined && event.button !== 0) return;
  if (event.target.closest('button')) return;
  event.preventDefault();
  focusWindow(win);
  const wa = workArea();
  const pointerId = event.pointerId;
  const startX = event.clientX;
  const startY = event.clientY;
  let base = { ...win.rect };
  const preDrag = { ...win.rect };

  if (win.max) {
    const ratio = clamp((event.clientX - win.rect.x) / Math.max(1, win.rect.w), 0, 1);
    const target = win.restoreRect || { w: Math.min(900, wa.w - 120), h: Math.min(620, wa.h - 120) };
    const width = Math.min(target.w, wa.w - 24);
    const height = Math.min(target.h, wa.h - 24);
    const x = clamp(event.clientX - width * ratio, 8, Math.max(8, wa.w - width - 8));
    win.max = false;
    win.el.classList.remove('max');
    updateMaxButton(win);
    setBounds(win, { x, y: 8, w: width, h: height }, false);
    base = { x, y: 8, w: width, h: height };
  }

  win.el.classList.add('dragging');
  document.body.classList.add('is-dragging');
  $('#drag-shield').classList.add('on');
  let dx = 0;
  let dy = 0;
  let moved = false;
  let raf = 0;
  let snap = null;

  const render = () => {
    raf = 0;
    win.el.style.transform = 'translate3d(' + dx + 'px,' + dy + 'px,0)';
  };

  const onMove = (ev) => {
    if (ev.pointerId !== pointerId) return;
    dx = ev.clientX - startX;
    dy = ev.clientY - startY;
    if (!moved && Math.hypot(dx, dy) > 3) moved = true;
    if (!moved) return;
    if (!raf) raf = requestAnimationFrame(render);
    snap = detectSnap(ev.clientX, ev.clientY);
    showSnap(snap);
  };

  const finish = (ev) => {
    if (ev && ev.pointerId !== pointerId) return;
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', finish);
    window.removeEventListener('pointercancel', finish);
    if (raf) cancelAnimationFrame(raf);
    win.el.classList.remove('dragging');
    document.body.classList.remove('is-dragging');
    $('#drag-shield').classList.remove('on');
    hideSnap();
    if (snap) {
      win.el.style.transform = '';
      if (!win.max) win.restoreRect = { ...preDrag };
      setBounds(win, snap, true);
      if (snap.type === 'max') {
        win.max = true;
        win.el.classList.add('max');
        updateMaxButton(win);
      }
    } else if (moved) {
      const nx = clamp(base.x + dx, -base.w + 140, wa.w - 140);
      const ny = clamp(base.y + dy, 0, Math.max(0, wa.h - 46));
      win.el.style.transform = '';
      setBounds(win, { x: nx, y: ny, w: base.w, h: base.h }, false);
    } else {
      win.el.style.transform = '';
    }
    snap = null;
  };

  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', finish);
  window.addEventListener('pointercancel', finish);
}

function startResize(win, event, dir) {
  if (event.button !== undefined && event.button !== 0) return;
  if (win.max || win.minimized) return;
  event.preventDefault();
  event.stopPropagation();
  focusWindow(win);
  const start = { ...win.rect };
  const startX = event.clientX;
  const startY = event.clientY;
  const pointerId = event.pointerId;
  const wa = workArea();
  const minW = Math.min(340, Math.max(260, wa.w - 40));
  const minH = Math.min(220, Math.max(180, wa.h - 40));
  let raf = 0;
  let current = { ...start };
  document.body.classList.add('is-resizing');
  $('#drag-shield').classList.add('on');

  const apply = () => {
    raf = 0;
    win.el.style.left = current.x + 'px';
    win.el.style.top = current.y + 'px';
    win.el.style.width = current.w + 'px';
    win.el.style.height = current.h + 'px';
    win.rect = { ...current };
  };

  const onMove = (ev) => {
    if (ev.pointerId !== pointerId) return;
    const dx = ev.clientX - startX;
    const dy = ev.clientY - startY;
    let x = start.x;
    let y = start.y;
    let w = start.w;
    let h = start.h;
    if (dir.includes('e')) w = Math.max(minW, start.w + dx);
    if (dir.includes('s')) h = Math.max(minH, start.h + dy);
    if (dir.includes('w')) {
      w = Math.max(minW, start.w - dx);
      x = start.x + (start.w - w);
    }
    if (dir.includes('n')) {
      h = Math.max(minH, start.h - dy);
      y = start.y + (start.h - h);
    }
    if (dir.includes('w') || dir.includes('n')) {
      x = Math.min(x, wa.w - minW);
      y = Math.min(y, wa.h - minH);
    }
    current = { x, y, w, h };
    if (!raf) raf = requestAnimationFrame(apply);
  };

  const finish = (ev) => {
    if (ev && ev.pointerId !== pointerId) return;
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', finish);
    window.removeEventListener('pointercancel', finish);
    if (raf) cancelAnimationFrame(raf);
    document.body.classList.remove('is-resizing');
    $('#drag-shield').classList.remove('on');
    current.x = Math.max(-current.w + 140, Math.min(current.x, wa.w - 120));
    current.y = Math.max(0, Math.min(current.y, wa.h - 46));
    apply();
  };

  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', finish);
  window.addEventListener('pointercancel', finish);
}

function syncWindowTitles() {
  for (const win of state.windows.values()) {
    if (win.type === 'imported') {
      const app = state.apps.get(win.key.slice(4));
      if (!app) continue;
      win.app = app;
      win.titleEl.textContent = app.name;
      win.el.setAttribute('aria-label', app.name);
      if (win.iframe) win.iframe.setAttribute('title', app.name);
      const art = win.el.querySelector('.win-title .t-art');
      if (art) art.replaceWith(makeArt({ key: app.id, name: app.name, icon: app.icon, size: 18, className: 't-art' }));
    }
  }
}

function clampAllWindows() {
  const wa = workArea();
  for (const win of state.windows.values()) {
    if (win.minimized) continue;
    if (win.max) {
      setBounds(win, maxRect(), false);
      continue;
    }
    const width = clamp(win.rect.w, 280, Math.max(280, wa.w - 8));
    const height = clamp(win.rect.h, 180, Math.max(180, wa.h - 8));
    const x = clamp(win.rect.x, -width + 140, Math.max(4, wa.w - 140));
    const y = clamp(win.rect.y, 0, Math.max(0, wa.h - 46));
    setBounds(win, { x, y, w: width, h: height }, false);
  }
}

let resizeRaf = 0;
window.addEventListener('resize', () => {
  if (resizeRaf) cancelAnimationFrame(resizeRaf);
  resizeRaf = requestAnimationFrame(() => {
    resizeRaf = 0;
    clampAllWindows();
  });
});

const PINNED = ['files', 'settings'];

function taskbarDef(key) {
  const def = resolveApp(key);
  return def ? def.app : null;
}

function syncTaskbar() {
  const tasks = $('#tb-tasks');
  if (!tasks) return;
  tasks.innerHTML = '';
  const keys = [...PINNED];
  for (const win of state.windows.values()) {
    if (!keys.includes(win.key)) keys.push(win.key);
  }
  for (const key of keys) {
    const app = taskbarDef(key);
    if (!app) continue;
    const win = state.windows.get(key);
    const btn = document.createElement('button');
    btn.className = 'tb-btn' + (win ? ' running' : '') + (state.activeKey === key ? ' active' : '');
    btn.dataset.key = key;
    btn.title = app.name;
    btn.setAttribute('aria-label', app.name);
    if (key.startsWith('app.')) {
      btn.appendChild(makeArt({ key: app.id, name: app.name, icon: app.icon, size: 26, className: 'tb-glyph' }));
    } else {
      btn.appendChild(makeArt({ key: app.id, name: app.name, svg: app.icon, g1: app.g1, g2: app.g2, size: 26, className: 'tb-glyph' }));
    }
    btn.addEventListener('click', () => {
      closeStart();
      const current = state.windows.get(key);
      if (current) {
        if (current.minimized) restoreWindow(current);
        else if (state.activeKey === key) minimizeWindow(current);
        else focusWindow(current);
      } else {
        openApp(key);
      }
    });
    tasks.appendChild(btn);
  }
  $('#start-btn').classList.toggle('active', state.startOpen);
  $('#start-btn').setAttribute('aria-expanded', state.startOpen ? 'true' : 'false');
}

function renderDesktopIconsImpl(animateKey) {
  const container = $('#desktop-icons');
  if (!container) return;
  container.innerHTML = '';
  const entries = [];
  for (const key of ['files', 'skin', 'plugins', 'notes', 'settings']) {
    const app = BUILTINS[key];
    if (app) entries.push({ key, type: 'builtin', app });
  }
  const imported = [...state.apps.values()].sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  for (const app of imported) entries.push({ key: 'app.' + app.id, type: 'imported', app });
  for (const icon of pluginState.icons) entries.push({ ...icon, type: 'plugin-icon', app: { id: icon.id, name: icon.name, icon: icon.icon } });

  const activate = (entry) => {
    if (entry.type === 'plugin-icon') {
      if (typeof entry.onOpen === 'function') {
        try { entry.onOpen(); } catch (err) { pluginError(entry.pluginId, err); }
      } else if (entry.appKey) {
        openApp(entry.appKey);
      }
      return;
    }
    openApp(entry.key);
  };

  entries.forEach((entry, index) => {
    const btn = document.createElement('button');
    btn.className = 'd-icon';
    btn.dataset.key = entry.key;
    btn.title = entry.type === 'imported' ? entry.app.filename : entry.app.name;
    btn.style.setProperty('--i', String(Math.min(index, 12)));
    if (animateKey && entry.key === animateKey) btn.style.animation = 'iconIn .45s var(--ease-out)';
    if (entry.type === 'plugin-icon') {
      btn.appendChild(makeArt({ key: entry.id, name: entry.name, svg: entry.icon, g1: entry.g1, g2: entry.g2, size: 46, className: 'd-icon-art' }));
    } else if (entry.type === 'builtin') {
      btn.appendChild(makeArt({ key: entry.app.id, name: entry.app.name, svg: entry.app.icon, g1: entry.app.g1, g2: entry.app.g2, size: 46, className: 'd-icon-art' }));
    } else {
      btn.appendChild(makeArt({ key: entry.app.id, name: entry.app.name, icon: entry.app.icon, size: 46, className: 'd-icon-art' }));
    }
    const label = document.createElement('span');
    label.className = 'd-icon-label';
    label.textContent = entry.app.name;
    btn.appendChild(label);

    btn.addEventListener('click', () => {
      selectIcon(entry.key, btn);
      if (window.matchMedia('(pointer: coarse)').matches) activate(entry);
    });
    btn.addEventListener('dblclick', () => activate(entry));
    btn.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        activate(entry);
      }
    });
    btn.addEventListener('contextmenu', (event) => {
      event.preventDefault();
      event.stopPropagation();
      selectIcon(entry.key, btn);
      showIconMenu(entry, event.clientX, event.clientY);
    });
    container.appendChild(btn);
  });
  state.selectedIcon = null;
}

function selectIcon(key, el) {
  state.selectedIcon = key;
  $$('.d-icon', $('#desktop-icons')).forEach((node) => node.classList.toggle('sel', node === el));
}

function clearIconSelection() {
  state.selectedIcon = null;
  $$('.d-icon.sel', $('#desktop-icons')).forEach((node) => node.classList.remove('sel'));
}

function launchableApps() {
  const order = ['files', 'skin', 'plugins', 'notes', 'settings', 'welcome', 'about'];
  const items = [];
  for (const key of order) {
    const app = BUILTINS[key];
    if (app) items.push({ key, type: 'builtin', app });
  }
  const imported = [...state.apps.values()].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  for (const app of imported) items.push({ key: 'app.' + app.id, type: 'imported', app });
  for (const [key, entry] of pluginState.apps) {
    if (!entry.app.hidden) items.push({ key, type: 'builtin', app: entry.app });
  }
  return items;
}

function renderStartAppsImpl(query) {
  const grid = $('#start-apps');
  if (!grid) return;
  const q = String(query || '').trim().toLowerCase();
  const items = launchableApps();
  const filtered = q
    ? items.filter((item) => {
        const haystack = (item.app.name + ' ' + (item.app.filename || '') + ' ' + (item.app.sub || '')).toLowerCase();
        return haystack.includes(q);
      })
    : items;
  grid.innerHTML = '';
  for (const item of filtered) {
    const btn = document.createElement('button');
    btn.className = 'start-app';
    btn.dataset.key = item.key;
    btn.title = item.type === 'imported' ? item.app.filename : item.app.name;
    if (item.type === 'builtin') {
      btn.appendChild(makeArt({ key: item.app.id, name: item.app.name, svg: item.app.icon, g1: item.app.g1, g2: item.app.g2, size: 36 }));
    } else {
      btn.appendChild(makeArt({ key: item.app.id, name: item.app.name, icon: item.app.icon, size: 36 }));
    }
    const txt = document.createElement('span');
    txt.className = 'txt';
    const nm = document.createElement('span');
    nm.className = 'nm';
    nm.textContent = item.app.name;
    const sb = document.createElement('span');
    sb.className = 'sb';
    sb.textContent = item.type === 'imported' ? (item.app.filename || '网页应用') : (item.app.sub || '内置应用');
    txt.append(nm, sb);
    btn.appendChild(txt);
    btn.addEventListener('click', () => {
      closeStart();
      openApp(item.key);
    });
    grid.appendChild(btn);
  }
  $('#start-empty').hidden = filtered.length > 0;
  const count = state.apps.size + pluginState.apps.size;
  $('#start-count').textContent = count ? count + ' 个应用' : '尚未导入应用';
}

function syncStartResults() {
  renderStartApps($('#start-search').value);
}

function openStart(focusSearch) {
  if (state.startOpen) return;
  if (!$('#start').classList.contains('open')) {
    renderStartApps('');
    $('#start-search').value = '';
  }
  state.startOpen = true;
  $('#start').classList.add('open');
  $('#start').setAttribute('aria-hidden', 'false');
  $('#start-btn').classList.add('active');
  $('#start-btn').setAttribute('aria-expanded', 'true');
  if (focusSearch && !window.matchMedia('(pointer: coarse)').matches) {
    setTimeout(() => $('#start-search').focus(), 120);
  }
}

function closeStart() {
  if (!state.startOpen) return;
  state.startOpen = false;
  $('#start').classList.remove('open');
  $('#start').setAttribute('aria-hidden', 'true');
  $('#start-btn').classList.remove('active');
  $('#start-btn').setAttribute('aria-expanded', 'false');
}

function showMenuImpl(items, x, y) {
  const ctx = $('#ctx');
  ctx.innerHTML = '';
  for (const item of items) {
    if (item.sep) {
      const sep = document.createElement('div');
      sep.className = 'ctx-sep';
      ctx.appendChild(sep);
      continue;
    }
    const btn = document.createElement('button');
    btn.className = 'ctx-item' + (item.danger ? ' danger' : '');

    if (item.icon) {
      const ci = document.createElement('span');
      ci.className = 'ci';
      ci.innerHTML = icon(item.icon, 15);
      btn.appendChild(ci);
    }
    const label = document.createElement('span');
    label.textContent = item.label;
    btn.appendChild(label);
    btn.addEventListener('click', () => {
      closeMenu();
      if (typeof item.onClick === 'function') item.onClick();
    });
    ctx.appendChild(btn);
  }
  ctx.style.left = '0px';
  ctx.style.top = '0px';
  ctx.classList.add('open');

  const height = ctx.offsetHeight;
  ctx.style.left = clamp(x, 8, Math.max(8, window.innerWidth - width - 8)) + 'px';
  ctx.style.top = clamp(y, 8, Math.max(8, window.innerHeight - height - 8)) + 'px';

function showDialog(options) {
  const layer = $('#modal-layer');
  const modal = $('#modal');
  const onEsc = (event) => {
    if (event.key === 'Escape') {
      event.stopPropagation();
      cancel();
    }
  };
  let finished = false;
  const close = () => {
    if (finished) return;
    finished = true;
    layer.classList.remove('open');
    layer.setAttribute('aria-hidden', 'true');
    modal.innerHTML = '';
    document.removeEventListener('keydown', onEsc, true);
  };
  const cancel = () => {
    if (finished) return;
    close();
    if (typeof options.onCancel === 'function') options.onCancel();
  };

  modal.innerHTML = '';
  const dialog = document.createElement('div');
  dialog.className = 'dialog';
  dialog.setAttribute('role', 'dialog');
  dialog.setAttribute('aria-modal', 'true');
  const heading = document.createElement('h3');
  heading.textContent = options.title || '提示';
  dialog.appendChild(heading);
  if (options.message) {
    const p = document.createElement('p');
    p.textContent = options.message;
    dialog.appendChild(p);
  }
  let input = null;
  if (options.input) {
    input = document.createElement('input');
    input.type = 'text';
    input.value = options.value || '';
    input.placeholder = options.placeholder || '';
    input.spellcheck = false;
    input.autocomplete = 'off';
    dialog.appendChild(input);
  }
  const actions = document.createElement('div');
  actions.className = 'dialog-actions';
  if (options.cancelText !== null) {
    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn ghost';
    cancelBtn.textContent = options.cancelText || '取消';
    cancelBtn.addEventListener('click', cancel);
    actions.appendChild(cancelBtn);
  }
  const confirmBtn = document.createElement('button');
  confirmBtn.className = 'btn ' + (options.danger ? 'danger' : 'primary');
  confirmBtn.textContent = options.confirmText || '确定';
  actions.appendChild(confirmBtn);
  dialog.appendChild(actions);
  modal.appendChild(dialog);

  const submit = () => {
    const value = input ? input.value : undefined;
    if (input && options.required && !input.value.trim()) {
      input.focus();
      return;
    }
    const result = typeof options.onConfirm === 'function' ? options.onConfirm(value) : undefined;
    if (result === false) return;
    close();
  };
  confirmBtn.addEventListener('click', submit);
  if (input) {
    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        submit();
      }
    });
  }
  layer.setAttribute('aria-hidden', 'false');
  layer.classList.add('open');
  document.addEventListener('keydown', onEsc, true);
  layer.onclick = (event) => {
    if (event.target === layer) cancel();
  };
  setTimeout(() => {
    if (input) {
      input.focus();
      input.select();
      dialog.animate([
        { transform: 'translateY(10px) scale(.98)' },
        { transform: 'translateY(-2px) scale(1.002)' },
        { transform: 'none' }
      ], { duration: 260, easing: 'cubic-bezier(.16,1,.3,1)' });
    } else {
      confirmBtn.focus();
    }
  }, 40);
  return close;
}

function askConfirm(opts) {
  return new Promise((resolve) => {
    showDialog({
      title: opts.title,
      message: opts.message,
      confirmText: opts.confirmText || '确定',
      cancelText: opts.cancelText || '取消',
      danger: opts.danger,
      onConfirm: () => resolve(true),
      onCancel: () => resolve(false)
    });
  });
}

function askText(opts) {
  return new Promise((resolve) => {
    showDialog({
      title: opts.title,
      message: opts.message,
      input: true,
      required: true,
      value: opts.value || '',
      placeholder: opts.placeholder || '',
      confirmText: opts.confirmText || '确定',
      onConfirm: (value) => resolve(String(value || '').trim()),
      onCancel: () => resolve(null)
    });
  });
}

function toastImpl(message, type = 'info', opts = {}) {
  const container = $('#toasts');
  if (!container) return;
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const ic = document.createElement('span');
  ic.className = 't-ic';
  ic.innerHTML = icon(type === 'success' ? 'check' : type === 'error' || type === 'warn' ? 'alert' : 'info', 15);
  const msg = document.createElement('span');
  msg.className = 't-msg';
  msg.textContent = String(message);
  el.append(ic, msg);
  if (opts.action && typeof opts.onAction === 'function') {
    const action = document.createElement('button');
    action.className = 't-act';
    action.textContent = opts.action;
    action.addEventListener('click', () => {
      opts.onAction();
      remove();
    });
    el.appendChild(action);
  }
  container.appendChild(el);
  while (container.children.length > 4) container.firstElementChild.remove();
  let removed = false;
  const remove = () => {
    if (removed) return;
    removed = true;
    el.classList.add('out');
    setTimeout(() => el.remove(), 250);
  };
  const timer = setTimeout(remove, opts.duration || 4200);
  el.addEventListener('click', (event) => {
    if (event.target.closest('.t-act')) return;
    clearTimeout(timer);
    remove();
  });
}

function startClock() {
  const timeEl = $('#clock-time');
  const dateEl = $('#clock-date');
  if (!timeEl || !dateEl) return;
  const update = () => {
    const now = new Date();
    timeEl.textContent = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false });
    try {
      dateEl.textContent = new Intl.DateTimeFormat('zh-CN', { month: 'numeric', day: 'numeric', weekday: 'short' }).format(now);
    } catch (err) {
      dateEl.textContent = now.toLocaleDateString();
    }
  };
  update();
  clearTimeout(clockTimer);
  const loop = () => {
    update();
    clockTimer = setTimeout(loop, 1000 - (Date.now() % 1000) + 25);
  };
  clockTimer = setTimeout(loop, 1000 - (Date.now() % 1000) + 25);
}

function showDesktop() {
  const open = [...state.windows.values()].filter((win) => !win.minimized);
  if (open.length) {
    open.forEach((win) => minimizeWindow(win));
  } else {
    [...state.windows.values()].forEach((win) => restoreWindow(win));
  }
}

function cycleWindows() {
  const wins = [...state.windows.values()].sort((a, b) => Number(a.el.style.zIndex || 0) - Number(b.el.style.zIndex || 0));
  if (!wins.length) return;
  const visible = wins.filter((win) => !win.minimized);
  const pool = visible.length ? visible : wins;
  const current = pool.findIndex((win) => win.key === state.activeKey);
  const next = pool[(current + 1 + pool.length) % pool.length];
  if (next.minimized) restoreWindow(next);
  else focusWindow(next);
}

function pickFiles() {
  const input = $('#file-input');
  input.value = '';
  input.click();
}

  });

    if (file) setCustomWallpaper(file);
  });
  $('#skin-input').addEventListener('change', (event) => {
    const file = event.target.files && event.target.files[0];

  });

    event.target.value = '';
    if (files.length) handlePluginFiles(files);
  });

  $('#desktop').addEventListener('pointerdown', (event) => {
    if (event.target.closest('.d-icon')) return;
    clearIconSelection();
  });
  $('#desktop').addEventListener('contextmenu', (event) => {
    if (event.target.closest('.d-icon')) return;
    event.preventDefault();
    closeStart();
    clearIconSelection();
    showDesktopMenu(event.clientX, event.clientY);
  });
  $('#desktop').addEventListener('dblclick', (event) => {
    if (event.target.closest('.d-icon')) return;
    closeStart();
    closeMenu();
  });

  document.addEventListener('pointerdown', (event) => {
    if (event.target.closest('#start') || event.target.closest('#taskbar')) return;
    closeStart();
    if (!event.target.closest('#ctx')) closeMenu();
  });

  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
      closeMenu();
      closeStart();
    }
    if ((event.ctrlKey || event.metaKey) && (event.key === 'k' || event.key === 'K')) {
      event.preventDefault();
      openStart(true);
    }
    if ((event.ctrlKey || event.metaKey) && (event.key === 'o' || event.key === 'O') && !event.shiftKey) {
      event.preventDefault();
      pickFiles();
    }
    if ((event.ctrlKey || event.metaKey) && event.shiftKey && (event.key === 'e' || event.key === 'E')) {
      event.preventDefault();
      exportSystem();
    }
    if (event.altKey && event.key === 'Tab') {
      event.preventDefault();
      cycleWindows();
    }
  });

  window.addEventListener('dragenter', (event) => {
    if (!event.dataTransfer || !Array.from(event.dataTransfer.types || []).includes('Files')) return;
    event.preventDefault();
    dragDepth += 1;
    $('#dropzone').classList.add('show');
  });
  window.addEventListener('dragover', (event) => {
    if (!event.dataTransfer || !Array.from(event.dataTransfer.types || []).includes('Files')) return;
    event.preventDefault();
    event.dataTransfer.dropEffect = 'copy';
  });
  window.addEventListener('dragleave', () => {
    dragDepth = Math.max(0, dragDepth - 1);
    if (!dragDepth) $('#dropzone').classList.remove('show');
  });
  window.addEventListener('drop', (event) => {
    event.preventDefault();
    dragDepth = 0;
    $('#dropzone').classList.remove('show');
    if (event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files.length) {

  document.addEventListener('contextmenu', (event) => {
    if (event.target.closest('input,textarea,[contenteditable="true"]')) return;
    if (event.target.closest('#desktop') || event.target.closest('#start') || event.target.closest('#taskbar') || event.target.closest('#ctx') || event.target.closest('#modal-layer')) return;
    event.preventDefault();
  });

    syncTaskbar();

function renderFilesApp(root) {
  root.innerHTML =
    '<div class="files">' +
      '<div class="files-head">' +
        '<div><h2>应用库</h2><p class="sub"></p></div>' +
        '<div class="files-tools">' +
          '<label class="files-search">' + icon('search', 15) + '<input type="text" placeholder="搜索应用" autocomplete="off" spellcheck="false"></label>' +
          '<button class="btn primary" data-act="import">' + icon('import', 15) + '导入应用</button>' +
        '</div>' +
      '</div>' +
      '<div class="files-list"></div>' +
    '</div>';

  const list = $('.files-list', root);
  const query = $('.files-search input', root);
  const sub = $('.files-head .sub', root);

  const paint = () => {
    const apps = [...state.apps.values()].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    const totalSize = apps.reduce((sum, app) => sum + (Number(app.size) || 0), 0);
    sub.textContent = apps.length ? apps.length + ' 个应用 · 占用 ' + fmtBytes(totalSize) : '还没有导入任何应用';
    const q = query.value.trim().toLowerCase();
    const filtered = q
      ? apps.filter((app) => (app.name + ' ' + (app.filename || '')).toLowerCase().includes(q))
      : apps;
    list.innerHTML = '';

    if (!apps.length) {
      const empty = document.createElement('div');
      empty.className = 'files-empty';
      empty.innerHTML =
        '<span class="art">' + icon('import', 26) + '</span>' +
        '<b>应用库是空的</b>' +
        '<p>导入任意单文件 HTML，引擎会自动读取标题、图标与主题色，并把它变成桌面应用。</p>' +
        '<button class="btn primary" data-act="import">' + icon('import', 15) + '导入第一个应用</button>';
      list.appendChild(empty);
      return;
    }

    if (!filtered.length) {
      const empty = document.createElement('div');
      empty.className = 'files-empty';
      empty.innerHTML = '<b>没有匹配的应用</b><p>换一个关键词试试。</p>';
      list.appendChild(empty);
      return;
    }

    for (const app of filtered) {
      const row = document.createElement('div');
      row.className = 'file-row';
      row.dataset.id = app.id;
      row.appendChild(makeArt({ key: app.id, name: app.name, icon: app.icon, size: 40 }));
      const meta = document.createElement('div');
      meta.className = 'meta';
      const name = document.createElement('div');
      name.className = 'nm';
      name.textContent = app.name;
      const detail = document.createElement('div');
      detail.className = 'sub';
      const fname = document.createElement('span');
      fname.textContent = app.filename || '网页应用';
      const dot1 = document.createElement('i');
      dot1.textContent = '·';
      const size = document.createElement('span');
      size.textContent = fmtBytes(app.size);
      const dot2 = document.createElement('i');
      dot2.textContent = '·';
      const date = document.createElement('span');
      date.textContent = fmtDate(app.createdAt) + ' 导入';
      detail.append(fname, dot1, size, dot2, date);
      meta.append(name, detail);
      row.appendChild(meta);

      const actions = document.createElement('div');
      actions.className = 'row-actions';
      const mkBtn = (act, iconName, title, danger) => {
        const btn = document.createElement('button');
        btn.className = 'icon-btn' + (danger ? ' danger' : '');
        btn.dataset.act = act;
        btn.dataset.id = app.id;
        btn.title = title;
        btn.setAttribute('aria-label', title);
        btn.innerHTML = icon(iconName, 15);
        return btn;
      };
      actions.append(
        mkBtn('export', 'export', '导出原始 HTML'),
        mkBtn('rename', 'edit', '重命名'),
        mkBtn('delete', 'trash', '移除应用', true)
      );
      row.appendChild(actions);
      list.appendChild(row);
    }
  };

  list.addEventListener('click', (event) => {
    const actionBtn = event.target.closest('[data-act]');
    if (actionBtn) {
      event.stopPropagation();
      const id = actionBtn.dataset.id;
      if (actionBtn.dataset.act === 'import') pickFiles();
      else if (actionBtn.dataset.act === 'export') exportSingleApp(id);
      else if (actionBtn.dataset.act === 'rename') renameApp(id);
      else if (actionBtn.dataset.act === 'delete') removeApp(id);
      return;
    }
    const row = event.target.closest('.file-row');
    if (row) openApp('app.' + row.dataset.id);
  });

  $('[data-act="import"]', root).addEventListener('click', pickFiles);
  query.addEventListener('input', paint);
  const onChange = () => paint();
  bus.addEventListener('apps-changed', onChange);
  paint();
  return () => bus.removeEventListener('apps-changed', onChange);
}

      '<div class="note-foot"><span class="save-state">已保存</span><span class="count">0 字符</span></div>' +
    '</div>';
  const titleInput = $('.note-title', root);
  const bodyInput = $('.note-body', root);
  const saveState = $('.save-state', root);
  const countEl = $('.count', root);
  let note = { title: '', body: '', updatedAt: 0 };
  try {
    const raw = localStorage.getItem(LS.note);
    if (raw) note = { ...note, ...JSON.parse(raw) };
  } catch (err) {}
  titleInput.value = note.title || '';
  bodyInput.value = note.body || '';

  let timer = 0;
  const updateCount = () => {
    const length = bodyInput.value.length;
    countEl.textContent = length + ' 字符';
  };
  const flush = () => {
    clearTimeout(timer);
    timer = 0;
    note.title = titleInput.value;
    note.body = bodyInput.value;
    note.updatedAt = Date.now();
    try {
      localStorage.setItem(LS.note, JSON.stringify(note));
      const time = new Date(note.updatedAt).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false });
      saveState.textContent = '已保存 · ' + time;
    } catch (err) {
      saveState.textContent = '无法保存';
    }
  };
  const schedule = () => {
    saveState.textContent = '正在保存…';
    updateCount();
    clearTimeout(timer);
    timer = setTimeout(flush, 450);
  };
  titleInput.addEventListener('input', schedule);
  bodyInput.addEventListener('input', schedule);
  $('[data-act="clear"]', root).addEventListener('click', async () => {
    if (!titleInput.value && !bodyInput.value) return;
    const ok = await askConfirm({ title: '清空备忘录', message: '当前笔记内容将被清空，此操作不可撤销。', danger: true, confirmText: '清空' });
    if (!ok) return;
    titleInput.value = '';
    bodyInput.value = '';
    flush();
    bodyInput.focus();
  });
  updateCount();
  if (note.updatedAt) {
    const time = new Date(note.updatedAt).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false });
    saveState.textContent = '已保存 · ' + time;
  }
  setTimeout(() => bodyInput.focus(), 200);
  return () => {
    if (timer) flush();
  };
}

function decodeHtmlBuffer(buffer) {
  const bytes = new Uint8Array(buffer);
  const headBytes = bytes.slice(0, Math.min(bytes.length, 8192));
  let head = '';
  for (let i = 0; i < headBytes.length; i++) head += String.fromCharCode(headBytes[i]);
  let label = 'utf-8';
  const match = head.match(/<meta[^>]+charset\s*=\s*["']?\s*([a-zA-Z0-9_-]+)/i) || head.match(/charset\s*=\s*["']?\s*([a-zA-Z0-9_-]+)/i);
  if (match) label = match[1].toLowerCase();
  try {
    return new TextDecoder(label, { fatal: false }).decode(bytes);
  } catch (err) {
    try {
      return new TextDecoder('utf-8', { fatal: false }).decode(bytes);
    } catch (err2) {
      return '';
    }
  }
}

function analyzeHtml(html, filename, size) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const og = doc.querySelector('meta[property="og:title"]') || doc.querySelector('meta[name="og:title"]');
  const ogTitle = og ? (og.getAttribute('content') || '') : '';
  const title = (ogTitle || doc.title || '').trim().replace(/\s+/g, ' ');
  let name = title || String(filename || '').replace(/\.[^.]+$/, '');
  name = Array.from(name.trim()).slice(0, 80).join('') || '未命名应用';
  const link = doc.querySelector('link[rel~="icon"]') || doc.querySelector('link[rel="shortcut icon"]') || doc.querySelector('link[rel="apple-touch-icon"]');
  const href = link ? (link.getAttribute('href') || '').trim() : '';
  let iconValue = '';
  if (/^data:image\//i.test(href)) iconValue = href;
  else if (/^https?:\/\//i.test(href)) iconValue = href;
  let accent = '';
  const themeMeta = doc.querySelector('meta[name="theme-color"]');
  if (themeMeta) {
    const value = (themeMeta.getAttribute('content') || '').trim();
    if (/^#[0-9a-f]{6}$/i.test(value)) accent = value;
  }
  let bytes = Number(size) || 0;
  if (!bytes) {
    try { bytes = new TextEncoder().encode(html).length; } catch (err) { bytes = html.length; }
  }
  return { name, icon: iconValue, accent, html, filename, size: bytes };
}

async function readFileText(file) {
  const buffer = await file.arrayBuffer();
  return decodeHtmlBuffer(buffer);
}

function buildAppFromText(html, filename, size) {
  if (!html.trim()) throw new Error('文件内容为空');
  const meta = analyzeHtml(html, filename, size);
  return {
    ...meta,
    id: uid('app'),
    createdAt: Date.now(),
    updatedAt: Date.now(),
    group: currentGroup()
  };
}

async function buildAppFromFile(file) {
  return buildAppFromText(await readFileText(file), file.name, file.size);
}

function isHtmlFile(file) {
  return /\.(html?|xhtml)$/i.test(file.name || '') || file.type === 'text/html';
}

async function storeImported(app) {
  const existing = [...state.apps.values()].find((item) => item.filename === app.filename && item.group === app.group);
  if (existing) {
    app.id = existing.id;
    app.createdAt = existing.createdAt;
  }
  const persisted = await persistApp(app);
  state.apps.set(app.id, app);
  const win = state.windows.get('app.' + app.id);
  if (win) {
    win.app = app;
    win.titleEl.textContent = app.name;
    win.el.setAttribute('aria-label', app.name);
    if (win.iframe) {
      win.iframe.setAttribute('title', app.name);
      win.iframe.srcdoc = app.html;
    }
    const art = win.el.querySelector('.win-title .t-art');
    if (art) art.replaceWith(makeArt({ key: app.id, name: app.name, icon: app.icon, size: 18, className: 't-art' }));
  }
  return { app, updated: Boolean(existing), persisted };
}

async function importFiles(files) {
  const htmlFiles = [];
  const cssFiles = [];
  const jsFiles = [];
  for (const file of files || []) {
    if (/\.css$/i.test(file.name || '') || file.type === 'text/css') cssFiles.push(file);
    else if (/\.js$/i.test(file.name || '') || file.type === 'text/javascript') jsFiles.push(file);
    else if (isHtmlFile(file)) htmlFiles.push(file);
  }
  if (!htmlFiles.length && !cssFiles.length && !jsFiles.length) {
    toast('请选择 HTML 应用、皮肤（.css）或插件（.html / .js）文件', 'warn');
    return;
  }

  for (const file of cssFiles) {
    try {
      const text = await readFileText(file);
      await loadSkinText(text, file.name);
    } catch (err) {
      console.error(err);
      toast('「' + file.name + '」读取失败', 'error');
    }
  }
  for (const file of jsFiles) {
    try {
      const text = await readFileText(file);
      if (!looksLikePlugin(text, file.name)) {
        toast('「' + file.name + '」不是插件脚本', 'warn');
        continue;
      }
      await installPluginFromEditor(text, file.name);
    } catch (err) {
      console.error(err);
      toast('「' + file.name + '」插件安装失败', 'error');
    }
  }
  if (!htmlFiles.length) return;

  const results = [];
  for (const file of htmlFiles) {
    if (file.size > 15 * 1024 * 1024) {
      const ok = await askConfirm({
        title: '文件较大',
        message: '「' + file.name + '」大小为 ' + fmtBytes(file.size) + '，导入后可能影响运行流畅度。仍要继续吗？',
        confirmText: '继续导入'
      });
      if (!ok) continue;
    }
    try {
      const text = await readFileText(file);
      if (!text.trim()) {
        toast('「' + file.name + '」内容为空', 'warn');
        continue;
      }
      if (looksLikePlugin(text, file.name)) {
        await installPluginFromEditor(text, file.name);
        continue;
      }
      if (looksLikeSkin(text, file.name)) {
        const useSkin = await askConfirm({
          title: '这是界面皮肤',
          message: '「' + file.name + '」带有 UI 引擎的皮肤标记。\n\n应用后整个系统界面会立即变成它的设计；选择「当作应用导入」则它只作为一个普通网页应用打开。',
          confirmText: '应用皮肤',
          cancelText: '当作应用导入'
        });
        if (useSkin) {
          await loadSkinText(text, file.name);
          continue;
        }
      }
      const app = buildAppFromText(text, file.name, file.size);
      results.push(await storeImported(app));
    } catch (err) {
      console.error(err);
      toast('「' + file.name + '」导入失败', 'error');
    }
  }
  if (!results.length) return;
  emit('apps-changed');
  const last = results[results.length - 1];
  renderDesktopIcons('app.' + last.app.id);
  if (results.length === 1) {
    toast((last.updated ? '已更新' : '已导入') + '「' + last.app.name + '」', last.persisted ? 'success' : 'warn', {
      action: '打开',
      onAction: () => openApp('app.' + last.app.id)
    });
  } else {
    toast('已导入 ' + results.length + ' 个应用', 'success', {
      action: '查看',
      onAction: () => openApp('files')
    });
  }
  if (results.some((item) => !item.persisted)) {
    toast('部分应用无法写入本地存储，本次会话内仍可使用', 'warn');
  }
}

function safeFileName(name) {
  const base = String(name || 'app').replace(/[\\/:*?"<>|]+/g, '-').replace(/\s+/g, ' ').trim().slice(0, 60) || 'app';
  return /\.html?$/i.test(base) ? base : base + '.html';
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const anchor = document.createElement('a');
  anchor.href = url;
  anchor.download = filename;
  anchor.style.display = 'none';
  document.body.appendChild(anchor);
  anchor.click();
  anchor.remove();
  setTimeout(() => URL.revokeObjectURL(url), 8000);
}

function downloadText(text, filename) {
  downloadBlob(new Blob([text], { type: 'text/html;charset=utf-8' }), filename);
}

function exportSingleApp(id) {
  const app = state.apps.get(id);
  if (!app) return;
  const filename = safeFileName(app.filename || app.name);
  downloadText(app.html, filename);
  toast('已导出「' + filename + '」', 'success');
}

function todayStamp() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
}

function buildExportHtml() {
  const clone = document.documentElement.cloneNode(true);
  clone.removeAttribute('style');
  clone.classList.remove('booting');
  const body = clone.querySelector('body');
  if (body) body.classList.remove('ready', 'is-dragging', 'is-resizing', 'dragging-shield');

  for (const selector of ['#desktop-icons', '#windows', '#tb-tasks', '#tb-plugin-widgets', '#start-apps', '#toasts', '#modal', '#ctx']) {
    const node = clone.querySelector(selector);
    if (node) node.innerHTML = '';
  }
  clone.querySelectorAll('[data-mirage-plugin]').forEach((node) => node.remove());

  const start = clone.querySelector('#start');
  if (start) {
    start.classList.remove('open');
    start.setAttribute('aria-hidden', 'true');
  }
  const ctx = clone.querySelector('#ctx');
  if (ctx) {
    ctx.classList.remove('open');
    ctx.setAttribute('aria-hidden', 'true');
  }
  const startBtn = clone.querySelector('#start-btn');
  if (startBtn) {
    startBtn.classList.remove('active');
    startBtn.setAttribute('aria-expanded', 'false');
  }
  const layer = clone.querySelector('#modal-layer');
  if (layer) {
    layer.classList.remove('open');
    layer.setAttribute('aria-hidden', 'true');
  }
  const dropzone = clone.querySelector('#dropzone');
  if (dropzone) dropzone.classList.remove('show');
  const shield = clone.querySelector('#drag-shield');
  if (shield) shield.classList.remove('on');
  const snap = clone.querySelector('#snap-preview');
  if (snap) {
    snap.classList.remove('show');
    snap.removeAttribute('style');
  }
  const boot = clone.querySelector('#boot');
  if (boot) {
    boot.classList.remove('done');
    boot.removeAttribute('style');
  }
  const bootFill = clone.querySelector('#boot-fill');
  if (bootFill) bootFill.removeAttribute('style');
  const bootTip = clone.querySelector('#boot-tip');
  if (bootTip) bootTip.textContent = '正在初始化桌面环境…';
  const clockTime = clone.querySelector('#clock-time');
  if (clockTime) clockTime.textContent = '--:--';
  const clockDate = clone.querySelector('#clock-date');
  if (clockDate) clockDate.textContent = '';
  const wpImage = clone.querySelector('#wp-image');
  if (wpImage) wpImage.removeAttribute('src');
  const wp = clone.querySelector('#wallpaper');
  if (wp) wp.removeAttribute('style');
  const search = clone.querySelector('#start-search');
  if (search) search.removeAttribute('value');

  const oldData = clone.querySelector('#embedded-data');
  if (oldData) oldData.remove();

  const apps = [...state.apps.values()].map((app) => ({
    id: app.id,
    name: app.name,
    filename: app.filename,
    html: app.html,
    icon: app.icon || '',
    accent: app.accent || '',
    size: Number(app.size) || 0,
    createdAt: app.createdAt || Date.now(),
    updatedAt: app.updatedAt || app.createdAt || Date.now()
  }));

  const plugins = [...pluginState.records.values()]
    .filter((rec) => rec.enabled)
    .map((rec) => ({
      id: rec.id,
      name: rec.name,
      version: rec.version,
      author: rec.author,
      description: rec.description,
      source: rec.source,
      filename: rec.filename,
      priority: rec.priority || 0,
      enabled: true
    }));

  const payload = {
    app: 'mirage-os',
    version: VERSION,
    exportId: uid('exp'),
    exportedAt: Date.now(),
    settings: { ...settings },
    apps,
    plugins
  };

  const script = document.createElement('script');
  script.type = 'application/json';
  script.id = 'embedded-data';
  script.textContent = JSON.stringify(payload)
    .replace(/</g, '\\u003c')
    .replace(/\u2028/g, '\\u2028')
    .replace(/\u2029/g, '\\u2029');
  if (body) body.appendChild(script);

  const titleNode = clone.querySelector('title');
  if (titleNode) titleNode.textContent = apps.length ? '幻境 OS · 我的系统' : '幻境 OS';

  return {
    html: '<!DOCTYPE html>\n' + clone.outerHTML,
    count: apps.length
  };
}

function compressImage(file, maxWidth, quality) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        const scale = Math.min(1, maxWidth / Math.max(1, img.naturalWidth || img.width));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round((img.naturalWidth || img.width) * scale));
        canvas.height = Math.max(1, Math.round((img.naturalHeight || img.height) * scale));
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#0b1020';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        resolve(canvas.toDataURL('image/jpeg', quality));
      } catch (err) {
        URL.revokeObjectURL(url);
        reject(err);
      }
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error('无法读取图片'));
    };
    img.src = url;
  });
}

const PLUGIN_API = 1;
const PLUGIN_MAX_BYTES = 2 * 1024 * 1024;
const PLUGIN_AUTO_FILES = ['plugin.html', 'plugin.js'];
const PLUGIN_AUTO_MANIFESTS = ['plugins.json', 'mirage-plugins.json'];
const PLUGIN_SOURCE_PREFIX = 'mirage-plugin://';
const CORE_HOOK_NAMES = ['openApp', 'closeWindow', 'renderDesktopIcons', 'renderStartApps', 'applySettings', 'setSettings', 'toast', 'showMenu'];

const coreHooks = new Map();

function runCoreHook(name, fallback, args) {
  const list = coreHooks.get(name);
  if (!list || !list.length || pluginState.reloading) return fallback.apply(null, args);
  let index = -1;
  const next = (...passed) => {
    const callArgs = passed.length ? passed : args;
    index += 1;
    if (index < list.length) {
      const hook = list[index];
      try {
        return hook.fn(next, ...callArgs);
      } catch (err) {
        pluginError(hook.pluginId, err, { silent: true });
        return next(...callArgs);
      }
    }
    return fallback.apply(null, callArgs);
  };
  return next(...args);
}

function openApp(key) { return runCoreHook('openApp', openAppImpl, [key]); }
function closeWindow(win) { return runCoreHook('closeWindow', closeWindowImpl, [win]); }
function renderDesktopIcons(animateKey) { return runCoreHook('renderDesktopIcons', renderDesktopIconsImpl, [animateKey]); }
function renderStartApps(query) { return runCoreHook('renderStartApps', renderStartAppsImpl, [query]); }
function applySettings() { return runCoreHook('applySettings', applySettingsImpl, []); }
function setSettings(patch, opts) { return runCoreHook('setSettings', setSettingsImpl, [patch, opts]); }
function toast(message, type, opts) { return runCoreHook('toast', toastImpl, [message, type, opts]); }
function showMenu(items, x, y) { return runCoreHook('showMenu', showMenuImpl, [items, x, y]); }

const pluginState = {
  records: new Map(),
  runtimes: new Map(),
  apps: new Map(),
  icons: [],
  menuItems: [],
  sections: [],
  activeId: null,
  lastActive: null,
  booting: false,
  bootIds: [],
  bootLast: null,
  safeMode: false,
  auto: 'idle',
  autoCount: 0,
  hydrated: false,
  reloading: false,
  intentionalReload: false,
  reporting: false,
  lastToast: 0,
  errors: []
};

function pluginCtxError(message) {
  const err = new Error(message);
  err.pluginApi = true;
  return err;
}

function readCrashState() {
  try {
    const raw = localStorage.getItem(LS.pluginState);
    return raw ? (JSON.parse(raw) || {}) : {};
  } catch (err) {
    return {};

}

function writeCrashState(next) {
  try { localStorage.setItem(LS.pluginState, JSON.stringify(next)); } catch (err) {}
}

function readPluginErrors() {
  try {
    const raw = localStorage.getItem(LS.pluginErrors);
    const list = raw ? JSON.parse(raw) : [];
    return Array.isArray(list) ? list.slice(0, 40) : [];
  } catch (err) {

}

function savePluginErrors() {

}

function readBootMarker() {

}

function writeBootMarker(marker) {

}

function clearBootMarker() {
